<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manage Teams | RRTA</title><link rel="stylesheet" href="styles.css"><style>
.side-link{display:flex;align-items:center;gap:11px;text-decoration:none}.side-icon{width:19px;height:19px;flex:0 0 19px}.side-icon svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8}.sidebar-section-label{padding:18px 18px 7px;color:#9ca3aa;font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.team-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.team-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px}.team-card h3{margin:0 0 4px}.team-count{font-size:12px;color:var(--muted);margin-bottom:12px}.member{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:13px}.member:first-of-type{border-top:0}.member small{display:block;color:var(--muted)}.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.tools input{min-width:280px;padding:11px 12px;border:1px solid #cfd6db;border-radius:8px}.empty-state{padding:32px;text-align:center;color:var(--muted);border:1px dashed #cfd6db;border-radius:10px;background:#fafbfc}@media(max-width:1000px){.team-grid{grid-template-columns:1fr 1fr}}@media(max-width:650px){.team-grid{grid-template-columns:1fr}.tools input{min-width:100%}}
</style></head><body>
<header class="site-header"><div class="header-inner"><img src="rrta-logo.png" class="brand-logo" alt="Rapid Response Training Academy"><div id="headerUser" class="header-user"></div></div></header>
<main><div class="portal-shell"><aside class="sidebar"><div class="sidebar-title">Trainer / Assessor</div><div class="sidebar-section-label">Workspace</div><a class="side-link" href="trainer.html"><span class="side-icon"><svg viewBox="0 0 24 24"><path d="M3 13h7V3H3zM14 21h7V11h-7zM3 21h7v-4H3zM14 7h7V3h-7z"/></svg></span><span>Overview</span></a><a class="side-link" href="trainer.html#learners"><span class="side-icon"><svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg></span><span>Manage learners</span></a><a class="side-link" href="trainer.html#courses"><span class="side-icon"><svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></span><span>Courses</span></a><a class="side-link active" href="compliance-operatives.html"><span class="side-icon"><svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg></span><span>Compliance</span></a><div class="sidebar-section-label">Account</div><a class="side-link" href="trainer.html"><span>←</span><span>Back to trainer portal</span></a></aside><section class="portal-content">
<div class="page-head"><div><div class="eyebrow">Compliance</div><h1>Manage Teams</h1><p>See each manager and everyone linked to them through Primary, Second or Third Manager.</p></div></div>
<div class="tools"><input id="search" placeholder="Search manager or team member…"></div><div id="teams"></div>
</section></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="compliance-menu.js"></script><script>
const db=window.supabase.createClient('https://qgbpotjqggeodxqcwkgj.supabase.co','sb_publishable_J1yPM1Hi7INCX2m7rp3PdA_JdQ46FRS');const esc=(v='')=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));let people=[];
function personName(p){return [p.forename,p.surname].filter(Boolean).join(' ')||p.full_name||'Unnamed'}
async function requireTrainer(){const {data:{session}}=await db.auth.getSession();if(!session){location.href='trainer.html';return false}const {data,error}=await db.rpc('get_current_profile');if(error)throw error;const p=Array.isArray(data)?data[0]:data;if(!p||String(p.role).toLowerCase()!=='trainer')throw new Error('Trainer access required.');document.getElementById('headerUser').textContent=`${p.full_name||'Trainer'} · Trainer`;return true}
async function load(){const {data,error}=await db.from('profiles').select('id,full_name,forename,surname,employee_number,job_title,organisation,role,account_status,manager_1_id,manager_2_id,manager_3_id').order('full_name');if(error)throw error;people=data||[];render()}
function render(){const q=document.getElementById('search').value.trim().toLowerCase();const members=people.filter(p=>String(p.role).toLowerCase()==='learner'&&(p.account_status||'active')!=='archived');const managers=people.map(p=>{const team=members.filter(m=>[m.manager_1_id,m.manager_2_id,m.manager_3_id].includes(p.id));return {person:p,team}}).filter(x=>x.team.length);const unassigned=members.filter(m=>![m.manager_1_id,m.manager_2_id,m.manager_3_id].some(Boolean));const filtered=managers.filter(x=>{const txt=`${personName(x.person)} ${x.person.job_title||''} ${x.team.map(personName).join(' ')}`.toLowerCase();return !q||txt.includes(q)});const box=document.getElementById('teams');let html=`<div class="team-grid">${filtered.sort((a,b)=>personName(a.person).localeCompare(personName(b.person))).map(x=>`<article class="team-card"><h3>${esc(personName(x.person))}</h3><div class="team-count">${x.team.length} team member${x.team.length===1?'':'s'}${x.person.job_title?` · ${esc(x.person.job_title)}`:''}</div>${x.team.sort((a,b)=>personName(a).localeCompare(personName(b))).map(m=>`<div class="member"><div><strong>${esc(personName(m))}</strong><small>${esc(m.job_title||'No job title')} · ${esc(m.employee_number||'No employee no.')}</small></div><button class="mini-btn" onclick="location.href='learner-profile.html?id=${encodeURIComponent(m.id)}'">View</button></div>`).join('')}</article>`).join('')}</div>`;if(!filtered.length)html='<div class="empty-state">No teams match this search.</div>';if(!q&&unassigned.length)html+=`<article class="panel" style="margin-top:18px"><div class="panel-head"><h2>Unassigned operatives</h2></div><p class="muted">These people do not currently have a Primary, Second or Third Manager.</p><div class="record-list">${unassigned.map(m=>`<div class="record"><div><strong>${esc(personName(m))}</strong><small>${esc(m.job_title||'No job title')} · ${esc(m.employee_number||'No employee no.')}</small></div><button class="mini-btn" onclick="location.href='learner-profile.html?id=${encodeURIComponent(m.id)}'">Assign manager</button></div>`).join('')}</div></article>`;box.innerHTML=html}
document.getElementById('search').addEventListener('input',render);(async()=>{try{if(await requireTrainer())await load()}catch(e){document.querySelector('.portal-content').innerHTML=`<div class="error">${esc(e.message||'Unable to load teams.')}</div>`}})();
</script></body></html>
