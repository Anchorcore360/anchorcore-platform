.side-link{display:flex;align-items:center;gap:11px;text-decoration:none}.side-icon{width:19px;height:19px;flex:0 0 19px}.side-icon svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8}.sidebar-section-label{padding:18px 18px 7px;color:#9ca3aa;font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.team-grid{display:grid;grid-template-columns:1fr;gap:12px}.team-card{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 2px 10px rgba(15,23,42,.04)}.team-head{display:grid;grid-template-columns:minmax(240px,1.4fr) minmax(130px,.65fr) minmax(180px,.8fr) auto;align-items:center;gap:12px;padding:14px 18px;cursor:pointer}.manager-summary{display:flex;align-items:center;gap:12px;min-width:0}.manager-avatar{width:46px;height:46px;border-radius:10px;background:#eef1f3;display:grid;place-items:center;font-weight:800;flex:0 0 46px}.metric-box{background:#f7f8f9;border:1px solid #edf0f2;border-radius:9px;padding:9px 12px}.metric-box strong{font-size:18px;display:block}.team-breakdown{display:flex;gap:8px;flex-wrap:wrap;padding:0 18px 14px}.status-chip{font-size:12px;font-weight:800;border-radius:999px;padding:6px 9px;background:#f3f5f6}.status-chip.good{background:#eaf7ef}.status-chip.warn{background:#fff4d9}.status-chip.bad{background:#fdeaea}.status-chip.muted{color:#6b7280}.metric-box small{color:var(--muted)}.team-head-main{min-width:0}.team-card h3{margin:0 0 4px}.team-count{font-size:12px;color:var(--muted)}.team-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.compliance-pill{font-size:12px;font-weight:800;padding:6px 9px;border-radius:999px;background:#eef2f4}.team-body{padding:0 18px 14px}.team-card.collapsed .team-body{display:none}.toggle-btn{min-width:88px}.overview-actions{display:flex;gap:8px;flex-wrap:wrap}.manager-link{color:inherit;text-decoration:none}.manager-link:hover{text-decoration:underline}.member{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:13px}.member:first-of-type{border-top:0}.member small{display:block;color:var(--muted)}.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.tools input{min-width:280px;padding:11px 12px;border:1px solid #cfd6db;border-radius:8px}.empty-state{padding:32px;text-align:center;color:var(--muted);border:1px dashed #cfd6db;border-radius:10px;background:#fafbfc}.portal-content:before,.portal-content:after{display:none!important}.sidebar::after{display:none!important;content:none!important}.member{align-items:center}.member-info{display:grid;grid-template-columns:minmax(190px,1fr) minmax(150px,.8fr) minmax(120px,.6fr);gap:12px;align-items:center;flex:1}.member-role{font-size:12px;color:var(--muted)}.member-score{font-size:12px;font-weight:800}.member-score.na{color:var(--muted);font-weight:600}@media(max-width:1000px){.team-head{grid-template-columns:1fr auto auto}.team-head .metric-box:nth-of-type(2){display:none}}@media(max-width:650px){.team-head{grid-template-columns:1fr auto}.team-head .metric-box{display:none}.tools input{min-width:100%}}

<header class="site-header"><div class="header-inner"><img src="rrta-logo.png" class="brand-logo" alt="Rapid Response Training Academy"><div id="headerUser" class="header-user"></div></div></header>
<main><div class="portal-shell"><aside class="sidebar" data-portal-nav></aside><section class="portal-content">
<div class="page-head"><div><div class="eyebrow">Compliance</div><h1>Manage Teams</h1><p>Primary managers with their direct reports and team compliance overview.</p></div></div>
<div class="tools"><input id="search" placeholder="Search manager or team member…"><div class="overview-actions"><button id="expandAll" class="mini-btn">Expand all</button><button id="collapseAll" class="mini-btn">Collapse all</button></div></div><div id="teams"></div>
</section></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="compliance-menu.js"></script><script>
const db=window.supabase.createClient('https://qgbpotjqggeodxqcwkgj.supabase.co','sb_publishable_J1yPM1Hi7INCX2m7rp3PdA_JdQ46FRS');const esc=(v='')=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));let people=[];let personRows=[];let personRoleMap=new Map();let requirements=[];let accreditations=[];
function personName(p){return [p.forename,p.surname].filter(Boolean).join(' ')||p.full_name||'Unnamed'}
async function requireAcademyAccess(){const {data:{session}}=await db.auth.getSession();if(!session){location.href='portal.html';return false}const {data,error}=await db.rpc('get_current_profile');if(error)throw error;const p=Array.isArray(data)?data[0]:data;const access=String(p?.organisational_access_role||p?.portal_access_role||'').toLowerCase();if(!p||(!['academy_staff','academy','health_safety','operations_manager','administrator'].includes(access)&&p.permission_level!=='super_user'))throw new Error('Academy access required.');document.getElementById('headerUser').textContent=`${p.full_name||'Trainer'} · Trainer`;return true}
async function load(){const [profilesRes,peopleRes,relsRes,rolesRes,reqRes,accRes]=await Promise.all([db.from('profiles').select('id,full_name,forename,surname,employee_number,job_title,organisation,role,account_status').order('full_name'),db.from('people').select('id,profile_id,full_name,forename,surname,employee_number,job_title,status,default_company_id').eq('status','active').order('full_name'),db.from('profiles').select('id,manager_1_id'),db.from('person_job_roles').select('person_id,job_role_id,is_primary'),db.from('job_role_requirements').select('job_role_id,compliance_item_id,status').eq('status','required'),db.from('accreditations').select('person_id,accreditation_catalog_id,status,expiry_date,archived_at').is('archived_at',null)]);if(profilesRes.error)throw profilesRes.error;if(peopleRes.error)throw peopleRes.error;if(relsRes.error)throw relsRes.error;if(rolesRes.error)throw rolesRes.error;if(reqRes.error)throw reqRes.error;if(accRes.error)throw accRes.error;requirements=reqRes.data||[];accreditations=accRes.data||[];people=profilesRes.data||[];const primaryManagerByProfile=new Map((relsRes.data||[]).map(r=>[r.id,r.manager_1_id]));personRoleMap=new Map();(rolesRes.data||[]).forEach(r=>{if(!personRoleMap.has(r.person_id))personRoleMap.set(r.person_id,[]);personRoleMap.get(r.person_id).push(r)});personRows=(peopleRes.data||[]).map(p=>({...p,manager_1_id:primaryManagerByProfile.get(p.profile_id)||null,has_compliance_role:(personRoleMap.get(p.id)||[]).length>0}));render()}
function memberScore(m){const roles=personRoleMap.get(m.id)||[];if(!roles.length)return null;const roleIds=roles.map(r=>String(r.job_role_id));const req=[...new Set(requirements.filter(r=>roleIds.includes(String(r.job_role_id))).map(r=>String(r.compliance_item_id)))];if(!req.length)return null;const own=accreditations.filter(a=>a.person_id===m.id);let ok=0;for(const itemId of req){const a=own.find(x=>String(x.accreditation_catalog_id)===itemId);if(a&&a.status!=='expired')ok++}return Math.round(ok/req.length*100)}
function teamScore(team){const eligible=team.filter(m=>m.has_compliance_role);if(!eligible.length)return null;let required=0,current=0,expiring=0,missing=0;for(const m of eligible){const roleIds=(personRoleMap.get(m.id)||[]).map(r=>String(r.job_role_id));const req=[...new Set(requirements.filter(r=>roleIds.includes(String(r.job_role_id))).map(r=>String(r.compliance_item_id)))];required+=req.length;const own=accreditations.filter(a=>a.person_id===m.id);for(const itemId of req){const a=own.find(x=>String(x.accreditation_catalog_id)===itemId);if(!a||a.status==='expired')missing++;else if(a.status==='expiring')expiring++;else current++}}return {score:required?Math.round((current+expiring)/required*100):null,eligible:eligible.length,excluded:team.length-eligible.length,current,expiring,missing}}
function render(){const q=document.getElementById('search').value.trim().toLowerCase();const members=personRows;const managers=people.map(p=>({person:p,team:members.filter(m=>m.manager_1_id===p.id)})).filter(x=>x.team.length);const unassigned=members.filter(m=>!m.manager_1_id);const filtered=managers.filter(x=>{const txt=`${personName(x.person)} ${x.person.job_title||''} ${x.team.map(personName).join(' ')}`.toLowerCase();return !q||txt.includes(q)});const box=document.getElementById('teams');let html=`<div class="team-grid">${filtered.sort((a,b)=>personName(a.person).localeCompare(personName(b.person))).map(x=>{const score=teamScore(x.team);return `<article class="team-card collapsed" data-manager="${esc(x.person.id)}"><div class="team-head"><div class="manager-summary"><div class="manager-avatar">${esc((x.person.forename||x.person.full_name||'?').slice(0,1)+(x.person.surname||'').slice(0,1))}</div><div class="team-head-main"><h3><a class="manager-link" href="learner-profile.html?id=${encodeURIComponent(x.person.id)}&team=1">${esc(personName(x.person))}</a></h3><div class="team-count">${esc(x.person.job_title||'Manager')}</div></div></div><div class="metric-box"><strong>${x.team.length}</strong><small>Team member${x.team.length===1?'':'s'}</small></div><div class="metric-box"><strong>${score===null||score.score===null?'—':score.score+'%'}</strong><small>${score===null?'No assigned roles to score':`${score.eligible} scored · ${score.excluded} excluded`}</small></div><div class="team-actions"><button type="button" class="mini-btn toggle-btn">Expand</button></div></div><div class="team-breakdown">${score?`<span class="status-chip good">${score.current} current</span><span class="status-chip warn">${score.expiring} expiring</span><span class="status-chip bad">${score.missing} missing / expired</span>${score.excluded?`<span class="status-chip muted">${score.excluded} not scored</span>`:''}`:'<span class="status-chip muted">No team members have a compliance job role</span>'}</div><div class="team-body">${x.team.sort((a,b)=>personName(a).localeCompare(personName(b))).map(m=>{const ms=memberScore(m);const roles=personRoleMap.get(m.id)||[];return `<div class="member"><div class="member-info"><div><strong>${esc(personName(m))}</strong><small>${esc(m.employee_number||'No employee no.')}</small></div><div class="member-role">${esc(m.job_title||'No job title')}${roles.length?` · ${roles.length} compliance role${roles.length===1?'':'s'}`:' · No compliance job role'}</div><div class="member-score ${ms===null?'na':''}">${ms===null?'Not scored':ms+'% compliant'}</div></div><button class="mini-btn" onclick="location.href='learner-profile.html?person_id=${encodeURIComponent(m.id)}'">View</button></div>`}).join('')}</div></article>`}).join('')}</div>`;if(!filtered.length)html='<div class="empty-state">No primary-manager teams match this search.</div>';if(!q&&unassigned.length)html+=`<article class="team-card collapsed" id="unassignedCard" style="margin-top:18px"><div class="team-head"><div class="team-head-main"><h3>Unassigned operatives</h3><div class="team-count">${unassigned.length} operative${unassigned.length===1?'':'s'} without a Primary Manager</div></div><button type="button" class="mini-btn toggle-btn">Expand</button></div><div class="team-body">${unassigned.map(m=>`<div class="member"><div><strong>${esc(personName(m))}</strong><small>${esc(m.job_title||'No job title')} · ${esc(m.employee_number||'No employee no.')}</small></div><button class="mini-btn" onclick="location.href='learner-profile.html?person_id=${encodeURIComponent(m.id)}'">Assign manager</button></div>`).join('')}</div></article>`;box.innerHTML=html;box.querySelectorAll('.team-head').forEach(head=>head.addEventListener('click',e=>{if(e.target.closest('a'))return;const card=head.closest('.team-card');card.classList.toggle('collapsed');const b=card.querySelector('.toggle-btn');if(b)b.textContent=card.classList.contains('collapsed')?'Expand':'Collapse'}))}
document.getElementById('search').addEventListener('input',render);document.getElementById('expandAll').addEventListener('click',()=>document.querySelectorAll('.team-card').forEach(card=>{card.classList.remove('collapsed');const b=card.querySelector('.toggle-btn');if(b)b.textContent='Collapse'}));document.getElementById('collapseAll').addEventListener('click',()=>document.querySelectorAll('.team-card').forEach(card=>{card.classList.add('collapsed');const b=card.querySelector('.toggle-btn');if(b)b.textContent='Expand'}));(async()=>{try{if(await requireAcademyAccess())await load()}catch(e){document.querySelector('.portal-content').innerHTML=`<div class="error">${esc(e.message||'Unable to load teams.')}</div>`}})();
</script><script src="portal-navigation.js?v=20260918-2"></script></body></html>
