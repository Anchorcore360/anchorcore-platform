function matrix(){el('title').textContent='Learning Matrix';el('subtitle').textContent='Workplace learning only. Separate from occupational qualifications and Staffology job titles.';el('controls').innerHTML='<input id="search" placeholder="Search person or company"><select id="workforce"><option value="">All workforce</option><option>RRT Employee</option><option>Subcontractor</option></select><select id="group"><option value="">All learning groups</option>'+groups.filter(g=>g.active).map(g=>'<option value="'+g.id+'">'+esc(g.name)+'</option>').join('')+'</select><button id="export">Export Excel</button><button id="assign">Assign outstanding required courses</button>';for(const id of ['search','workforce','group'])el(id).oninput=renderMatrix;el('export').onclick=()=>{if(typeof XLSX==='undefined')return message('Excel export unavailable.');const rows=[['Person','HR job title','Workforce','Company','Learning compliance',...courses.map(c=>c.title)],...visible.map(p=>[p.full_name,p.job_title,p.workforce,p.company,score(p),...courses.map(c=>state(p,c).text)])];const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),'Learning Matrix');XLSX.writeFile(wb,'RRTA_Learning_Matrix.xlsx')};el('assign').onclick=assignOutstanding;renderMatrix()}

function groupPage(){el('title').textContent='Learning Groups';el('subtitle').textContent='LMS memberships only. Edit a person’s groups without changing their occupational job roles.';el('controls').innerHTML='<input id="newGroup" placeholder="New group name"><button id="addGroup">Add group</button>';el('addGroup').onclick=async()=>{const name=el('newGroup').value.trim();if(!name)return;const r=await db.from('learning_groups').insert({name});if(r.error)return message(r.error.message);await load()};el('main').innerHTML='<div class="table-wrap"><table><thead><tr><th>Person</th><th>Workforce</th>'+groups.filter(g=>g.active).map(g=>'<th>'+esc(g.name)+'</th>').join('')+'</tr></thead><tbody>'+people.map(p=>'<tr><td><a href="learner-profile.html?person_id='+encodeURIComponent(p.id)+'">'+esc(p.full_name)+'</a></td><td>'+esc(p.workforce)+'</td>'+groups.filter(g=>g.active).map(g=>'<td><input type="checkbox" aria-label="'+esc(p.full_name+' '+g.name)+'" data-person="'+p.id+'" data-group="'+g.id+'" '+(groupIds(p).has(g.id)?'checked':'')+'></td>').join('')+'</tr>').join('')+'</tbody></table></div>';el('main').querySelectorAll('input[data-person]').forEach(b=>b.onchange=async()=>{b.disabled=true;const person_id=b.dataset.person,group_id=Number(b.dataset.group),r=b.checked?await db.from('person_learning_groups').upsert({person_id,group_id},{onConflict:'person_id,group_id',ignoreDuplicates:true}):await db.from('person_learning_groups').delete().eq('person_id',person_id).eq('group_id',group_id);if(r.error){b.checked=!b.checked;message(r.error.message)}else message('Learning membership saved.');b.disabled=false})}
function requirementsPage(){el('title').textContent='Learning Requirements Matrix';el('subtitle').textContent='Select mandatory online courses for each learning group. Shared requirements are counted once.';el('controls').innerHTML='<button id="save">Save changes</button><button id="reset">Discard changes</button>';const initial=new Set(requirements.map(r=>key(r.group_id,r.course_id)));el('main').innerHTML='<div class="table-wrap"><table><thead><tr><th>Learning group</th>'+courses.map(c=>'<th>'+esc(c.title)+'</th>').join('')+'</tr></thead><tbody>'+groups.filter(g=>g.active).map(g=>'<tr><td>'+esc(g.name)+'</td>'+courses.map(c=>'<td><input type="checkbox" data-group="'+g.id+'" data-course="'+c.id+'" aria-label="'+esc(g.name+' '+c.title)+'" '+(initial.has(key(g.id,c.id))?'checked':'')+'></td>').join('')+'</tr>').join('')+'</tbody></table></div>';el('main').querySelectorAll('input[data-course]').forEach(b=>b.onchange=()=>{const k=key(b.dataset.group,b.dataset.course);if(b.checked===initial.has(k))dirty.delete(k);else dirty.set(k,{group_id:Number(b.dataset.group),course_id:b.dataset.course,required:b.checked});message(dirty.size+' unsaved changes')});el('reset').onclick=()=>{dirty.clear();requirementsPage();message('Changes discarded.')};el('save').onclick=async()=>{el('save').disabled=true;try{for(const [k,r] of [...dirty]){const q=r.required?await db.from('learning_group_online_requirements').upsert({group_id:r.group_id,course_id:r.course_id},{onConflict:'group_id,course_id',ignoreDuplicates:true}):await db.from('learning_group_online_requirements').delete().eq('group_id',r.group_id).eq('course_id',r.course_id);if(q.error)throw q.error;dirty.delete(k)}await load();message('Learning requirements saved.')}catch(e){message('Save stopped: '+e.message+' · '+dirty.size+' changes remaining');el('save').disabled=false}}}
function catalogue(){el('title').textContent='Learning Course Settings';el('subtitle').textContent='Existing LMS catalogue. Provider references are metadata only until an integration is agreed.';el('controls').innerHTML='<a href="academy-online-learning.html">Open existing course library and assignments</a>';el('main').innerHTML='<div class="table-wrap"><table><thead><tr><th>Course</th><th>Provider</th><th>Renewal months</th><th>External reference</th><th></th></tr></thead><tbody>'+courses.map(c=>'<tr data-course="'+c.id+'"><td>'+esc(c.title)+'</td><td>'+esc(c.provider||'Internal')+'</td><td><input type="number" min="1" step="1" aria-label="Renewal months" value="'+esc(c.renewal_months??'')+'"></td><td><input aria-label="External reference" value="'+esc(c.external_course_reference||'')+'"></td><td><button>Save</button></td></tr>').join('')+'</tbody></table></div>';el('main').querySelectorAll('tr[data-course]').forEach(row=>row.querySelector('button').onclick=async()=>{const [months,ref]=row.querySelectorAll('input'),n=months.value===''?null:Number(months.value);if(n!==null&&(!Number.isInteger(n)||n<=0))return message('Enter a positive whole number of months or leave blank.');const r=await db.from('online_courses').update({renewal_months:n,external_course_reference:ref.value.trim()||null}).eq('id',row.dataset.course).select('id').single();message(r.error?r.error.message:'Course settings saved.')})}
load().catch(e=>message('Unable to load learning management: '+e.message));
</script></body></html>
