<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edit Person | RRTA</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="portal-navigation.css"><link rel="stylesheet" href="rrta-uniform-ui.css?v=20260925"><style>:root{--red:#b20f22;--ink:#18202a;--muted:#6f7a88;--line:#e2e6ea;--bg:#f4f6f8}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,Arial,sans-serif;color:var(--ink)}.shell{display:grid;grid-template-columns:258px minmax(0,1fr);min-height:100vh}.side{background:linear-gradient(180deg,#151a22,#1e2530);padding:16px 12px}.main{min-width:0}.top{height:66px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 28px;justify-content:space-between}.content{max-width:1100px;margin:auto;padding:28px 32px 60px}.head h1{margin:5px 0 6px;font-size:30px}.eyebrow{font-size:10px;color:var(--red);font-weight:900;text-transform:uppercase}.muted{color:var(--muted)}.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;margin-top:18px}.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.form label{font-size:11px;font-weight:800;color:#475467}.form input,.form select,.form textarea{width:100%;border:1px solid #d3d9df;border-radius:8px;padding:0 11px;margin-top:5px;font:inherit;background:#fff}.form input,.form select{height:42px}.form textarea{min-height:80px;padding:10px}.wide{grid-column:1/-1}.section{grid-column:1/-1;margin-top:5px;padding-top:14px;border-top:1px solid var(--line);font-size:11px;font-weight:900}.actions{display:flex;gap:9px;margin-top:18px}.btn{border:0;border-radius:8px;padding:10px 13px;font-weight:850;font-size:11px;cursor:pointer;text-decoration:none}.primary{background:var(--red);color:#fff}.light{background:#fff;border:1px solid var(--line);color:var(--ink)}.msg{font-size:11px;margin-top:10px}.ok{color:#176b37}.bad{color:#b42318}@media(max-width:700px){.shell{grid-template-columns:1fr}.side{display:none}.form{grid-template-columns:1fr}.wide,.section{grid-column:auto}.content{padding:20px 14px}}</style></head><body data-portal-nav="academy"><div class="shell"><aside class="side"></aside><main class="main"><header class="top"><strong>RRTA Training Academy Administration</strong><span class="muted">Edit Person</span></header><div class="content"><div class="head"><div class="eyebrow">Manage People</div><h1 id="title">Edit Person</h1><p class="muted">Maintain the employee profile independently of portal login access.</p></div><section class="panel"><form id="form" class="form"><div class="section">Personal Details</div><label>Forename<input id="forename" required></label><label>Surname<input id="surname" required></label><label>Personal Email<input id="personalEmail" type="email"></label><label>Work Email<input id="workEmail" type="email"></label><label>Mobile<input id="phone"></label><label>Date of Birth<input id="dob" type="date"></label><div class="section">Employment Details</div><label>Employee / Operative Number<input id="employee"></label><label>Job Title<input id="job"></label><label>Employment Type<input id="employmentType"></label><label>Start Date<input id="startDate" type="date"></label><label>Company<select id="company"><option value="">No Company Assigned</option></select></label><label>Manager<select id="manager"><option value="">No Manager Assigned</option></select></label><label>Status<select id="status"><option value="active">Active</option><option value="inactive">Inactive</option><option value="archived">Archived / Leaver</option></select></label><label class="wide">Notes<textarea id="notes"></textarea></label><div class="wide actions"><button class="btn primary" id="save" type="submit">Save Profile</button><a class="btn light" id="cancel" href="manage-people.html">Cancel</a></div><div id="msg" class="msg wide"></div></form></section></div></main></div><script src="portal-navigation.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://qgbpotjqggeodxqcwkgj.supabase.co','sb_publishable_J1yPM1Hi7INCX2m7rp3PdA_JdQ46FRS'),id=new URLSearchParams(location.search).get('id'),v=x=>document.getElementById(x).value.trim();let person,companies=[],managers=[],relationship=null;async function init(){if(!id)throw Error('No person selected.');const{data:u}=await db.auth.getUser();if(!u?.user){location.href='portal.html';return}const{data:me}=await db.from('profiles').select('permission_level,portal_access_role,organisational_access_role').eq('id',u.user.id).single();const a=String(me?.organisational_access_role||me?.portal_access_role||'').toLowerCase();if(!me||(!['academy_staff','academy','health_safety','operations_manager','administrator'].includes(a)&&me.permission_level!=='super_user')){location.href='portal.html';return}const[p,c,m,r]=await Promise.all([db.from('people').select('*').eq('id',id).maybeSingle(),db.from('external_customers').select('id,company_name,active').eq('active',true).order('company_name'),db.from('profiles').select('id,full_name,account_status').eq('account_status','active').order('full_name'),db.from('person_relationships').select('*').eq('person_id',id).eq('active',true).order('created_at',{ascending:false}).limit(1).maybeSingle()]);if(p.error)throw p.error;if(!p.data)throw Error('Person not found.');person=p.data;companies=c.data||[];managers=m.data||[];relationship=r.data||null;companies.forEach(x=>company.insertAdjacentHTML('beforeend',`<option value="${x.id}">${x.company_name}</option>`));managers.forEach(x=>manager.insertAdjacentHTML('beforeend',`<option value="${x.id}">${x.full_name||'Unnamed'}</option>`));title.textContent='Edit '+(person.full_name||'Person');forename.value=person.forename||'';surname.value=person.surname||'';personalEmail.value=person.personal_email||'';workEmail.value=person.work_email||person.email||'';phone.value=person.phone||'';dob.value=person.date_of_birth||'';employee.value=person.employee_number||'';job.value=person.job_title||'';employmentType.value=person.employment_type||'';startDate.value=person.start_date||'';company.value=person.default_company_id||relationship?.company_id||'';manager.value=relationship?.manager_profile_id||'';status.value=person.status||'active';notes.value=person.notes||'';cancel.href='person-profile.html?id='+encodeURIComponent(id)}form.onsubmit=async e=>{e.preventDefault();save.disabled=true;msg.textContent='Saving…';try{const fn=v('forename'),sn=v('surname'),personal=v('personalEmail').toLowerCase(),work=v('workEmail').toLowerCase();if(!fn||!sn)throw Error('Forename and surname are required.');const patch={forename:fn,surname:sn,full_name:(fn+' '+sn).trim(),personal_email:personal||null,work_email:work||null,email:work||personal||null,phone:v('phone')||null,date_of_birth:v('dob')||null,employee_number:v('employee')||null,job_title:v('job')||null,employment_type:v('employmentType')||null,start_date:v('startDate')||null,default_company_id:v('company')||null,status:v('status')||'active',notes:v('notes')||null,updated_at:new Date().toISOString()};const r=await db.from('people').update(patch).eq('id',id);if(r.error)throw r.error;const relPatch={person_id:id,relationship_type:'employment',company_id:v('company')||null,manager_profile_id:v('manager')||null,active:true,started_at:v('startDate')||null,updated_at:new Date().toISOString()};if(relationship?.id){const rr=await db.from('person_relationships').update(relPatch).eq('id',relationship.id);if(rr.error)throw rr.error}else if(relPatch.company_id||relPatch.manager_profile_id){const rr=await db.from('person_relationships').insert(relPatch);if(rr.error)throw rr.error}msg.textContent='Profile saved.';msg.className='msg wide ok';setTimeout(()=>location.href='person-profile.html?id='+encodeURIComponent(id),500)}catch(e){msg.textContent=e.message||'Unable to save profile.';msg.className='msg wide bad';save.disabled=false}};init().catch(e=>{msg.textContent=e.message||'Unable to load profile.';msg.className='msg wide bad'});</script></body></html>
