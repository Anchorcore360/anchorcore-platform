<!doctype html><html lang="en"><head><script>document.documentElement.classList.add("rrta-nav-pending")</script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Course File | RRTA</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="portal-navigation.css"><style>body{background:#f3f5f6}.course-shell{max-width:1180px;margin:0 auto;padding:28px 24px 60px}.course-card{background:#fff;border:1px solid #d9dee5;border-radius:14px;padding:24px}.course-head{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}.course-meta{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.course-meta span{background:#f3f5f6;border-radius:999px;padding:7px 10px;font-size:12px;color:#475467}.file-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:24px}.file-box,.delivery-box{border:1px solid #d9dee5;border-radius:12px;padding:20px;background:#fafbfc}.delivery-box{margin-top:24px}.delivery-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.delivery-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:16px}.field{display:grid;gap:6px}.field label{font-size:12px;font-weight:800;color:#344054}.field input,.field select,.field textarea{width:100%;border:1px solid #cfd6df;border-radius:8px;padding:10px;background:#fff;font:inherit}.field textarea{min-height:78px;resize:vertical}.wide{grid-column:1/-1}.delivery-actions{display:flex;gap:10px;align-items:center;margin-top:16px}.finance-box{border-top:1px solid #d9dee5;padding:16px 0 4px;margin-top:18px}.finance-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:10px}.finance-box h2{font-size:17px;margin:0}.finance-box p{margin:4px 0}.finance-history{font-size:11px;color:#667085;margin-top:8px}.file-box h2,.delivery-box h2{margin:0 0 8px}.file-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}.file-actions .status{display:inline-flex;align-items:center;justify-content:center;align-self:center}.upload-row{display:grid;gap:10px;margin-top:14px}.upload-row input{width:100%}.back{display:inline-block;margin-bottom:16px}.description{line-height:1.65;color:#475467}.hidden{display:none!important}.notice{padding:12px;border-radius:8px;background:#f2f4f6;color:#667085;font-size:13px}@media(max-width:850px){.file-grid,.delivery-grid,.finance-grid{grid-template-columns:1fr}.wide{grid-column:auto}}</style><link rel="stylesheet" href="rrta-uniform-ui.css?v=20260922-4"></head><body data-portal-nav="academy" data-rrta-ui="standard"><main class="course-shell"><a class="text-btn back" href="courses.html">← Back To Courses</a><section id="courseApp" class="course-card"><p class="muted">Loading Course…</p></section><div id="courseError" class="error hidden"></div></main><script src="portal-navigation.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=window.supabase.createClient('https://qgbpotjqggeodxqcwkgj.supabase.co','sb_publishable_J1yPM1Hi7INCX2m7rp3PdA_JdQ46FRS');const id=new URLSearchParams(location.search).get('id');const esc=(v='')=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));let course=null,resources=[];const displayCategory=c=>c==='RRTA'?'RRTA Online Courses':(c||'RRTA Online Courses');async function requireTrainer(){const {data,error}=await db.auth.getUser();if(error||!data?.user)throw new Error('Please sign in through the Trainer Portal.');const {data:p}=await db.from('profiles').select('role,permission_level,portal_access_role,organisational_access_role').eq('id',data.user.id).maybeSingle();const access=String(p?.organisational_access_role||p?.portal_access_role||'').toLowerCase();if(!p||(!['academy_staff','academy','health_safety','operations_manager','administrator'].includes(access)&&p.permission_level!=='super_user'))throw new Error('Academy access is required.');}async function openFile(path){if(!path)return;const {data,error}=await db.storage.from('course-specifications').createSignedUrl(path,300);if(error||!data?.signedUrl)return alert(error?.message||'Unable to open file.');window.open(data.signedUrl,'_blank','noopener');}async function uploadFile(kind,column,label){const input=document.getElementById(kind+'File');const file=input?.files?.[0];if(!file)return alert('Choose a file first.');const safe=file.name.replace(/[^a-zA-Z0-9._-]+/g,'_');const path=`${course.id}/${kind}/${Date.now()}-${safe}`;const btn=document.getElementById(kind+'UploadBtn');btn.disabled=true;btn.textContent='Uploading…';try{const {error}=await db.storage.from('course-specifications').upload(path,file,{upsert:false});if(error)throw error;const payload={};payload[column]=path;const {error:ue}=await db.from('courses').update(payload).eq('id',course.id);if(ue)throw ue;course[column]=path;render();alert(label+' uploaded.');}catch(e){alert(e.message||'Unable to upload file.')}finally{btn.disabled=false;}}function fileBox(kind,column,title,help,accept){const path=course[column];return `<div class="file-box"><h2>${esc(title)}</h2><p class="muted">${esc(help)}</p>${path?`<div class="file-actions"><button class="btn dark" data-open-file="${kind}">View File</button><span class="status live">Uploaded</span></div>`:`<div class="notice">No File Uploaded Yet.</div>`}<div class="upload-row"><input id="${kind}File" type="file" accept="${accept}"><button class="btn secondary" id="${kind}UploadBtn">${path?'Replace File':'Upload File'}</button></div></div>`;}function resourceOptions(){return '<option value="">No primary room / choose at booking</option>'+resources.map(r=>`<option value="${r.id}" ${String(course.primary_resource_id||'')===String(r.id)?'selected':''}>${esc(r.site)} — ${esc(r.resource_name)} (max ${r.maximum_capacity})</option>`).join('')}function altOptions(){const selected=new Set(course.approved_alternative_resource_ids||[]);return resources.filter(r=>String(r.id)!==String(course.primary_resource_id||'')).map(r=>`<option value="${r.id}" ${selected.has(r.id)?'selected':''}>${esc(r.site)} — ${esc(r.resource_name)}</option>`).join('')}function deliveryBox(){return `<section class="delivery-box"><div class="delivery-head"><div><h2>Delivery Requirements</h2><p class="muted">Set the normal delivery setup. These are defaults for new bookings and can be changed on an individual booking when circumstances change.</p></div><span class="status ${course.delivery_setup_complete?'live':''}">${course.delivery_setup_complete?'SET UP':'SETUP REQUIRED'}</span></div><div class="delivery-grid"><div class="field"><label>Duration (days)</label><input id="durationDays" type="number" min="0.25" step="0.25" value="${esc(course.duration_days??'')}"></div><div class="field"><label>Preferred learners</label><input id="preferredLearners" type="number" min="1" value="${esc(course.preferred_learner_count??'')}"></div><div class="field"><label>Maximum learners</label><input id="maximumLearners" type="number" min="1" value="${esc(course.maximum_learner_count??'')}"></div><div class="field"><label>Staff</label><input id="ratioStaff" type="number" min="1" value="${esc(course.staff_ratio_count??1)}"></div><div class="field"><label>Learners per staff member</label><input id="ratioLearners" type="number" min="1" value="${esc(course.learner_ratio_count??'')}"></div><div class="field"><label>Primary room</label><select id="primaryResource">${resourceOptions()}</select></div><div class="field wide"><label>Approved alternative rooms (optional)</label><select id="alternativeResources" multiple size="${Math.min(Math.max(resources.length,3),6)}">${altOptions()}</select><small class="muted">Hold Ctrl to select more than one. This is guidance only; the room can still be changed when making the booking.</small></div><div class="field wide"><label>Special delivery requirements / notes</label><textarea id="deliveryNotes" placeholder="e.g. practical area required">${esc(course.delivery_requirements_notes||'')}</textarea></div></div><div class="delivery-actions"><button class="btn dark" id="saveDelivery">Save Delivery Requirements</button><span class="muted" id="deliveryMessage"></span></div></section>`}function financeBox(){return `<section class="finance-box"><div class="delivery-head"><div><h2>Finance & Pricing</h2><p class="muted">Current defaults for new quotes and bookings only.</p></div></div><div class="finance-grid"><div class="field"><label>RRP (£)</label><input id="externalPrice" type="number" min="0" step="0.01" value="${esc(course.standard_external_price??'')}"></div><div class="field"><label>Awarding fee (£)</label><input id="awardingFee" type="number" min="0" step="0.01" value="${esc(course.awarding_body_fee_per_learner??'')}"></div><div class="field"><label>Certificate fee (£)</label><input id="certificateFee" type="number" min="0" step="0.01" value="${esc(course.certificate_fee_per_learner??'')}"></div><div class="field"><label>Effective from</label><input id="priceEffectiveFrom" type="date"></div></div><div class="delivery-actions"><button class="btn dark" id="saveFinance">Save New Price</button><span class="muted" id="financeMessage"></span></div><div class="finance-history" id="priceHistory"></div></section>`}async function loadPriceHistory(){const box=document.getElementById('priceHistory');if(!box)return;const {data}=await db.from('course_price_history').select('external_price,awarding_body_fee_per_learner,certificate_fee_per_learner,effective_from').eq('course_id',course.id).order('effective_from',{ascending:false}).limit(4);box.innerHTML=(data||[]).length?'Price history: '+data.map(x=>`${esc(x.effective_from)} · RRP £${Number(x.external_price||0).toFixed(2)} · fee £${Number(x.awarding_body_fee_per_learner||0).toFixed(2)}`).join(' &nbsp; | &nbsp; '):'No previous price changes recorded.'}async function saveFinance(){const btn=document.getElementById('saveFinance'),msg=document.getElementById('financeMessage'),effective=document.getElementById('priceEffectiveFrom').value;if(!effective)return alert('Enter the date the new price takes effect.');const num=id=>{const v=document.getElementById(id).value;return v===''?null:Number(v)};const payload={standard_external_price:num('externalPrice'),awarding_body_fee_per_learner:num('awardingFee'),certificate_fee_per_learner:num('certificateFee')};btn.disabled=true;msg.textContent='Saving…';const {error:he}=await db.from('course_price_history').insert({course_id:course.id,external_price:payload.standard_external_price,awarding_body_fee_per_learner:payload.awarding_body_fee_per_learner,certificate_fee_per_learner:payload.certificate_fee_per_learner,effective_from:effective});if(he){btn.disabled=false;msg.textContent='Unable to save';return alert(he.message)}const today=new Date().toISOString().slice(0,10);if(effective<=today){const {error}=await db.from('courses').update(payload).eq('id',course.id);if(error){btn.disabled=false;return alert(error.message)}Object.assign(course,payload)}btn.disabled=false;msg.textContent=effective>today?'Scheduled':'Saved';loadPriceHistory()}async function saveDelivery(){const btn=document.getElementById('saveDelivery'),msg=document.getElementById('deliveryMessage');const selected=[...document.getElementById('alternativeResources').selectedOptions].map(o=>o.value);const primary=document.getElementById('primaryResource').value||null;const payload={duration_days:Number(document.getElementById('durationDays').value)||null,preferred_learner_count:Number(document.getElementById('preferredLearners').value)||null,maximum_learner_count:Number(document.getElementById('maximumLearners').value)||null,staff_ratio_count:Number(document.getElementById('ratioStaff').value)||1,learner_ratio_count:Number(document.getElementById('ratioLearners').value)||null,primary_resource_id:primary,approved_alternative_resource_ids:selected.filter(x=>x!==primary),delivery_requirements_notes:document.getElementById('deliveryNotes').value.trim()||null};payload.delivery_setup_complete=!!(payload.maximum_learner_count&&payload.learner_ratio_count);if(payload.preferred_learner_count&&payload.maximum_learner_count&&payload.preferred_learner_count>payload.maximum_learner_count)return alert('Preferred learners cannot be higher than maximum learners.');btn.disabled=true;msg.textContent='Saving…';const {error}=await db.from('courses').update(payload).eq('id',course.id);btn.disabled=false;if(error){msg.textContent='Unable to save';return alert(error.message)}Object.assign(course,payload);msg.textContent='Saved';render();}function render(){document.title=`${course.title} | RRTA`;document.getElementById('courseApp').innerHTML=`<div class="course-head"><div><div class="eyebrow">${esc(displayCategory(course.category))}</div><h1>${esc(course.course_code||'Course')} — ${esc(course.title||'')}</h1><p class="description">${esc(course.description||'No Description Has Been Added Yet.')}</p></div><span class="status live">ACTIVE</span></div><div class="course-meta"><span>${course.duration_days?`${Number(course.duration_days)} Day${Number(course.duration_days)===1?'':'s'}`:'Duration TBC'}</span><span>${esc(displayCategory(course.category))}</span>${course.maximum_learner_count?`<span>Max ${course.maximum_learner_count} learners</span>`:''}${course.learner_ratio_count?`<span>${course.staff_ratio_count||1}:${course.learner_ratio_count} ratio</span>`:''}</div>${deliveryBox()}${financeBox()}<div class="file-grid">${fileBox('ppt','powerpoint_path','Course PowerPoint','Store the current delivery PowerPoint for this course.','.ppt,.pptx,application/vnd.ms-powerpoint,application/vnd.openxmlformats-officedocument.presentationml.presentation')}${fileBox('spec','specification_path','Course Specification','Store the current awarding-body or RRTA course specification.','application/pdf,.doc,.docx')}${fileBox('joining','joining_instructions_path','Joining Instructions','Store the joining instructions used for delegates. This can be automated later.','application/pdf,.doc,.docx')}</div>`;document.querySelector('[data-open-file="ppt"]')?.addEventListener('click',()=>openFile(course.powerpoint_path));document.querySelector('[data-open-file="spec"]')?.addEventListener('click',()=>openFile(course.specification_path));document.querySelector('[data-open-file="joining"]')?.addEventListener('click',()=>openFile(course.joining_instructions_path));document.getElementById('pptUploadBtn').onclick=()=>uploadFile('ppt','powerpoint_path','PowerPoint');document.getElementById('specUploadBtn').onclick=()=>uploadFile('spec','specification_path','Specification');document.getElementById('joiningUploadBtn').onclick=()=>uploadFile('joining','joining_instructions_path','Joining Instructions');document.getElementById('saveDelivery').onclick=saveDelivery;document.getElementById('saveFinance').onclick=saveFinance;loadPriceHistory();}async function load(){if(!id)throw new Error('No course was selected.');await requireTrainer();const [cq,rq]=await Promise.all([db.from('courses').select('*').eq('id',id).maybeSingle(),db.from('academy_resources').select('id,site,resource_name,preferred_capacity,maximum_capacity').eq('active',true).order('site').order('resource_name')]);if(cq.error||!cq.data)throw new Error(cq.error?.message||'Course not found.');course=cq.data;resources=rq.data||[];render();}load().catch(e=>{document.getElementById('courseApp').classList.add('hidden');const box=document.getElementById('courseError');box.textContent=e.message||'Unable to load course.';box.classList.remove('hidden')});</script><script src="course-joining-template-link.js"></script><script src="course-assessment-admin.js"></script></body></html>
