<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Course | RRTA</title><link rel="stylesheet" href="styles.css"><style>body{background:#f3f5f6}.course-shell{max-width:1180px;margin:0 auto;padding:28px 24px 60px}.course-card{background:#fff;border:1px solid #d9dee5;border-radius:14px;padding:24px}.course-head{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}.course-meta{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.course-meta span{background:#f3f5f6;border-radius:999px;padding:7px 10px;font-size:12px;color:#475467}.spec-box{margin-top:22px;border:1px solid #d9dee5;border-radius:12px;padding:20px;background:#fafbfc}.spec-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.upload-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px}.upload-row input{max-width:520px}.back{display:inline-block;margin-bottom:16px}.description{line-height:1.65;color:#475467}.hidden{display:none!important}</style></head><body><header class="site-header"><div class="header-inner"><img src="rrta-logo.png" class="brand-logo" alt="Rapid Response Training Academy"><div class="header-user">Course specification</div></div></header><main class="course-shell"><a class="text-btn back" href="trainer.html">← Back to Course catalogue</a><section id="courseApp" class="course-card"><p class="muted">Loading course…</p></section><div id="courseError" class="error hidden"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=window.supabase.createClient('https://qgbpotjqggeodxqcwkgj.supabase.co','sb_publishable_J1yPM1Hi7INCX2m7rp3PdA_JdQ46FRS');const id=new URLSearchParams(location.search).get('id');const esc=(v='')=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));let course=null;async function requireTrainer(){const {data,error}=await db.auth.getUser();if(error||!data?.user)throw new Error('Please sign in through the Trainer Portal.');const {data:p,error:pe}=await db.rpc('get_current_profile');const profile=Array.isArray(p)?p[0]:p;if(pe||!profile||String(profile.role).toLowerCase()!=='trainer')throw new Error('Trainer access is required.');}async function openSpec(){if(!course?.specification_path)return;const {data,error}=await db.storage.from('course-specifications').createSignedUrl(course.specification_path,300);if(error||!data?.signedUrl)return alert(error?.message||'Unable to open specification.');window.open(data.signedUrl,'_blank','noopener');}async function uploadSpec(){const file=document.getElementById('specFile').files?.[0];if(!file)return alert('Choose a PDF or Word specification first.');const safe=file.name.replace(/[^a-zA-Z0-9._-]+/g,'_');const path=`${course.id}/${Date.now()}-${safe}`;const btn=document.getElementById('uploadSpecBtn');btn.disabled=true;btn.textContent='Uploading…';try{const {error}=await db.storage.from('course-specifications').upload(path,file,{upsert:false});if(error)throw error;const {error:ue}=await db.from('courses').update({specification_path:path}).eq('id',course.id);if(ue)throw ue;course.specification_path=path;render();alert('Course specification uploaded.');}catch(e){alert(e.message||'Unable to upload specification.')}finally{btn.disabled=false;btn.textContent='Upload specification';}}function render(){document.title=`${course.title} | RRTA`;document.getElementById('courseApp').innerHTML=`<div class="course-head"><div><div class="eyebrow">${esc(course.category||'RRTA')}</div><h1>${esc(course.course_code||'Course')} — ${esc(course.title||'')}</h1><p class="description">${esc(course.description||'No description has been added yet.')}</p></div><span class="status live">LIVE</span></div><div class="course-meta"><span>${course.duration_days?`${Number(course.duration_days)} day${Number(course.duration_days)===1?'':'s'}`:'Duration TBC'}</span><span>${esc(course.category||'RRTA')}</span>${course.question_count?`<span>${course.question_count} question assessment</span>`:''}${course.pass_mark?`<span>${course.pass_mark}% pass mark</span>`:''}</div><div class="spec-box"><h2>Course specification</h2><p class="muted">Upload the official course specification as you build the catalogue. The most recently uploaded file becomes the specification linked to this course.</p>${course.specification_path?`<div class="spec-actions"><button class="btn dark" id="openSpecBtn">View specification</button><span class="status live">Specification uploaded</span></div>`:`<div class="notice">No specification has been uploaded yet.</div>`}<div class="upload-row"><input id="specFile" type="file" accept="application/pdf,.doc,.docx"><button class="btn secondary" id="uploadSpecBtn">${course.specification_path?'Replace specification':'Upload specification'}</button></div></div>`;document.getElementById('openSpecBtn')?.addEventListener('click',openSpec);document.getElementById('uploadSpecBtn').addEventListener('click',uploadSpec);}async function load(){if(!id)throw new Error('No course was selected.');await requireTrainer();const {data,error}=await db.from('courses').select('*').eq('id',id).maybeSingle();if(error||!data)throw new Error(error?.message||'Course not found.');course=data;render();}load().catch(e=>{document.getElementById('courseApp').classList.add('hidden');const box=document.getElementById('courseError');box.textContent=e.message||'Unable to load course.';box.classList.remove('hidden')});</script></body></html>
