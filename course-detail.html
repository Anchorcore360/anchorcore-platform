<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Course File | RRTA</title><link rel="stylesheet" href="styles.css"><style>body{background:#f3f5f6}.course-shell{max-width:1180px;margin:0 auto;padding:28px 24px 60px}.course-card{background:#fff;border:1px solid #d9dee5;border-radius:14px;padding:24px}.course-head{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}.course-meta{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.course-meta span{background:#f3f5f6;border-radius:999px;padding:7px 10px;font-size:12px;color:#475467}.file-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:24px}.file-box{border:1px solid #d9dee5;border-radius:12px;padding:20px;background:#fafbfc}.file-box h2{margin:0 0 8px}.file-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.upload-row{display:grid;gap:10px;margin-top:14px}.upload-row input{width:100%}.back{display:inline-block;margin-bottom:16px}.description{line-height:1.65;color:#475467}.hidden{display:none!important}.notice{padding:12px;border-radius:8px;background:#f2f4f6;color:#667085;font-size:13px}@media(max-width:850px){.file-grid{grid-template-columns:1fr}}</style></head><body><header class="site-header"><div class="header-inner"><img src="rrta-logo.png" class="brand-logo" alt="Rapid Response Training Academy"><div class="header-user">Course File</div></div></header><main class="course-shell"><a class="text-btn back" href="trainer.html">← Back To Course Filing Cabinet</a><section id="courseApp" class="course-card"><p class="muted">Loading Course…</p></section><div id="courseError" class="error hidden"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=window.supabase.createClient('https://qgbpotjqggeodxqcwkgj.supabase.co','sb_publishable_J1yPM1Hi7INCX2m7rp3PdA_JdQ46FRS');const id=new URLSearchParams(location.search).get('id');const esc=(v='')=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));let course=null;const displayCategory=c=>c==='RRTA'?'RRTA Online Courses':(c||'RRTA Online Courses');async function requireTrainer(){const {data,error}=await db.auth.getUser();if(error||!data?.user)throw new Error('Please sign in through the Trainer Portal.');const {data:p,error:pe}=await db.rpc('get_current_profile');const profile=Array.isArray(p)?p[0]:p;if(pe||!profile||String(profile.role).toLowerCase()!=='trainer')throw new Error('Trainer access is required.');}async function openFile(path){if(!path)return;const {data,error}=await db.storage.from('course-specifications').createSignedUrl(path,300);if(error||!data?.signedUrl)return alert(error?.message||'Unable to open file.');window.open(data.signedUrl,'_blank','noopener');}async function uploadFile(kind,column,label){const input=document.getElementById(kind+'File');const file=input?.files?.[0];if(!file)return alert('Choose a file first.');const safe=file.name.replace(/[^a-zA-Z0-9._-]+/g,'_');const path=`${course.id}/${kind}/${Date.now()}-${safe}`;const btn=document.getElementById(kind+'UploadBtn');btn.disabled=true;btn.textContent='Uploading…';try{const {error}=await db.storage.from('course-specifications').upload(path,file,{upsert:false});if(error)throw error;const payload={};payload[column]=path;const {error:ue}=await db.from('courses').update(payload).eq('id',course.id);if(ue)throw ue;course[column]=path;render();alert(label+' uploaded.');}catch(e){alert(e.message||'Unable to upload file.')}finally{btn.disabled=false;btn.textContent=course[column]?'Replace File':'Upload File';}}function fileBox(kind,column,title,help,accept){const path=course[column];return `<div class="file-box"><h2>${esc(title)}</h2><p class="muted">${esc(help)}</p>${path?`<div class="file-actions"><button class="btn dark" data-open-file="${kind}">View File</button><span class="status live">Uploaded</span></div>`:`<div class="notice">No File Uploaded Yet.</div>`}<div class="upload-row"><input id="${kind}File" type="file" accept="${accept}"><button class="btn secondary" id="${kind}UploadBtn">${path?'Replace File':'Upload File'}</button></div></div>`;}function render(){document.title=`${course.title} | RRTA`;document.getElementById('courseApp').innerHTML=`<div class="course-head"><div><div class="eyebrow">${esc(displayCategory(course.category))}</div><h1>${esc(course.course_code||'Course')} — ${esc(course.title||'')}</h1><p class="description">${esc(course.description||'No Description Has Been Added Yet.')}</p></div><span class="status live">ACTIVE</span></div><div class="course-meta"><span>${course.duration_days?`${Number(course.duration_days)} Day${Number(course.duration_days)===1?'':'s'}`:'Duration TBC'}</span><span>${esc(displayCategory(course.category))}</span></div><div class="file-grid">${fileBox('ppt','powerpoint_path','Course PowerPoint','Store the current delivery PowerPoint for this course.','.ppt,.pptx,application/vnd.ms-powerpoint,application/vnd.openxmlformats-officedocument.presentationml.presentation')}${fileBox('spec','specification_path','Course Specification','Store the current awarding-body or RRTA course specification.','application/pdf,.doc,.docx')}${fileBox('joining','joining_instructions_path','Joining Instructions','Store the joining instructions used for delegates. This can be automated later.','application/pdf,.doc,.docx')}</div>`;document.querySelector('[data-open-file="ppt"]')?.addEventListener('click',()=>openFile(course.powerpoint_path));document.querySelector('[data-open-file="spec"]')?.addEventListener('click',()=>openFile(course.specification_path));document.querySelector('[data-open-file="joining"]')?.addEventListener('click',()=>openFile(course.joining_instructions_path));document.getElementById('pptUploadBtn').onclick=()=>uploadFile('ppt','powerpoint_path','PowerPoint');document.getElementById('specUploadBtn').onclick=()=>uploadFile('spec','specification_path','Specification');document.getElementById('joiningUploadBtn').onclick=()=>uploadFile('joining','joining_instructions_path','Joining Instructions');}async function load(){if(!id)throw new Error('No course was selected.');await requireTrainer();const {data,error}=await db.from('courses').select('*').eq('id',id).maybeSingle();if(error||!data)throw new Error(error?.message||'Course not found.');course=data;render();}load().catch(e=>{document.getElementById('courseApp').classList.add('hidden');const box=document.getElementById('courseError');box.textContent=e.message||'Unable to load course.';box.classList.remove('hidden')});</script><script src="course-joining-template-link.js"></script><script src="course-assessment-admin.js"></script></body></html>
