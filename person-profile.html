<!doctype html><html lang="en"><head><script>document.documentElement.classList.add("rrta-nav-pending")</script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Person Profile | RRTA</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;font-family:Inter,Arial,sans-serif;background:#f4f6f8;color:#17202b}.wrap{max-width:1100px;margin:32px auto;padding:0 24px}.back{border:0;background:none;font-weight:700;cursor:pointer;margin-bottom:18px}.card{background:#fff;border:1px solid #dce2e8;border-radius:16px;padding:28px;box-shadow:0 12px 30px #15202b10}.head{display:flex;gap:20px;align-items:center;border-bottom:1px solid #e5e9ed;padding-bottom:24px}.avatar{width:82px;height:82px;border-radius:50%;background:#edf1f5;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;color:#657184}.head h1{margin:0 0 5px;font-size:28px}.muted{color:#687585}.pill{display:inline-block;padding:6px 10px;border-radius:999px;background:#edf2f7;font-size:12px;font-weight:800}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:24px}.field{border:1px solid #e1e6eb;border-radius:10px;padding:14px}.field span{display:block;font-size:11px;text-transform:uppercase;color:#758191;font-weight:800;margin-bottom:6px}.field strong{font-size:14px}.notice{margin-top:24px;padding:16px;background:#f6f8fa;border-radius:10px;color:#596575}.actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}.btn{border:0;border-radius:8px;padding:10px 13px;font-weight:800;font-size:11px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}.primary{background:#b20f22;color:#fff}.light{background:#fff;border:1px solid #dce2e8;color:#17202b}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style><link rel="stylesheet" href="portal-navigation.css?v=20260922-5"><link rel="stylesheet" href="rrta-uniform-ui.css?v=20260922-5"></head><body data-portal-nav="academy" data-rrta-ui="standard"><div class="wrap"><button class="back" onclick="history.back()">← Back to Manage People</button><div id="app" class="card">Loading profile…</div></div><script>const db=supabase.createClient('https://qgbpotjqggeodxqcwkgj.supabase.co','sb_publishable_J1yPM1Hi7INCX2m7rp3PdA_JdQ46FRS');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const id=new URLSearchParams(location.search).get('id');async function load(){if(!id)throw new Error('No person was selected.');const{data:u,error:authError}=await db.auth.getUser();if(authError&&authError.name!=='AuthSessionMissingError')throw new Error('Unable to verify your sign-in. Please refresh and try again.');if(!u?.user){location.href='portal.html';return}const{data:p,error}=await db.from('people').select('*').eq('id',id).maybeSingle();if(error)throw new Error('Unable to load this person: '+error.message);if(!p)throw new Error('Person not found or your Academy account cannot view this record.');let company='—';if(p.default_company_id){const{data:c}=await db.from('external_customers').select('company_name').eq('id',p.default_company_id).maybeSingle();company=c?.company_name||'—'}const name=p.full_name||'Unnamed';const initials=name.split(/\s+/).map(x=>x[0]).slice(0,2).join('').toUpperCase();let photoUrl='';let photoError=false;if(p.photo_path){try{const result=await db.storage.from('learner-photos').createSignedUrl(p.photo_path,3600);photoUrl=result.data?.signedUrl||'';photoError=!!result.error||!photoUrl}catch(_){photoError=true}}const personType=({workforce:'Workforce',induction:'Induction',external_customer:'External'})[p.person_type]||'Person';app.innerHTML=`<div class="head"><div class="avatar">${photoUrl?`<img src="${esc(photoUrl)}" alt="${esc(name)}" style="width:100%;height:100%;border-radius:50%;object-fit:cover">`:esc(initials)}</div><div><h1>${esc(name)}</h1><div class="muted">${esc(p.email||'No email recorded')}</div><div style="margin-top:10px"><span class="pill">${esc(personType)} · ${p.profile_id?'Linked profile':'No login account'}</span></div></div></div>${photoError?'<p class="muted">The saved photo could not be loaded. Refresh to try again.</p>':''}<div class="grid"><div class="field"><span>Job title</span><strong>${esc(p.job_title||'—')}</strong></div><div class="field"><span>Employee number</span><strong>${esc(p.employee_number||'—')}</strong></div><div class="field"><span>Company</span><strong>${esc(company)}</strong></div><div class="field"><span>Status</span><strong>${esc(p.status||'active')}</strong></div><div class="field"><span>Email</span><strong>${esc(p.email||'—')}</strong></div><div class="field"><span>Date added</span><strong>${p.created_at?new Date(p.created_at).toLocaleDateString('en-GB'):'—'}</strong></div></div><div class="actions"><a class="btn primary" href="edit-person.html?id=${encodeURIComponent(p.id)}">Edit Profile</a><a class="btn light" href="manage-people.html">Back to Manage People</a></div><div class="notice">This is the employee profile. Portal login is separate and can be enabled later without creating another person.</div>`;}load().catch(e=>app.textContent=e?.message||'Unable to load profile.');</script><script src="portal-navigation.js?v=20260922-5"></script></body></html>
