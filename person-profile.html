<!doctype html><html lang="en"><head><script>document.documentElement.classList.add("rrta-nav-pending")</script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Person Profile | RRTA</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;font-family:Inter,Arial,sans-serif;background:#f4f6f8;color:#17202b}.wrap{max-width:1100px;margin:32px auto;padding:0 24px}.back{border:0;background:none;font-weight:700;cursor:pointer;margin-bottom:18px}.card{background:#fff;border:1px solid #dce2e8;border-radius:16px;padding:28px;box-shadow:0 12px 30px #15202b10}.head{display:flex;gap:20px;align-items:center;border-bottom:1px solid #e5e9ed;padding-bottom:24px}.avatar{width:82px;height:82px;border-radius:50%;background:#edf1f5;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;color:#657184}.head h1{margin:0 0 5px;font-size:28px}.muted{color:#687585}.pill{display:inline-block;padding:6px 10px;border-radius:999px;background:#edf2f7;font-size:12px;font-weight:800}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:24px}.field{border:1px solid #e1e6eb;border-radius:10px;padding:14px}.field span{display:block;font-size:11px;text-transform:uppercase;color:#758191;font-weight:800;margin-bottom:6px}.field strong{font-size:14px}.section{margin-top:24px;border-top:1px solid #e5e9ed;padding-top:20px}.section h2{margin:0 0 12px;font-size:18px}.rows{display:grid;gap:8px}.row{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:12px;padding:11px 12px;border:1px solid #e1e6eb;border-radius:9px;align-items:center;font-size:12px}.row strong{font-size:12px}.acc-form{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr auto;gap:8px;margin-top:10px}.acc-form input,.acc-form select{height:38px;border:1px solid #dce2e8;border-radius:7px;padding:0 9px;min-width:0}.danger{color:#a00}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}.summary>div{border:1px solid #e1e6eb;border-radius:10px;padding:12px}.summary b{display:block;font-size:20px}.summary span{font-size:10px;text-transform:uppercase;color:#758191;font-weight:800}.status-current{color:#176b37}.status-expired{color:#b42318}.empty{padding:14px;border:1px dashed #dce2e8;border-radius:9px;color:#687585;font-size:12px}.notice{margin-top:24px;padding:16px;background:#f6f8fa;border-radius:10px;color:#596575}.actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}.btn{border:0;border-radius:8px;padding:10px 13px;font-weight:800;font-size:11px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}.primary{background:#b20f22;color:#fff}.light{background:#fff;border:1px solid #dce2e8;color:#17202b}@media(max-width:700px){.grid{grid-template-columns:1fr}.acc-form{grid-template-columns:1fr}.summary{grid-template-columns:1fr}}</style><link rel="stylesheet" href="portal-navigation.css?v=20260922-5"><link rel="stylesheet" href="rrta-uniform-ui.css?v=20260922-5"></head><body data-portal-nav="academy" data-rrta-ui="standard"><div class="wrap"><button class="back" onclick="history.back()">← Back to Manage People</button><div id="app" class="card">Loading profile…</div></div><script>const db=supabase.createClient('https://qgbpotjqggeodxqcwkgj.supabase.co','sb_publishable_J1yPM1Hi7INCX2m7rp3PdA_JdQ46FRS');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const id=new URLSearchParams(location.search).get('id');async function load(){if(!id)throw new Error('No person was selected.');const{data:u,error:authError}=await db.auth.getUser();if(authError&&authError.name!=='AuthSessionMissingError')throw new Error('Unable to verify your sign-in. Please refresh and try again.');if(!u?.user){location.href='portal.html';return}const{data:p,error}=await db.from('people').select('*').eq('id',id).maybeSingle();if(error)throw new Error('Unable to load this person: '+error.message);if(!p)throw new Error('Person not found or your Academy account cannot view this record.');let company='—';if(p.default_company_id){const{data:c}=await db.from('external_customers').select('company_name').eq('id',p.default_company_id).maybeSingle();company=c?.company_name||'—'}const name=p.full_name||'Unnamed';const initials=name.split(/\s+/).map(x=>x[0]).slice(0,2).join('').toUpperCase();let photoUrl='';let photoError=false;if(p.photo_path){try{const result=await db.storage.from('learner-photos').createSignedUrl(p.photo_path,3600);photoUrl=result.data?.signedUrl||'';photoError=!!result.error||!photoUrl}catch(_){photoError=true}}const personType=({workforce:'Workforce',induction:'Induction',external_customer:'External'})[p.person_type]||'Person';const [relRes,roleRes,accRes,bookRes,catRes]=await Promise.all([db.from('person_relationships').select('manager_profile_id,profiles!person_relationships_manager_profile_id_fkey(full_name)').eq('person_id',id).eq('active',true).limit(1).maybeSingle(),db.from('person_job_roles').select('job_role_id,is_primary,job_roles(name,division)').eq('person_id',id),db.from('accreditations').select('id,accreditation_name,awarding_body,certificate_number,issue_date,expiry_date,status').eq('person_id',id).order('expiry_date',{ascending:true}),db.from('booking_attendees').select('id,booking_id,attendance_status,outcome,booking_status,bookings(course_title,start_date,end_date,status)').eq('person_id',id).order('created_at',{ascending:false}).limit(12),db.from('accreditation_catalog').select('id,module_code,description,active').eq('active',true).order('module_code')]);const manager=relRes.data?.profiles?.full_name||'—',roles=roleRes.data||[],accs=accRes.data||[],bookings=bookRes.data||[],catalog=catRes.data||[];const roleHtml=roles.length?roles.map(r=>`<div class="row"><strong>${esc(r.job_roles?.name||'Role')}</strong><span>${esc(r.job_roles?.division||'')}</span><span>${r.is_primary?'Primary':'Additional'}</span></div>`).join(''):'<div class="empty">No compliance job roles assigned yet.</div>';const accHtml=accs.length?accs.map(a=>`<div class="row"><strong>${esc(a.accreditation_name)}</strong><span>${esc(a.awarding_body||a.certificate_number||'—')}</span><span>${esc(a.status||'—')}${a.expiry_date?' · '+new Date(a.expiry_date+'T00:00:00').toLocaleDateString('en-GB'):''} <button class="back danger" style="margin:0 0 0 8px" onclick="archiveAcc(${a.id})">Remove</button></span></div>`).join(''):'<div class="empty">No accreditations recorded yet.</div>';const catalogOptions=catalog.map(x=>`<option value="${x.id}" data-name="${esc(x.module_code+' — '+x.description)}">${esc(x.module_code+' — '+x.description)}</option>`).join('');const currentAccs=accs.filter(a=>a.status==='current'&&(!a.expiry_date||a.expiry_date>=new Date().toISOString().slice(0,10))).length,expiredAccs=accs.filter(a=>a.status==='expired'||(a.expiry_date&&a.expiry_date<new Date().toISOString().slice(0,10))).length,upcomingBookings=bookings.filter(b=>b.bookings?.start_date&&b.bookings.start_date>=new Date().toISOString().slice(0,10)).length;const bookingHtml=bookings.length?bookings.map(b=>`<div class="row"><strong>${esc(b.bookings?.course_title||'Course booking')}</strong><span>${b.bookings?.start_date?new Date(b.bookings.start_date+'T00:00:00').toLocaleDateString('en-GB'):'—'}</span><span>${esc(b.booking_status||b.attendance_status||'—')}</span></div>`).join(''):'<div class="empty">No course bookings recorded yet.</div>';app.innerHTML=`<div class="head"><div class="avatar">${photoUrl?`<img src="${esc(photoUrl)}" alt="${esc(name)}" style="width:100%;height:100%;border-radius:50%;object-fit:cover">`:esc(initials)}</div><div><h1>${esc(name)}</h1><div class="muted">${esc(p.email||'No email recorded')}</div><div style="margin-top:10px"><span class="pill">${esc(personType)} · ${p.profile_id?'Linked profile':'No login account'}</span></div></div></div>${photoError?'<p class="muted">The saved photo could not be loaded. Refresh to try again.</p>':''}<div class="grid"><div class="field"><span>Job title</span><strong>${esc(p.job_title||'—')}</strong></div><div class="field"><span>Employee number</span><strong>${esc(p.employee_number||'—')}</strong></div><div class="field"><span>Company</span><strong>${esc(company)}</strong></div><div class="field"><span>Status</span><strong>${esc(p.status||'active')}</strong></div><div class="field"><span>Manager</span><strong>${esc(manager)}</strong></div><div class="field"><span>Email</span><strong>${esc(p.email||'—')}</strong></div><div class="field"><span>Date added</span><strong>${p.created_at?new Date(p.created_at).toLocaleDateString('en-GB'):'—'}</strong></div></div><div class="section"><h2>Compliance Job Roles</h2><div class="rows">${roleHtml}</div></div><div class="section"><h2>Accreditations</h2><div class="rows">${accHtml}</div><div class="acc-form"><select id="accCatalog"><option value="">Select accreditation…</option>${catalogOptions}</select><input id="accNumber" placeholder="Certificate number"><input id="accIssue" type="date" title="Issue date"><input id="accExpiry" type="date" title="Expiry date"><button class="btn primary" onclick="addAcc()">Add</button></div><div id="accMsg" class="muted" style="margin-top:8px"></div></div><div class="section"><h2>Bookings</h2><div class="rows">${bookingHtml}</div></div><div class="summary"><div><b>${currentAccs}</b><span>Current accreditations</span></div><div><b>${expiredAccs}</b><span>Expired accreditations</span></div><div><b>${upcomingBookings}</b><span>Upcoming bookings</span></div></div><div class="actions"><a class="btn primary" href="edit-person.html?id=${encodeURIComponent(p.id)}">Edit Profile</a><a class="btn light" href="manage-people.html">Back to Manage People</a></div><div class="notice">This is the employee profile. Portal login is separate and can be enabled later without creating another person.</div>`;}async function addAcc(){const sel=document.getElementById('accCatalog'),opt=sel?.selectedOptions?.[0];if(!sel?.value){accMsg.textContent='Select an accreditation first.';return}const issue=accIssue.value||null,expiry=accExpiry.value||null,today=new Date().toISOString().slice(0,10),status=expiry&&expiry<today?'expired':'current',name=opt.dataset.name||opt.textContent;const r=await db.from('accreditations').insert({person_id:id,learner_id:null,accreditation_catalog_id:Number(sel.value),accreditation_name:name,certificate_number:accNumber.value.trim()||null,issue_date:issue,expiry_date:expiry,status});if(r.error){accMsg.textContent=r.error.message;return}location.reload()}async function archiveAcc(accId){if(!confirm('Remove this accreditation from the current profile?'))return;const r=await db.from('accreditations').update({status:'expired',archived_at:new Date().toISOString()}).eq('id',accId).eq('person_id',id);if(r.error){alert(r.error.message);return}location.reload()}load().catch(e=>app.textContent=e?.message||'Unable to load profile.');</script><script src="portal-navigation.js?v=20260922-5"></script></body></html>
