<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Resources Library | RRT Learner Portal</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="portal-navigation.css"><style>:root{--red:#b20f22;--ink:#18202a;--muted:#6f7a88;--line:#e2e6ea;--bg:#f4f6f8}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,Arial,sans-serif;color:var(--ink)}.shell{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}.sidebar{height:100vh;background:#171d25}.main{min-width:0}.top{height:66px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 28px}.content{padding:28px 30px 60px;max-width:1400px;margin:auto}h1{margin:4px 0}.sub{color:var(--muted);margin:0}.eyebrow{font-size:10px;color:var(--red);font-weight:900;text-transform:uppercase;letter-spacing:.11em}.toolbar{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px;margin:22px 0}.toolbar input,.toolbar select{padding:11px;border:1px solid #ccd3da;border-radius:8px;background:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}.card{background:#fff;border:1px solid var(--line);border-radius:13px;overflow:hidden}.cover{height:260px;background:linear-gradient(145deg,#eef1f4,#dfe4e9);display:flex;align-items:center;justify-content:center;padding:22px;text-align:center}.pdf{font-size:11px;font-weight:900;color:#fff;background:var(--red);padding:8px;border-radius:7px}.cover h3{font-size:18px}.body{padding:14px}.source{font-size:11px;font-weight:900;color:var(--red);text-transform:uppercase}.meta{font-size:12px;color:var(--muted);margin:7px 0}.tags{display:flex;flex-wrap:wrap;gap:5px}.tag{font-size:10px;background:#eef2f6;padding:5px 7px;border-radius:12px}.actions{display:flex;gap:7px;margin-top:13px}.btn{border:0;border-radius:8px;padding:9px 11px;font-weight:800;cursor:pointer}.btn.red{background:var(--red);color:#fff}.btn.light{background:#fff;border:1px solid var(--line)}.empty{grid-column:1/-1;background:#fff;border:1px dashed #ccd3da;padding:50px;text-align:center;color:var(--muted);border-radius:12px}@media(max-width:800px){.shell{grid-template-columns:1fr}.sidebar{display:none}.toolbar{grid-template-columns:1fr}}</style></head><body data-portal-nav="learner"><div class="shell"><aside class="sidebar"></aside><main class="main"><header class="top"><strong>RRT Learner Portal</strong></header><section class="content"><div class="eyebrow">Read-only resources</div><h1>Library</h1><p class="sub">Important safety, technical and company documents. View online or download a copy when needed.</p><div class="toolbar"><input id="search" placeholder="Search resources…"><select id="category"><option value="">All categories</option></select><select id="discipline"><option value="">All disciplines</option></select></div><div class="grid" id="grid"></div></section></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://qgbpotjqggeodxqcwkgj.supabase.co','sb_publishable_J1yPM1Hi7INCX2m7rp3PdA_JdQ46FRS');let docs=[],cats=[],discs=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const [c,d,l]=await Promise.all([db.from('library_categories').select('*').order('name'),db.from('library_disciplines').select('*').order('name'),db.from('library_documents').select('*,library_categories(name),library_document_disciplines(discipline_id,library_disciplines(name))').eq('published',true).is('archived_at',null).order('updated_at',{ascending:false})]);if(l.error){grid.innerHTML='<div class="empty">'+esc(l.error.message)+'</div>';return}cats=c.data||[];discs=d.data||[];docs=l.data||[];category.innerHTML='<option value="">All categories</option>'+cats.map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join('');discipline.innerHTML='<option value="">All disciplines</option>'+discs.map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join('');render()}function render(){const q=search.value.toLowerCase(),cat=category.value,di=discipline.value;const rows=docs.filter(x=>{const tags=x.library_document_disciplines||[];const text=[x.title,x.description,x.source_organisation,x.library_categories?.name,...tags.map(t=>t.library_disciplines?.name)].join(' ').toLowerCase();return(!q||text.includes(q))&&(!cat||x.category_id===cat)&&(!di||tags.some(t=>t.discipline_id===di))});grid.innerHTML=rows.length?rows.map(x=>'<article class="card"><div class="cover"><div><span class="pdf">'+esc((x.original_filename||'').split('.').pop().toUpperCase()||'FILE')+'</span><h3>'+esc(x.title)+'</h3><small>'+esc(x.library_categories?.name||'Resource')+'</small></div></div><div class="body"><div class="source">'+esc(x.source_organisation)+'</div><div class="meta">'+esc(x.version||'Current version')+(x.document_date?' · '+new Date(x.document_date).toLocaleDateString('en-GB'):'')+'</div><div class="tags">'+(x.library_document_disciplines||[]).map(t=>'<span class="tag">'+esc(t.library_disciplines?.name||'')+'</span>').join('')+'</div><div class="actions"><button class="btn red" onclick="file(\''+x.id+'\',false)">View</button><button class="btn light" onclick="file(\''+x.id+'\',true)">Download</button></div></div></article>').join(''):'<div class="empty">No published resources match your search.</div>'}search.oninput=category.oninput=discipline.oninput=render;window.file=async(id,download)=>{const x=docs.find(d=>d.id===id);if(download){const r=await db.storage.from('library-documents').download(x.file_path);if(r.error)return alert(r.error.message);const a=document.createElement('a');a.href=URL.createObjectURL(r.data);a.download=x.original_filename||x.title;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}else{const r=await db.storage.from('library-documents').createSignedUrl(x.file_path,300);if(r.error)return alert(r.error.message);window.open(r.data.signedUrl,'_blank')}};load();</script><script src="portal-navigation.js"></script></body></html>
