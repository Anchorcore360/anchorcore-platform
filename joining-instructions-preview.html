<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Joining Instructions Preview | RRTA</title><link rel="stylesheet" href="styles.css"><style>body{background:#f3f5f6}.wrap{max-width:1100px;margin:auto;padding:28px}.panel{background:#fff;border:1px solid #d9dee5;border-radius:12px;padding:20px;margin-bottom:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid label{font-size:12px;font-weight:800}.grid input,.grid select,.grid textarea{width:100%;padding:10px;border:1px solid #cfd5dd;border-radius:8px;margin-top:5px;font:inherit}.preview{white-space:pre-wrap;line-height:1.55;background:#fff;border:1px solid #e1e5e9;border-radius:10px;padding:22px;min-height:420px}.actions{display:flex;gap:8px;flex-wrap:wrap}.notice{padding:12px;border:1px dashed #cfd5dd;border-radius:8px;background:#fafbfc;color:#667085}@media(max-width:760px){.grid{grid-template-columns:1fr}}</style></head><body><header class="site-header"><div class="header-inner"><img src="rrta-logo.png" class="brand-logo" alt="RRTA"><div class="header-user">Joining Instructions</div></div></header><main class="wrap"><a class="text-btn" href="booked-courses.html">← Back to Booked Courses</a><section class="panel"><div class="eyebrow">Preview before sending</div><h1 id="title">Joining Instructions</h1><p class="muted" id="meta">Loading…</p><div class="notice"><strong>Email sending is OFF.</strong> This page only generates, previews, saves and approves drafts. Nothing is emailed automatically.</div></section><section class="panel"><div class="grid"><label>Attendee<select id="attendee"></select></label><label>Email<input id="recipient" type="email"></label><label class="full" style="grid-column:1/-1">Subject<input id="subject"></label></div></section><section class="panel"><div class="actions" style="margin-bottom:12px"><button class="btn secondary" id="regenerate">Regenerate from template</button><button class="btn dark" id="saveDraft">Save draft</button><button class="btn secondary" id="approve">Approve draft</button><button class="btn secondary" disabled title="Email automation is not enabled">Send email (disabled)</button></div><textarea id="body" style="width:100%;min-height:520px;padding:14px;border:1px solid #cfd5dd;border-radius:8px;font:inherit;line-height:1.5"></textarea></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=window.supabase.createClient('https://qgbpotjqggeodxqcwkgj.supabase.co','sb_publishable_J1yPM1Hi7INCX2m7rp3PdA_JdQ46FRS');const bookingId=new URLSearchParams(location.search).get('booking_id');let booking,people=[],template,locationRow,course;const fmt=d=>d?new Date(d+'T00:00:00').toLocaleDateString('en-GB'):'—';async function requireTrainer(){const {data:u}=await db.auth.getUser();if(!u?.user)throw Error('Please sign in through the Trainer Portal.');const {data:p}=await db.rpc('get_current_profile');const x=Array.isArray(p)?p[0]:p;if(!x||String(x.role).toLowerCase()!=='trainer')throw Error('Trainer access is required.')}function replaceAll(s,v){return s.replace(/{{\s*([a-z_]+)\s*}}/gi,(m,k)=>v[k]??'')}function values(p){const dates=booking.end_date&&booking.end_date!==booking.start_date?`${fmt(booking.start_date)} - ${fmt(booking.end_date)}`:fmt(booking.start_date);return{attendee_name:p?.attendee_name||'Delegate',attendee_forename:(p?.attendee_name||'Delegate').split(' ')[0],course_code:course?.course_code||'',course_title:booking.course_title||course?.title||'',course_dates:dates,duration:course?.duration_days?`${Number(course.duration_days)} day${Number(course.duration_days)===1?'':'s'}`:'',arrival_time:template.default_arrival_time||'',start_time:template.default_start_time||'',location:booking.location||'',location_details:locationRow?.address||'',venue_name:locationRow?.name||booking.location||'',venue_address:locationRow?.address||'',venue_postcode:locationRow?.postcode||'',what3words:locationRow?.what3words||'',point_of_contact:template.point_of_contact||'',contact_number:template.contact_number||'',contact_email:template.contact_email||'',food_drink:locationRow?.food_drink||'',parking:locationRow?.parking||'',booking_reference:booking.booking_reference||'',course_notes:booking.notes||''}}function render(){const p=people.find(x=>x.id===attendee.value)||people[0];if(p){attendee.value=p.id;recipient.value=p.attendee_email||''}const v=values(p);subject.value=replaceAll(template.subject_template,v);body.value=replaceAll(template.body_template,v)}async function load(){if(!bookingId)throw Error('No booking selected.');await requireTrainer();const {data:b,error}=await db.from('bookings').select('*').eq('id',bookingId).single();if(error)throw error;booking=b;const [a,c,t,l]=await Promise.all([db.from('booking_attendees').select('*').eq('booking_id',bookingId).order('attendee_name'),db.from('courses').select('*').eq('id',booking.course_id).maybeSingle(),db.from('joining_instruction_templates').select('*').eq('course_id',booking.course_id).eq('active',true).order('version',{ascending:false}).limit(1),db.from('training_locations').select('*').eq('name',booking.location).maybeSingle()]);people=a.data||[];course=c.data;template=t.data?.[0];locationRow=l.data;if(!template){const f=await db.from('joining_instruction_templates').select('*').is('course_id',null).eq('active',true).limit(1);template=f.data?.[0]}if(!template)throw Error('No joining-instruction template is configured for this course.');title.textContent=booking.course_title||'Joining Instructions';meta.textContent=`${booking.booking_reference} · ${fmt(booking.start_date)} · ${booking.location||'Venue TBC'}`;attendee.innerHTML=people.length?people.map(p=>`<option value="${p.id}">${p.attendee_name||'Delegate'}</option>`).join(''):'<option value="">No attendees added yet</option>';render()}attendee.onchange=render;regenerate.onclick=render;saveDraft.onclick=async()=>{const p=people.find(x=>x.id===attendee.value);if(!p)return alert('Add an attendee first.');const payload={booking_id:booking.id,attendee_id:p.id,template_id:template.id,rendered_subject:subject.value,rendered_body:body.value,status:'draft'};await db.from('booking_joining_instruction_drafts').delete().eq('booking_id',booking.id).eq('attendee_id',p.id).eq('template_id',template.id);const {error}=await db.from('booking_joining_instruction_drafts').insert(payload);if(error)return alert(error.message);alert('Draft saved. Nothing has been sent.')};approve.onclick=async()=>{const p=people.find(x=>x.id===attendee.value);if(!p)return alert('Add an attendee first.');const {data:d}=await db.from('booking_joining_instruction_drafts').select('id').eq('booking_id',booking.id).eq('attendee_id',p.id).eq('template_id',template.id).maybeSingle();if(!d)return alert('Save the draft first.');const {error}=await db.from('booking_joining_instruction_drafts').update({status:'approved',approved_at:new Date().toISOString(),rendered_subject:subject.value,rendered_body:body.value}).eq('id',d.id);if(error)return alert(error.message);alert('Draft approved. Email sending is still disabled.')};load().catch(e=>alert(e.message));</script><script src="joining-location-selector.js"></script></body></html>
