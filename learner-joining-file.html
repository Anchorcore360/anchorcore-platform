<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Joining Instructions | RRTA</title><style>:root{--red:#b20f22;--ink:#18202a;--muted:#6f7a88;--line:#e2e6ea;--bg:#f4f6f8}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,Arial,sans-serif;color:var(--ink)}.wrap{max-width:1100px;margin:28px auto;padding:0 18px}.head{margin-bottom:14px}.btn{display:inline-flex;text-decoration:none;border-radius:8px;background:#20262d;color:#fff;padding:10px 13px;font-weight:850}.card{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}.meta{padding:18px 20px;border-bottom:1px solid var(--line)}.meta h1{margin:3px 0;font-size:24px}.muted{color:var(--muted)}iframe{width:100%;height:76vh;border:0}.notice{padding:30px;text-align:center;color:var(--muted)}</style></head><body><main class="wrap"><div class="head"><a class="btn" href="learner-portal.html">← Back to My Overview</a></div><section class="card"><div class="meta"><div class="muted">Joining Instructions</div><h1 id="title">Loading…</h1><div class="muted" id="details"></div></div><div id="viewer"><div class="notice">Loading joining instructions…</div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=window.supabase.createClient('https://qgbpotjqggeodxqcwkgj.supabase.co','sb_publishable_J1yPM1Hi7INCX2m7rp3PdA_JdQ46FRS');const fmt=d=>d?new Date(d+'T00:00:00').toLocaleDateString('en-GB'):'—';async function load(){const booking=new URLSearchParams(location.search).get('booking');const{data:u}=await db.auth.getUser();if(!u?.user)return location.href='learner.html';if(!booking)throw new Error('Booking reference is missing.');const{data:att,error:ae}=await db.from('booking_attendees').select('id,bookings(id,course_id,course_title,start_date,location,courses(joining_instructions_path))').eq('booking_id',booking).eq('profile_id',u.user.id).maybeSingle();if(ae||!att?.bookings)throw new Error('These joining instructions are not available to this account.');const b=att.bookings,path=b.courses?.joining_instructions_path;if(!path)throw new Error('Joining instructions have not been uploaded for this course yet.');title.textContent=b.course_title||'Joining Instructions';details.textContent=fmt(b.start_date)+' · '+(b.location||'Location TBC');const{data:s,error}=await db.storage.from('course-specifications').createSignedUrl(path,900);if(error||!s?.signedUrl)throw new Error(error?.message||'Unable to open joining instructions.');viewer.innerHTML='<iframe title="Joining Instructions"></iframe>';viewer.querySelector('iframe').src=s.signedUrl}load().catch(e=>viewer.innerHTML='<div class="notice">'+String(e.message||'Unable to load joining instructions.').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))+'</div>');</script></body></html>
