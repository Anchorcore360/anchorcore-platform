<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Learner Compliance | RRTA</title><link rel="stylesheet" href="styles.css"><style>
body{background:#f3f5f6}.shell{max-width:1380px;margin:0 auto;padding:28px}.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:18px}.back{color:#9d0b1a;font-weight:800;text-decoration:none}.hero,.role-card,.req-panel{background:#fff;border:1px solid #dbe1e6;border-radius:14px}.hero{padding:22px 24px;display:flex;justify-content:space-between;gap:20px;align-items:center}.hero h1{margin:3px 0 6px}.summary{display:grid;grid-template-columns:180px repeat(4,1fr);gap:14px;margin-top:16px}.ring-card,.stat{background:#fff;border:1px solid #dbe1e6;border-radius:12px;padding:18px}.ring{width:126px;height:126px;border-radius:50%;display:grid;place-items:center;margin:auto;background:conic-gradient(#17824a calc(var(--pct)*1%),#e7ebee 0)}.ring-inner{width:90px;height:90px;border-radius:50%;background:#fff;display:grid;place-items:center;text-align:center}.ring strong{font-size:27px}.ring span{font-size:10px;color:#68727b}.stat span{display:block;color:#68727b;font-size:12px}.stat strong{display:block;font-size:28px;margin-top:8px}.roles{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}.role-card{padding:20px}.role-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.progress{height:10px;background:#e7ebee;border-radius:999px;overflow:hidden;margin:14px 0}.progress>div{height:100%;background:#17824a}.req-panel{padding:20px;margin-top:16px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.tab{border:1px solid #d1d7dc;background:#fff;border-radius:8px;padding:9px 12px;font-weight:800}.tab.active{background:#252b31;color:#fff}.req-list{display:grid;gap:8px}.req{display:grid;grid-template-columns:1.4fr .7fr .7fr;gap:12px;align-items:center;padding:12px;border:1px solid #e1e5e9;border-radius:9px;background:#fbfcfd}.badge{justify-self:start;border-radius:999px;padding:5px 8px;font-size:11px;font-weight:850}.valid{background:#e8f6ed;color:#176b37}.expiring{background:#fff6d8;color:#8a6100}.expired,.missing{background:#fdebec;color:#b42318}.muted{color:#68727b}.error{background:#fdebec;color:#9b1c28;padding:14px;border-radius:9px}.modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.46);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px}.modal-card{width:min(720px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:14px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.25)}.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.modal-close{border:0;background:transparent;font-size:24px;cursor:pointer}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.form-grid label{font-weight:700;font-size:13px}.form-grid input{width:100%;margin-top:6px;padding:11px 12px;border:1px solid #cfd5dd;border-radius:8px;font:inherit}.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}.notice{padding:10px 12px;border-radius:8px;background:#f5f7f9;color:#475467;font-size:13px}.hidden{display:none!important}@media(max-width:900px){.summary{grid-template-columns:1fr 1fr}.ring-card{grid-column:1/-1}.roles{grid-template-columns:1fr}.req{grid-template-columns:1fr}}@media(max-width:600px){.form-grid{grid-template-columns:1fr}}
</style></head><body><header class="site-header"><div class="header-inner"><img src="rrta-logo.png" class="brand-logo" alt="RRTA"><div id="headerUser" class="header-user"></div></div></header><main class="shell"><div class="top"><div><a id="backLink" class="back" href="trainer.html">← Back to learner profile</a><div class="eyebrow" style="margin-top:10px">Compliance record</div></div></div><section id="app"><div class="hero"><div><h1 id="name">Loading…</h1><div class="muted"><span id="employee">—</span> · <span id="organisation">—</span></div></div><div class="status live">LIVE COMPLIANCE</div></div><div id="summary" class="summary"></div><div id="roles" class="roles"></div><section class="req-panel"><div class="role-head"><div><h2>Accreditation Requirements</h2><p class="muted">Shows exactly what is held, expiring, expired or missing against the selected job role.</p></div><button class="btn dark" id="addAccBtn" type="button">+ Add Accreditation</button></div><div id="roleTabs" class="tabs"></div><div id="requirements" class="req-list"></div></section></section><div id="error" class="error hidden"></div></main><div id="modalRoot"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=window.supabase.createClient('https://qgbpotjqggeodxqcwkgj.supabase.co','sb_publishable_J1yPM1Hi7INCX2m7rp3PdA_JdQ46FRS');const id=new URLSearchParams(location.search).get('id');let profile,roles=[],accs=[],roleData=[],selected=0;const esc=(v='')=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const fmt=d=>d?new Date(d+'T00:00:00').toLocaleDateString('en-GB'):'—';function norm(v=''){return String(v||'').toUpperCase().replace(/[^A-Z0-9]+/g,' ').trim()}function code(v=''){const m=String(v||'').toUpperCase().match(/\b(SA\d+[A-Z]?|S\d{3}|Q\d{2,3}|O\d+|IPAF\s*1B|EFAW\s*L?3|SHEA\s*TELECOMS)\b/);return m?m[1].replace(/\s+/g,''):''}function matches(req,a){const r=code(req),c=code(a.accreditation_name);if(r&&c)return r===c;const rn=norm(req).replace(/ CERTIFIED/g,'').replace(/ AWARENESS FOR EMPLOYEES/g,'');const an=norm(a.accreditation_name);return rn===an||an.includes(rn)||rn.includes(an)}function stat(a){if(!a)return'missing';if(!a.expiry_date)return'valid';const t=new Date();t.setHours(0,0,0,0);const e=new Date(a.expiry_date+'T00:00:00'),d=Math.ceil((e-t)/86400000);return d<0?'expired':d<=30?'expiring':'valid'}async function auth(){const {data:{session}}=await db.auth.getSession();if(!session)throw new Error('Please sign in through the Trainer Portal first.');const {data,error}=await db.rpc('get_current_profile');if(error)throw error;const t=Array.isArray(data)?data[0]:data;if(!t||String(t.role).toLowerCase()!=='trainer')throw new Error('Trainer access is required.');document.getElementById('headerUser').textContent=(t.full_name||'Trainer')+' · Trainer'}async function load(){if(!id)throw new Error('No learner selected.');const [p,r,a]=await Promise.all([db.from('profiles').select('*').eq('id',id).maybeSingle(),db.from('profile_job_roles').select('job_role_id,is_primary,job_roles(id,name,division)').eq('profile_id',id).order('is_primary',{ascending:false}),db.from('accreditations').select('*').eq('learner_id',id)]);if(p.error)throw p.error;if(!p.data)throw new Error('Learner not found.');profile=p.data;roles=r.data||[];accs=a.data||[];roleData=[];for(const role of roles){const q=await db.from('job_role_requirements').select('status,notes,compliance_items(id,name)').eq('job_role_id',role.job_role_id).eq('status','required');if(q.error)throw q.error;const reqs=(q.data||[]).map(x=>{const match=accs.find(a=>matches(x.compliance_items?.name||'',a));return{name:x.compliance_items?.name||'Requirement',match,status:stat(match)}});const total=reqs.length,covered=reqs.filter(x=>['valid','expiring'].includes(x.status)).length;roleData.push({...role,reqs,total,covered,missing:reqs.filter(x=>x.status==='missing').length,expired:reqs.filter(x=>x.status==='expired').length,expiring:reqs.filter(x=>x.status==='expiring').length,pct:total?Math.round(covered/total*100):0})}render()}function render(){const name=[profile.forename,profile.surname].filter(Boolean).join(' ')||profile.full_name||'Learner';document.title=name+' Compliance | RRTA';document.getElementById('name').textContent=name;document.getElementById('employee').textContent='Employee '+(profile.employee_number||'—');document.getElementById('organisation').textContent=profile.organisation||'—';document.getElementById('backLink').href='learner-profile.html?id='+encodeURIComponent(id);const allReq=new Map();roleData.forEach(r=>r.reqs.forEach(x=>{const k=norm(x.name);if(!allReq.has(k))allReq.set(k,x)}));const all=[...allReq.values()],overallTotal=all.length,overallCovered=all.filter(x=>['valid','expiring'].includes(x.status)).length,overallPct=overallTotal?Math.round(overallCovered/overallTotal*100):0;document.getElementById('summary').innerHTML=`<div class="ring-card"><div class="ring" style="--pct:${overallPct}"><div class="ring-inner"><strong>${overallPct}%</strong><span>overall covered</span></div></div></div><div class="stat"><span>Total required</span><strong>${overallTotal}</strong></div><div class="stat"><span>Covered</span><strong>${overallCovered}</strong></div><div class="stat"><span>Missing</span><strong>${all.filter(x=>x.status==='missing').length}</strong></div><div class="stat"><span>Expired</span><strong>${all.filter(x=>x.status==='expired').length}</strong></div>`;document.getElementById('roles').innerHTML=roleData.map((r,i)=>`<article class="role-card"><div class="role-head"><div><div class="eyebrow">${r.is_primary?'Primary Role':'Secondary Role'}</div><h2>${esc(r.job_roles?.name||'Job Role')}</h2><div class="muted">${esc(r.job_roles?.division||'')}</div></div><strong style="font-size:28px">${r.pct}%</strong></div><div class="progress"><div style="width:${r.pct}%"></div></div><div style="display:flex;gap:8px;flex-wrap:wrap"><span class="badge valid">${r.covered}/${r.total} covered</span><span class="badge missing">${r.missing} missing</span>${r.expired?`<span class="badge expired">${r.expired} expired</span>`:''}${r.expiring?`<span class="badge expiring">${r.expiring} expiring</span>`:''}</div></article>`).join('')||'<div class="role-card">No job roles assigned.</div>';document.getElementById('roleTabs').innerHTML=roleData.map((r,i)=>`<button class="tab ${i===selected?'active':''}" data-i="${i}">${r.is_primary?'Primary: ':'Secondary: '}${esc(r.job_roles?.name||'Role')}</button>`).join('');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{selected=Number(b.dataset.i);renderReqs();document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b))});renderReqs()}function renderReqs(){const r=roleData[selected];const box=document.getElementById('requirements');if(!r){box.innerHTML='<div class="muted">No requirements to show.</div>';return}box.innerHTML=r.reqs.map(x=>`<div class="req"><div><strong>${esc(x.name)}</strong>${x.match?`<div class="muted" style="font-size:12px;margin-top:3px">Recorded as ${esc(x.match.accreditation_name||'')} · Expires ${fmt(x.match.expiry_date)}</div>`:'<div class="muted" style="font-size:12px;margin-top:3px">No matching accreditation logged</div>'}</div><span class="badge ${x.status}">${x.status.charAt(0).toUpperCase()+x.status.slice(1)}</span><div>${x.match?.certificate_url?'<span class="muted">Certificate uploaded</span>':'<span class="muted">—</span>'}</div></div>`).join('')}
function accStatus(expiry){if(!expiry)return'valid';const t=new Date();t.setHours(0,0,0,0);const e=new Date(expiry+'T00:00:00'),d=Math.ceil((e-t)/86400000);return d<0?'expired':d<=30?'expiring':'valid'}function closeModal(){document.getElementById('modalRoot').innerHTML=''}function openAccModal(prefill=''){const root=document.getElementById('modalRoot');root.innerHTML=`<div class="modal-backdrop"><div class="modal-card"><div class="modal-head"><h2>Add Accreditation</h2><button class="modal-close" type="button">×</button></div><form id="accForm"><div class="form-grid"><label>Accreditation Name<input name="name" required value="${esc(prefill)}"></label><label>Awarding Body<input name="awarding"></label><label>Certificate Number<input name="number"></label><label>Issue Date<input type="date" name="issue"></label><label>Expiry Date<input type="date" name="expiry"></label><label style="grid-column:1/-1">Evidence / Certificate File<input type="file" name="file" accept="application/pdf,image/jpeg,image/png"></label></div><div id="modalMsg" class="notice hidden"></div><div class="modal-actions"><button class="btn secondary" type="button" id="modalCancel">Cancel</button><button class="btn dark" type="submit">Save Accreditation</button></div></form></div></div>`;root.querySelector('.modal-close').onclick=closeModal;root.querySelector('#modalCancel').onclick=closeModal;root.querySelector('.modal-backdrop').onclick=e=>{if(e.target.classList.contains('modal-backdrop'))closeModal()};root.querySelector('#accForm').onsubmit=async e=>{e.preventDefault();const form=e.currentTarget,submit=form.querySelector('button[type=submit]'),msg=root.querySelector('#modalMsg');submit.disabled=true;submit.textContent='Saving…';try{const f=new FormData(form),file=f.get('file');let path=null;if(file&&file.size){path=`${id}/accreditations/${Date.now()}-${file.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;const up=await db.storage.from('learner-documents').upload(path,file);if(up.error)throw up.error}const expiry=f.get('expiry')||null;const payload={learner_id:id,accreditation_name:f.get('name').trim(),awarding_body:f.get('awarding').trim()||null,certificate_number:f.get('number').trim()||null,status:accStatus(expiry),issue_date:f.get('issue')||null,expiry_date:expiry,certificate_url:path};const {error}=await db.from('accreditations').insert(payload);if(error){if(path)await db.storage.from('learner-documents').remove([path]);throw error}closeModal();await load()}catch(err){msg.textContent=err.message||'Unable to save accreditation.';msg.classList.remove('hidden')}finally{submit.disabled=false;submit.textContent='Save Accreditation'}}}
document.getElementById('addAccBtn').onclick=()=>openAccModal();function fail(e){document.getElementById('app').classList.add('hidden');const x=document.getElementById('error');x.textContent=e.message||'Unable to load compliance.';x.classList.remove('hidden')} (async()=>{try{await auth();await load()}catch(e){fail(e)}})();
</script></body></html>
