<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Joining Instructions | RRTA</title><style>:root{--red:#b20f22;--ink:#18202a;--muted:#6f7a88;--line:#e1e5ea;--bg:#f3f5f7}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:var(--ink)}.wrap{max-width:850px;margin:36px auto;padding:0 16px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 30px rgba(20,30,40,.08);overflow:hidden}.head{padding:22px 24px;background:linear-gradient(135deg,#171c22,#2b3037);color:#fff}.brand{font-weight:950;font-size:18px}.head h1{font-size:28px;margin:18px 0 4px}.head p{margin:0;color:#d8dee7}.body{padding:22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.box{border:1px solid var(--line);border-radius:10px;padding:13px;background:#fafbfc}.box span{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;font-weight:800}.box strong{display:block;margin-top:4px;font-size:14px}.notice{margin:16px 0;padding:13px;border-left:4px solid var(--red);background:#fff5f6;border-radius:8px;font-size:12px;line-height:1.45}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.btn{border:0;border-radius:8px;padding:10px 13px;background:#20262d;color:#fff;font-weight:850;text-decoration:none;cursor:pointer}.btn.red{background:var(--red)}.status{margin-top:14px;font-size:11px;color:var(--muted)}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><section class="card"><div class="head"><div class="brand">Rapid Response Training Academy</div><h1 id="title">Joining Instructions</h1><p id="sub">Loading your booking…</p></div><div class="body" id="body">Loading…</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=window.supabase.createClient('https://qgbpotjqggeodxqcwkgj.supabase.co','sb_publishable_J1yPM1Hi7INCX2m7rp3PdA_JdQ46FRS');const token=new URLSearchParams(location.search).get('token');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const fmtDate=d=>d?new Date(d+'T00:00:00').toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'}):'TBC';const fmtTime=t=>t?String(t).slice(0,5):'TBC';async function load(){if(!token)throw Error('This joining-instruction link is invalid.');const {data,error}=await db.rpc('get_external_joining_instruction',{p_token:token});if(error)throw error;const x=Array.isArray(data)?data[0]:data;if(!x)throw Error('These joining instructions are not available.');await db.rpc('mark_external_joining_instruction_viewed',{p_token:token});title.textContent=x.course_title||'Training Course';sub.textContent=`Booking ${x.booking_reference||''}`;body.innerHTML=`<div class="notice"><strong>Your training booking is confirmed.</strong><br>Please check the booking information below, then open the course joining instructions and acknowledge that you have read both.</div><div class="grid"><div class="box"><span>Delegate</span><strong>${esc(x.attendee_name)}</strong></div><div class="box"><span>Date</span><strong>${esc(fmtDate(x.start_date))}</strong></div><div class="box"><span>Time</span><strong>${esc(fmtTime(x.start_time))}</strong></div><div class="box"><span>Location</span><strong>${esc(x.location||'TBC')}</strong></div><div class="box"><span>Address</span><strong>${esc([x.location_address,x.location_postcode].filter(Boolean).join(', ')||'TBC')}</strong></div><div class="box"><span>What3Words</span><strong>${esc(x.what3words||'TBC')}</strong></div></div><div class="actions"><a class="btn" target="_blank" href="course-joining-instructions.html?key=${encodeURIComponent(x.document_key||'sa006-generic-v1')}">View Course Joining Instructions</a>${x.instructions_acknowledged_at?'<span class="btn" style="background:#176b37;pointer-events:none">Acknowledged ✓</span>':'<button class="btn red" id="ack">I have read & understood</button>'}</div><div class="status">Opening this page records a viewed receipt. Acknowledgement is recorded against this delegate and booking.</div>`;const ack=document.getElementById('ack');if(ack)ack.onclick=async()=>{ack.disabled=true;const r=await db.rpc('acknowledge_external_joining_instruction',{p_token:token});if(r.error){ack.disabled=false;return alert(r.error.message)}ack.textContent='Acknowledged ✓';ack.style.background='#176b37';alert('Thank you. Your acknowledgement has been recorded.')};}load().catch(e=>{body.innerHTML=`<div class="notice">${esc(e.message||'Unable to load joining instructions.')}</div>`});</script></body></html>
