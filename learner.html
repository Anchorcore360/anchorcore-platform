<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Learner Portal | RRTA</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header"><div class="header-inner"><img src="rrta-logo.png" class="brand-logo" alt="Rapid Response Training Academy"></div></header>
  <main class="screen active">
    <section class="login-wrap">
      <div class="login-card">
        <div class="eyebrow">Rapid Response Training Academy</div>
        <h1>RRT Learner Portal</h1>
        <p class="lead">Use the same account you use for Workforce or Academy access.</p>
        <form id="learnerLoginForm">
          <label>Email Address<input id="learnerEmail" type="email" autocomplete="username" required></label>
          <label>Password<input id="learnerPassword" type="password" autocomplete="current-password" required></label>
          <button class="btn primary full" type="submit">Sign In To My Learning</button>
          <p id="learnerError" class="error hidden">Email or password not recognised.</p>
        </form>
        <p style="margin-top:20px"><a class="text-btn" href="portal.html">← Back To Portal Choice</a></p>
      </div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const db = window.supabase.createClient('https://qgbpotjqggeodxqcwkgj.supabase.co','sb_publishable_J1yPM1Hi7INCX2m7rp3PdA_JdQ46FRS');
    const form=document.getElementById('learnerLoginForm');
    const errorBox=document.getElementById('learnerError');
    async function canUseLearnerPortal(userId){
      const [{data:profile,error:profileError},{data:access}] = await Promise.all([
        db.from('profiles').select('role,permission_level').eq('id',userId).single(),
        db.from('portal_access').select('learner_portal').eq('user_id',userId).maybeSingle()
      ]);
      if(profileError||!profile)return false;
      return access?.learner_portal===true || String(profile.role).toLowerCase()==='learner' || profile.permission_level==='super_user';
    }
    form.addEventListener('submit',async(e)=>{
      e.preventDefault(); errorBox.classList.add('hidden');
      const email=document.getElementById('learnerEmail').value.trim().toLowerCase();
      const password=document.getElementById('learnerPassword').value;
      const {data,error}=await db.auth.signInWithPassword({email,password});
      if(error){errorBox.textContent=error.message||'Email or password not recognised.';errorBox.classList.remove('hidden');return;}
      if(!(await canUseLearnerPortal(data.user.id))){await db.auth.signOut();errorBox.textContent='This account does not have learner portal access.';errorBox.classList.remove('hidden');return;}
      window.location.href='learner-portal.html';
    });
    (async()=>{const{data}=await db.auth.getUser();if(data?.user&&await canUseLearnerPortal(data.user.id))window.location.href='learner-portal.html'})();
  </script>
</body>
</html>
