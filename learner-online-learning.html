<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Online Learning | RRTA</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="portal-navigation.css"><style>:root{--red:#b20f22;--ink:#18202a;--muted:#6f7a88;--line:#e2e6ea;--bg:#f4f6f8}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,Arial,sans-serif;color:var(--ink)}.shell{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}.side{position:sticky;top:0;height:100vh;background:linear-gradient(180deg,#151a22,#1e2530);padding:16px 12px;color:#d8dee7}.brand{padding:6px 10px 16px}.brand img{width:155px}.main{min-width:0}.top{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 28px;gap:14px}.back{width:36px;height:36px;border:1px solid #d9dee4;border-radius:9px;background:#fff;font-size:20px;cursor:pointer}.content{padding:28px 30px 60px;max-width:1500px;margin:auto}.eyebrow{font-size:10px;color:var(--red);font-weight:900;text-transform:uppercase;letter-spacing:.11em}h1{margin:5px 0 6px;font-size:30px}.muted{color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:18px 0}.stat,.panel{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 24px rgba(18,24,33,.05)}.stat{padding:17px}.stat span{display:block;color:var(--muted);font-size:10px}.stat strong{display:block;font-size:25px;margin-top:5px}.panel{padding:18px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:14px}.card{border:1px solid var(--line);border-radius:13px;background:#fff;overflow:hidden;display:flex;flex-direction:column;min-height:210px}.body{padding:17px;display:flex;flex-direction:column;flex:1}.pill{display:inline-flex;align-self:flex-start;padding:5px 8px;border-radius:999px;font-size:9px;font-weight:850;background:#f2f3f5;color:#596270}.done{background:#e8f6ee;color:#176a3e}.progress{background:#fff4d7;color:#8a6100}.title{font-size:16px;font-weight:850;margin:9px 0 5px}.meta{font-size:10px;color:var(--muted);line-height:1.45}.bar{height:6px;background:#edf0f3;border-radius:99px;overflow:hidden;margin:14px 0 8px}.bar i{display:block;height:100%;background:var(--red)}.btn{margin-top:auto;display:inline-flex;justify-content:center;border:0;border-radius:9px;padding:10px 12px;background:var(--red);color:#fff;font-size:10px;font-weight:850;text-decoration:none;cursor:pointer}.empty{grid-column:1/-1;padding:28px;text-align:center;border:1px dashed #ccd2d8;border-radius:12px;color:var(--muted)}@media(max-width:1000px){.shell{grid-template-columns:1fr}.side{display:none}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.stats,.grid{grid-template-columns:1fr}.content{padding:20px 14px}}</style></head><body data-portal-nav="learner"><div class="shell"><aside class="side"><div class="brand"><img src="rrta-logo.png" alt="RRTA"></div></aside><main class="main"><header class="top"><button class="back" onclick="history.length>1?history.back():location.href='learner-portal.html'">←</button><div><strong>Learner Portal</strong><div style="font-size:9px;color:#6f7a88">My Online Learning</div></div></header><div class="content"><div class="eyebrow">My Learning</div><h1>Online Learning</h1><div class="muted">Your assigned RRTA online courses, progress and results.</div><div class="stats"><div class="stat"><span>Assigned</span><strong id="assigned">0</strong></div><div class="stat"><span>Outstanding</span><strong id="outstanding">0</strong></div><div class="stat"><span>In Progress</span><strong id="inprogress">0</strong></div><div class="stat"><span>Completed</span><strong id="completed">0</strong></div></div><section class="panel"><div class="eyebrow">Course Library</div><h2>My Courses</h2><div class="grid" id="grid"><div class="empty">Loading your learning…</div></div></section></div></main></div><script src="portal-navigation.js?v=20260916-6"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient('https://qgbpotjqggeodxqcwkgj.supabase.co','sb_publishable_J1yPM1Hi7INCX2m7rp3PdA_JdQ46FRS');const esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));async function load(){const {data:{user}}=await sb.auth.getUser();if(!user){location.href='portal.html';return}const {data,error}=await sb.from('online_course_assignments').select('id,status,progress,score,completed_at,course_id,online_courses(*)').eq('learner_id',user.id).order('updated_at',{ascending:false});if(error){grid.innerHTML='<div class="empty">Unable to load your online learning.</div>';return}const a=data||[];assigned.textContent=a.length;completed.textContent=a.filter(x=>['completed','passed'].includes(x.status)).length;inprogress.textContent=a.filter(x=>x.status==='in_progress').length;outstanding.textContent=a.filter(x=>!['completed','passed'].includes(x.status)).length;grid.innerHTML=a.length?a.map(x=>{const c=x.online_courses||{},done=['completed','passed'].includes(x.status),prog=Number(x.progress||0),target=['launch_url','content_url','scorm_url','url'].map(k=>c[k]).find(Boolean)||('online-course.html?course='+encodeURIComponent(x.course_id));return `<article class="card"><div class="body"><span class="pill ${done?'done':x.status==='in_progress'?'progress':''}">${done?'COMPLETED':x.status==='in_progress'?'IN PROGRESS':'REQUIRED'}</span><div class="title">${esc(c.title||'Online Course')}</div><div class="meta">${esc(c.description||'RRTA online learning')}</div><div class="bar"><i style="width:${Math.max(0,Math.min(100,prog))}%"></i></div><div class="meta">${prog}% complete${x.score!=null?' · Score '+Math.round(Number(x.score))+'%':''}</div><a class="btn" href="${esc(target)}">${done?'View Result':prog>0?'Continue Course':'Start Course'}</a></div></article>`}).join(''):'<div class="empty">You have no online courses assigned yet.</div>'}load();</script></body></html>
