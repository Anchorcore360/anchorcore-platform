<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Company Teams | RRTA</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="portal-navigation.css"><style>:root{--red:#b20f22;--ink:#18202a;--muted:#6f7a88;--line:#e2e6ea;--bg:#f4f6f8}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,Arial,sans-serif;color:var(--ink)}.shell{display:grid;grid-template-columns:258px 1fr;min-height:100vh}.side{background:linear-gradient(180deg,#151a22,#1e2530);padding:16px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}.brand{padding:6px 10px 16px;border-bottom:1px solid rgba(255,255,255,.08)}.brand img{width:188px}.spacer{flex:1}.main{min-width:0}.top{height:66px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 28px;justify-content:space-between}.content{padding:26px 30px 60px;max-width:1350px;margin:auto}.head h1{margin:5px 0 6px;font-size:30px}.eyebrow{font-size:10px;color:var(--red);font-weight:900;text-transform:uppercase;letter-spacing:.11em}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:.8fr 1.2fr;gap:15px}.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 10px 24px rgba(18,24,33,.05)}select{width:100%;height:42px;border:1px solid #d3d9df;border-radius:8px;padding:0 10px;font:inherit;margin-top:5px}.btn{border:0;border-radius:8px;padding:10px 12px;font-weight:800;font-size:11px;cursor:pointer}.primary{background:var(--red);color:#fff}.list{display:grid;gap:8px;margin-top:14px}.item{border:1px solid var(--line);border-radius:9px;padding:12px;background:#fafbfc;display:flex;justify-content:space-between;align-items:center;gap:12px}.item strong{display:block}.item span{display:block;color:var(--muted);font-size:10px;margin-top:3px}.remove{border:1px solid #f3b7bd;background:#fff;color:#b20f22;border-radius:7px;padding:7px 9px;cursor:pointer;font-size:10px;font-weight:800}@media(max-width:900px){.shell{grid-template-columns:1fr}.side{position:relative;height:auto}.grid{grid-template-columns:1fr}.content{padding:20px 14px}}</style></head><body data-portal-nav="academy"><div class="shell"><aside class="side"><div class="brand"><img src="rrta-logo.png" alt="RRTA"></div><div class="spacer"></div></aside><main class="main"><header class="top"><strong>RRTA Training Academy Administration</strong><span class="muted">Company Teams</span></header><div class="content"><div class="head"><div class="eyebrow">Compliance Structure</div><h1>Company Teams</h1><p class="muted">Link companies that work for RRT to one or more managers. This gives us the structure for company-level compliance and team reporting later.</p></div><div class="grid"><section class="panel"><h2>Add Company To Manager Team</h2><label>RRT Company<select id="company"><option value="">Select company</option></select></label><label style="display:block;margin-top:12px">Manager<select id="manager"><option value="">Select manager</option></select></label><label style="display:block;margin-top:12px">Relationship<select id="linkType"><option value="team_manager">Team Manager</option><option value="contract_owner">Contract Owner</option></select></label><button id="add" class="btn primary" style="margin-top:14px">Add To Team</button><div id="msg" class="muted" style="margin-top:10px;font-size:10px"></div></section><section class="panel"><h2>Current Company Team Links</h2><div id="list" class="list"><div class="muted">Loading…</div></div></section></div></div></main></div><script src="portal-navigation.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=window.supabase.createClient('https://qgbpotjqggeodxqcwkgj.supabase.co','sb_publishable_J1yPM1Hi7INCX2m7rp3PdA_JdQ46FRS');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));let companies=[],managers=[],links=[];async function load(){const{data:u}=await db.auth.getUser();if(!u?.user){location.href='portal.html';return}const{data:p}=await db.from('profiles').select('role,permission_level').eq('id',u.user.id).single();if(!p||(String(p.role).toLowerCase()!=='trainer'&&p.permission_level!=='super_user')){location.href='portal.html';return}const[c,m,l]=await Promise.all([db.from('external_customers').select('id,company_name,is_rrt_subcontractor,is_internal_rrt,active').eq('active',true).or('is_rrt_subcontractor.eq.true,is_internal_rrt.eq.true').order('company_name'),db.from('profiles').select('id,full_name,job_title,account_status').order('full_name'),db.from('company_manager_links').select('*').eq('active',true)]);for(const x of[c,m,l])if(x.error)throw x.error;companies=c.data||[];managers=(m.data||[]).filter(x=>(x.account_status||'active')==='active');links=l.data||[];companies.forEach(x=>company.insertAdjacentHTML('beforeend',`<option value="${x.id}">${esc(x.company_name)}</option>`));managers.forEach(x=>manager.insertAdjacentHTML('beforeend',`<option value="${x.id}">${esc(x.full_name)}${x.job_title?' · '+esc(x.job_title):''}</option>`));render()}function cName(id){return companies.find(x=>x.id===id)?.company_name||'Company'}function mName(id){return managers.find(x=>x.id===id)?.full_name||'Manager'}function render(){list.innerHTML=links.length?links.map(x=>`<div class="item"><div><strong>${esc(cName(x.company_id))}</strong><span>${esc(mName(x.manager_profile_id))} · ${x.link_type==='contract_owner'?'Contract Owner':'Team Manager'}</span></div><button class="remove" data-id="${x.id}">Remove</button></div>`).join(''):'<div class="muted">No company team links yet.</div>';document.querySelectorAll('.remove').forEach(b=>b.onclick=()=>removeLink(b.dataset.id))}add.onclick=async()=>{if(!company.value||!manager.value){msg.textContent='Select a company and manager.';return}const{data,error}=await db.from('company_manager_links').upsert({company_id:company.value,manager_profile_id:manager.value,link_type:linkType.value,active:true},{onConflict:'company_id,manager_profile_id,link_type'}).select().single();if(error){msg.textContent=error.message;return}links=links.filter(x=>x.id!==data.id);links.push(data);msg.textContent='Company added to manager team.';render()};async function removeLink(id){const{error}=await db.from('company_manager_links').update({active:false}).eq('id',id);if(error)return alert(error.message);links=links.filter(x=>x.id!==id);render()}load().catch(e=>list.innerHTML=`<div class="muted">${esc(e.message)}</div>`);</script></body></html>
