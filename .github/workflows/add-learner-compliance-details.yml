name: Add learner compliance details
on:
  push:
    branches: [fullscreen-preview]
    paths:
      - 'learner-compliance-details.js'
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fullscreen-preview
      - name: Wire script into learner dashboard
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('learner-dashboard.html')
          s=p.read_text()
          tag='<script src="learner-compliance-details.js"></script>'
          if tag not in s:
              s=s.replace('</body></html>', tag+'</body></html>')
              p.write_text(s)
          PY
      - name: Commit wiring
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add learner-dashboard.html
          git commit -m 'Show learner certificate details and booked courses'
          git push origin fullscreen-preview