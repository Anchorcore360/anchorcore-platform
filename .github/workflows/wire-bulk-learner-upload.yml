name: Wire bulk learner upload
on:
  push:
    branches: [fullscreen-preview]
    paths:
      - 'bulk-learner-upload.js'
      - '.github/workflows/wire-bulk-learner-upload.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fullscreen-preview
      - name: Add script to trainer portal
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('trainer.html')
          s=p.read_text()
          tag='<script src="bulk-learner-upload.js"></script>'
          if tag not in s:
              s=s.replace('</body></html>', tag+'</body></html>')
              p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trainer.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Enable bulk learner spreadsheet upload"
          git push