name: Add learner profile manager UI
on:
  push:
    branches:
      - fullscreen-preview
    paths:
      - '.github/workflows/profile-managers.yml'
permissions:
  contents: write
jobs:
  enhance-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Link profile enhancements
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('learner-profile.html')
          s=p.read_text()
          css='<link rel="stylesheet" href="profile-enhancements.css">'
          js='<script src="profile-managers.js"></script>'
          if css not in s:
              s=s.replace('<title>Learner Profile | RRTA</title><link rel="stylesheet" href="styles.css">', '<title>Learner Profile | RRTA</title><link rel="stylesheet" href="styles.css">'+css)
          if js not in s:
              s=s.replace('</body></html>', js+'\n</body></html>')
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add learner-profile.html
          if git diff --cached --quiet; then
            echo "Profile already enhanced"
          else
            git commit -m "Show managers and compact learner profile layout"
            git push
          fi
