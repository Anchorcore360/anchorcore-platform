name: Add booked course candidates
on:
  push:
    branches: [fullscreen-preview]
    paths:
      - 'booked-courses-candidates.js'
      - '.github/workflows/add-booked-course-candidates.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fullscreen-preview
      - name: Add candidate enhancement script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('booked-courses.html')
          s=p.read_text()
          tag='<script src="booked-courses-candidates.js"></script>'
          if tag not in s:
              s=s.replace('</body></html>',tag+'\n</body></html>')
          p.write_text(s)
          PY
      - name: Commit booked course candidate enhancements
        run: |
          git config user.name "Anchorcore360"
          git config user.email "anchorcore360@outlook.com"
          git add booked-courses.html
          git diff --cached --quiet || git commit -m "Add internal and saved external candidate management"
          git push
