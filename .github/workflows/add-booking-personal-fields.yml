name: Add booking personal fields
on:
  push:
    branches: [fullscreen-preview]
    paths:
      - 'add-learners-booking-fields.js'
      - '.github/workflows/add-booking-personal-fields.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fullscreen-preview
      - name: Add booking fields script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('add-learners.html')
          s=p.read_text()
          tag='<script src="add-learners-booking-fields.js"></script>'
          if tag not in s:
              s=s.replace('</body></html>',tag+'\n</body></html>')
          p.write_text(s)
          PY
      - name: Commit patched page
        run: |
          git config user.name "Anchorcore360"
          git config user.email "anchorcore360@outlook.com"
          git add add-learners.html
          git diff --cached --quiet || git commit -m "Add booking personal fields to learner form"
          git push
