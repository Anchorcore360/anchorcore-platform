name: Add bookings navigation
on:
  push:
    branches: [fullscreen-preview]
    paths:
      - 'bookings.html'
      - '.github/workflows/add-bookings-nav.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fullscreen-preview
      - name: Add Bookings workspace link to trainer portal
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('trainer.html')
          s=p.read_text()
          if 'href="bookings.html"' not in s:
              marker='<a class="side-link" href="compliance.html">'
              booking='''<a class="side-link" href="bookings.html"><span class="side-icon"><svg viewBox="0 0 24 24"><path d="M4 5h16v15H4z"/><path d="M8 3v4M16 3v4M4 10h16"/></svg></span><span>Bookings</span></a>'''
              s=s.replace(marker,booking+marker)
          p.write_text(s)
          PY
      - name: Commit patched trainer portal
        run: |
          git config user.name "Anchorcore360"
          git config user.email "anchorcore360@outlook.com"
          git add trainer.html
          git diff --cached --quiet || git commit -m "Add Bookings workspace to trainer navigation"
          git push
