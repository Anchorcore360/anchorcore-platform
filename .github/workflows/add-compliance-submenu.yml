name: Add Compliance submenu
on:
  push:
    branches: [fullscreen-preview]
    paths:
      - '.github/workflows/add-compliance-submenu.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fullscreen-preview
      - name: Add compliance menu script
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ['trainer.html','compliance.html']:
              p=Path(name)
              s=p.read_text()
              tag='<script src="compliance-menu.js"></script>'
              if tag not in s:
                  s=s.replace('</body>', tag+'\n</body>')
                  p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trainer.html compliance.html
          if ! git diff --cached --quiet; then
            git commit -m "Add expandable Compliance submenu"
            git push origin fullscreen-preview
          fi
