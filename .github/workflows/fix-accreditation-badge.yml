name: Fix accreditation badge rendering
on:
  push:
    paths:
      - '.github/workflows/fix-accreditation-badge.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fullscreen-preview
      - name: Fix safe badge rendering
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('learner-profile.html')
          s=p.read_text()
          old="const record=(title,meta,right='',menu='')=>`<div class=\"record\"><div><strong>${esc(title)}</strong><small>${meta}</small></div><div style=\"display:flex;align-items:flex-start;gap:10px\">${right?`<strong>${esc(right)}</strong>`:''}${menu}</div></div>`;"
          new="const record=(title,meta,right='',menu='',rightIsHtml=false)=>`<div class=\"record\"><div><strong>${esc(title)}</strong><small>${meta}</small></div><div style=\"display:flex;align-items:flex-start;gap:10px\">${right?(rightIsHtml?right:`<strong>${esc(right)}</strong>`):''}${menu}</div></div>`;"
          if old not in s:
              raise SystemExit('record helper pattern not found')
          s=s.replace(old,new,1)
          old2="return record(a.accreditation_name||'Accreditation',`${esc(a.awarding_body||'Awarding body not recorded')} · Issued ${fmt(a.issue_date)} · Expires ${fmt(a.expiry_date)}${link}`,accreditationBadge(a.expiry_date),actions('accreditation',a.id))"
          new2="return record(a.accreditation_name||'Accreditation',`${esc(a.awarding_body||'Awarding body not recorded')} · Issued ${fmt(a.issue_date)} · Expires ${fmt(a.expiry_date)}${link}`,accreditationBadge(a.expiry_date),actions('accreditation',a.id),true)"
          if old2 not in s:
              raise SystemExit('accreditation row pattern not found')
          s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add learner-profile.html
          git commit -m 'Fix accreditation status badge rendering'
          git push origin HEAD:fullscreen-preview
