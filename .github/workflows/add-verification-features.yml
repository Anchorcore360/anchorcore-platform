name: Add verification features
on:
  push:
    branches: [fullscreen-preview]
    paths:
      - '.github/workflows/add-verification-features.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fullscreen-preview
      - name: Add verification features script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('learner-profile.html')
          s=p.read_text()
          marker='<script src="accreditation-catalog.js"></script>'
          addition=marker+'\n<script src="verification-features.js"></script>'
          if 'verification-features.js' not in s:
              if marker not in s:
                  raise SystemExit('accreditation catalogue marker not found')
              s=s.replace(marker,addition)
              p.write_text(s)
          PY
      - name: Commit update
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add learner-profile.html
          git commit -m 'Enable live accreditation verification on learner profiles'
          git push
