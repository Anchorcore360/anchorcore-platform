const leadingApprovedCode=(name,c)=>{const n=norm(name),k=norm(c);if(!k)return false;if(n===k||n.startsWith(k+' '))return true;const q=approvedCode(k);return /^Q\d+$/.test(q)&&(n===q||n.startsWith(q+' '))};

function allMatrixItems(){return approvedCatalogue.map((entry,index)=>{const candidates=items.filter(i=>approvedMatch(entry,i.name));const cat=accreditationCatalogue.filter(c=>approvedMatch(entry,c.description,c.module_code));const base=candidates.length===1?candidates[0]:null;const name=entry.code&&norm(entry.code)!==norm(entry.title)?entry.code+' — '+entry.title:entry.title;const displayName=entry.code==='NOPS'?'NOPS card':entry.category==='02 NRSWA'?name:entry.category==='03 PIA'?'PIA '+Number(entry.code.slice(1))+' — '+entry.title:entry.code&&entry.category==='04 IPAF'?name:entry.legacy?name+' (Legacy)':name;return {...(base||{}),id:base?.id??'approved:'+entry.stableIndex,name,displayName,category:entry.category,moduleCode:entry.code,catalogId:cat.length===1?cat[0].id:null,approvedEntry:entry,virtual:!base}})}


async function requireAccess(){const{data:{session}}=await db.auth.getSession();if(!session){location.href='portal.html';return false}const{data,error}=await db.rpc('get_current_profile');if(error)throw error;const p=Array.isArray(data)?data[0]:data;if(!p)throw new Error('Your account could not be loaded.');const access=String(p.organisational_access_role||p.portal_access_role||'').toLowerCase();if(!['academy_staff','academy','health_safety','administrator','supervisor','manager','operations_manager'].includes(access)&&p.permission_level!=='super_user')throw new Error('You do not have permission to view the training matrix.');return true}

async function load(){const qs=await Promise.all([db.from('profiles').select('id,full_name,forename,surname,email,employee_number,job_title,organisation,account_status,manager_1_id,manager_2_id,manager_3_id,smart_nops_card_id,smart_nops_url,company_id,organisational_access_role,portal_access_role').eq('account_status','active').order('surname'),db.from('job_roles').select('*').eq('active',true).order('division').order('name'),db.from('profile_job_roles').select('*'),db.from('compliance_items').select('*').eq('active',true).order('category').order('name'),db.from('job_role_requirements').select('*'),db.from('accreditations').select('id,learner_id,person_id,accreditation_name,certificate_number,issue_date,expiry_date,status,accreditation_catalog_id,certificate_url,awarding_body,archived_at,superseded_by,created_at,supporting_documents,primary_selected_at,primary_selected_by').is('archived_at',null),db.from('courses').select('id,course_code,title,category').eq('active',true),db.from('accreditation_catalog').select('id,module_code,description,source').eq('active',true),db.from('people').select('id,profile_id,full_name,forename,surname,employee_number,job_title,status,person_type,default_company_id,smart_awards_card_id,smart_awards_nops_url'),db.from('person_relationships').select('person_id,company_id,relationship_type,manager_profile_id,active').eq('active',true),db.from('external_customers').select('id,company_name,is_rrt_subcontractor,is_internal_rrt'),db.from('person_job_roles').select('person_id,job_role_id,is_primary'),db.from('company_manager_links').select('company_id,manager_profile_id,active').eq('active',true)]);const err=qs.find(x=>x.error)?.error;if(err)throw err;[profiles,roles,profileRoles,items,requirements,accreditations,courseCatalogue,accreditationCatalogue]=qs.map(x=>x.data||[]);const [people,rels,companies,personRolesData,companyManagers]=qs.slice(8).map(x=>x.data||[]);managerDirectory=profiles.slice();const byCompany=new Map(companies.map(c=>[Strin function buildRows(){const engine=window.RRTACompliance({roles,profileRoles,items,requirements,accreditations}),catalogue=allMatrixItems();needs=[];const today=new Date();today.setHours(0,0,0,0);for(const p of profiles){const states=engine.requirementStates(p),seen=new Set(),managers=(p.manager_ids||[p.manager_1_id,p.manager_2_id,p.manager_3_id]).map(id=>managerDirectory.find(x=>x.id===id)?.full_name).filter(Boolean);const push=(item,s,required)=>{const key=norm(item.moduleCode||item.name);if(seen.has(key))return;seen.add(key);if(!['expired','expiring','missing'].includes(s.key))return;const expiry=s.held?.expiry_date||'',days=expiry?Math.round((new Date(expiry+'T00:00:00')-today)/86400000):null;needs.push({p,name:item.name,status:s.key,expiry,days,required,managers})};for(const s of states)push(s.item,s,true);for(const item of catalogue){const s=engine.statusFor(p,item);if(s.held)push(item,s,false)}for(const a of accreditations.filter(a=>(a.learner_id===p.id||(p.person_id&&a.person_id===p.person_id))&&!a.superseded_by)){if(catalogue.some(i=>engine.accreditationRecords(p,i).some(x=>x.id===a.id)))continue;const item={name:a.accreditation_name,catalogId:a.accreditation_catalog_id};const s=engine.statusFor(p,item);if(s.held)push(item,s,false)}}const opts=(id,vals)=>{for(const v of [...new Set(vals.filter(Boolean))].sort()){const o=document.createElement('option');o.value=v;o.textContent=v;el(id).append(o)}};opts('qualification',needs.map(x=>x.name));opts('company',needs.map(x=>x.p.organisation));opts('manager',needs.flatMap(x=>x.managers))}
