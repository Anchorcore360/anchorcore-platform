<!doctype html><html lang="en"><head><script src="compliance-equivalence.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Training Needs | RRTA</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="portal-navigation.css"><style>body{margin:0;background:#f4f6f8}.shell{display:grid;grid-template-columns:258px 1fr;min-height:100vh}.side{background:linear-gradient(180deg,#151a22,#1e2530);padding:16px 12px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}.brand img{width:158px;filter:brightness(0) invert(1)}.brand{padding:5px 10px 16px;border-bottom:1px solid rgba(255,255,255,.08)}.spacer{flex:1}.main{min-width:0}.top{height:66px;background:#fff;border-bottom:1px solid #e2e6ea;display:flex;align-items:center;padding:0 28px;justify-content:space-between}.content{padding:26px 30px 60px}.panel{background:#fff;border:1px solid #e2e6ea;border-radius:14px;overflow:hidden}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid #e8ebef;text-align:left;font-size:11px}.table th{background:#f7f8f9;color:#667085}.pill{padding:5px 8px;border-radius:999px;font-size:9px;font-weight:850}.bad{background:#fdebec;color:#b42318}.good{background:#e8f6ed;color:#176b37}.muted{color:#667085}.head{margin-bottom:18px}.head h1{margin:5px 0}@media(max-width:1000px){.shell{grid-template-columns:1fr}.side{height:auto;position:relative}}</style></head><body data-portal-nav="academy"><div class="shell"><aside class="side"><div class="brand"><img src="rrta-logo.png" alt="RRTA"></div><div class="spacer"></div></aside><main class="main"><header class="top"><strong>RRTA Training Academy Administration</strong><span class="muted">Training Needs</span></header><div class="content"><div class="head"><div class="eyebrow">Workforce Compliance</div><h1>Training Needs</h1><p class="muted">Live view of RRT staff: primary job-role requirements and current accreditation gaps.</p></div><section class="panel"><div style="overflow:auto"><table class="table"><thead><tr><th>Employee</th><th>Job Title</th><th>Manager</th><th>Primary Job Role</th><th>Requirements</th><th>Covered</th><th>Missing / Expired</th><th>Compliance</th><th></th></tr></thead><tbody id="rows"><tr><td colspan="9">Loading…</td></tr></tbody></table></div></section></div></main></div><script src="portal-navigation.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=window.supabase.createClient('https://qgbpotjqggeodxqcwkgj.supabase.co','sb_publishable_J1yPM1Hi7INCX2m7rp3PdA_JdQ46FRS');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const code=x=>(String(x||'').toUpperCase().match(/\b(?:SA\d+[A-Z]?|S\d{3}|O\d+|LA|EFAW|IPAF\s*1B)\b/)||[])[0]?.replace(/\s/g,'')||'';function valid(a){return !a.expiry_date||new Date(a.expiry_date+'T23:59:59')>=new Date()}async function load(){const{data:u}=await db.auth.getUser();if(!u?.user)return location.href='portal.html';const [p,j,r,a]=await Promise.all([db.from('profiles').select('id,full_name,job_title,employee_number,manager_1_id,manager_2_id,manager_3_id').eq('account_status','active').order('full_name'),db.from('profile_job_roles').select('profile_id,job_role_id,is_primary,job_roles(name)'),db.from('job_role_requirements').select('job_role_id,status,compliance_items(name)'),db.from('accreditations').select('learner_id,accreditation_name,expiry_date')]);for(const result of [p,j,r,a])if(result.error)throw result.error;const managerIds=[...new Set((p.data||[]).flatMap(person=>[person.manager_1_id,person.manager_2_id,person.manager_3_id]).filter(Boolean))];const managers=managerIds.length?await db.from('profiles').select('id,full_name').in('id',managerIds):{data:[]};if(managers.error)throw managers.error;const managerNames=new Map((managers.data||[]).map(manager=>[manager.id,manager.full_name]));const people=(p.data||[]).filter(x=>(j.data||[]).some(y=>y.profile_id===x.id));rows.innerHTML=people.map(x=>{const primary=(j.data||[]).find(y=>y.profile_id===x.id&&y.is_primary),roleIds=primary?[primary.job_role_id]:[],req=(r.data||[]).filter(y=>roleIds.includes(y.job_role_id)&&y.status==='required'),acc=(a.data||[]).filter(y=>y.learner_id===x.id);let covered=0;req.forEach(q=>{const c=code(q.compliance_items?.name),m=rrtaCompliancePick(q.compliance_items?.name,acc,z=>(c&&code(z.accreditation_name)===c)||String(z.accreditation_name||'').toLowerCase()===String(q.compliance_items?.name||'').toLowerCase());if(m&&valid(m))covered++});const missing=Math.max(0,req.length-covered),pct=req.length?Math.round(covered/req.length*100):100;return `<tr><td><strong>${esc(x.full_name)}</strong><div class="muted">${esc(x.employee_number||'')}</div></td><td>${esc(x.job_title||'—')}</td><td>${[x.manager_1_id,x.manager_2_id,x.manager_3_id].filter(Boolean).map(id=>esc(managerNames.get(id)||'Manager unavailable')).join('<br>')||'Not assigned'}</td><td>${esc(primary?.job_roles?.name||'Not assigned')}</td><td>${req.length}</td><td>${covered}</td><td>${missing}</td><td><span class="pill ${missing?'bad':'good'}">${primary&&req.length?pct+'%':'Not set'}</span></td><td><a href="learner-profile.html?id=${x.id}">Open Profile</a></td></tr>`}).join('')||'<tr><td colspan="9">No assigned workforce requirements yet.</td></tr>'}load().catch(error=>{rows.innerHTML='<tr><td colspan="9">Unable to load training needs: '+esc(error.message)+'</td></tr>'});</script></body></html>
