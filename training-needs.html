function buildRows(){const engine=window.RRTACompliance({roles,profileRoles,items,requirements,accreditations}),catalogue=allMatrixItems();needs=[];const today=new Date();today.setHours(0,0,0,0);for(const p of profiles){const states=engine.requirementStates(p),seen=new Set(),managers=(p.manager_ids||[p.manager_1_id,p.manager_2_id,p.manager_3_id]).map(id=>managerDirectory.find(x=>x.id===id)?.full_name).filter(Boolean);const push=(item,s,required)=>{const name=needsName(item),key=norm(name);if(seen.has(key))return;seen.add(key);if(!['expired','expiring','missing'].includes(s.key))return;const expiry=s.held?.expiry_date||'',days=expiry?Math.round((new Date(expiry+'T00:00:00')-today)/86400000):null;needs.push({p,name,status:s.key,expiry,days,required,managers})};for(const s of states)push(s.item,s,true);for(const item of catalogue){const s=engine.statusFor(p,item);if(s.held)push(item,s,false)}for(const a of accreditations.filter(a=>(a.learner_id===p.id||(p.person_id&&a.person_id===p.person_id))&&!a.superseded_by)){if(catalogue.some(i=>engine.accreditationRecords(p,i).some(x=>x.id===a.id)))continue;const item={name:a.accreditation_name,catalogId:a.accreditation_catalog_id};const s=engine.statusFor(p,item);if(s.held)push(item,s,false)}}const opts=(id,vals)=>{for(const v of [...new Set(vals.filter(Boolean))].sort()){const o=document.createElement('option');o.value=v;o.textContent=v;el(id).append(o)}};opts('qualification',needs.map(x=>x.name));opts('company',needs.map(x=>x.p.organisation));opts('manager',needs.flatMap(x=>x.managers))}

el('needsRefresh').onclick=()=>location.reload();
el('resetNeeds').onclick=()=>{el('search').value='';for(const id of ['workforce','qualification','status','company','manager'])el(id).value='all';el('window').value='90';el('needsPivotRows').value='detail';el('needsPivotCols').value='status';el('needsPivotValue').value='needs';render()};
function exportRows(){return [['Person','Company','Workforce','Qualification','Expiry','Status','Days remaining','Required','Manager'],...visible.map(x=>[x.p.full_name||'',x.p.organisation||'',x.p.workforce==='rrt'?'RRT employee':'Subcontractor',x.name,x.expiry?x.expiry.split('-').reverse().join('/'):'',({expired:'Expired',expiring:'Expiring',missing:'Required'})[x.status],x.days??'',x.required?'Yes':'No',x.managers.join('; ')])]}
const toggleExport=open=>{el('exportMenu').hidden=!open;el('exportToggle').setAttribute('aria-expanded',String(open))};
el('exportControl').addEventListener('pointerenter',e=>{if(e.pointerType==='mouse')toggleExport(true)});el('exportControl').addEventListener('pointerleave',e=>{if(e.pointerType==='mouse'&&!el('exportMenu').contains(document.activeElement))toggleExport(false)});el('exportToggle').onclick=()=>toggleExport(true);document.addEventListener('click',e=>{if(!el('exportControl').contains(e.target))toggleExport(false)});el('exportControl').addEventListener('keydown',e=>{if(e.key==='Escape'){toggleExport(false);el('exportToggle').focus()}});el('exportControl').addEventListener('focusout',e=>{if(!el('exportControl').contains(e.relatedTarget))toggleExport(false)});
el('exportCsv').onclick=()=>{const csv=v=>'"'+String(v??'').replace(/^[=+@\-\t\r\n]/,"'$&").replace(/"/g,'""')+'"';const lines=(pivotRowsData.length?pivotRowsData:exportRows()).map(row=>row.map(v=>typeof v==='number'?String(v):csv(v)).join(',')).join('\r\n');const url=URL.createObjectURL(new Blob(['\ufeff'+lines],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='RRTA_Training_Needs_'+new Date().toISOString().slice(0,10)+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toggleExport(false)};
el('exportExcel').onclick=()=>{if(typeof XLSX==='undefined'){alert('Excel export unavailable. Please try CSV or refresh the page.');return}const ws=XLSX.utils.aoa_to_sheet(exportRows());ws['!cols']=[{wch:25},{wch:34},{wch:20},{wch:55},{wch:14},{wch:14},{wch:17},{wch:12},{wch:30}];ws['!autofilter']={ref:ws['!ref']};const wb=XLSX.utils.book_new();if(pivotRowsData.length)XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(pivotRowsData),'Pivot summary');XLSX.utils.book_append_sheet(wb,ws,'Training Needs');XLSX.writeFile(wb,'RRTA_Training_Needs_'+new Date().toISOString().slice(0,10)+'.xlsx');toggleExport(false)}
;(async()=>{try{if(await requireAccess())await load()}catch(e){el('note').textContent='Unable to load training needs: '+e.message}})();
</script></body></html>
