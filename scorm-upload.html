<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RRTA · SCORM Upload</title><style>
body{font:15px Inter,Arial,sans-serif;background:#f5f6f8;color:#202832;margin:0}header{background:#151d29;color:white;padding:20px 5vw}main{max-width:760px;margin:32px auto;padding:0 18px}.panel{background:white;border:1px solid #dde2e9;border-radius:12px;padding:24px}label{display:block;font-weight:650;margin:16px 0 7px}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #bbc5d0;border-radius:8px}button{background:#b20f22;color:white;border:0;border-radius:8px;padding:12px 18px;margin-top:20px;cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}.muted{color:#627080;font-size:13px}.status{margin-top:20px;white-space:pre-wrap}a{color:inherit}</style></head>
<body><header><strong>RRTA Academy · SCORM package staging</strong></header><main><p><a href="portal.html">← Return to platform</a></p><section class="panel"><h1>Upload a SCORM package</h1><p class="muted">Academy administrators only. Packages are stored privately for review; uploading does not publish or launch a course.</p><form id="upload"><label for="title">Course title</label><input id="title" maxlength="160" required placeholder="Customer Service & Professional Conduct"><label for="zip">SCORM ZIP (maximum 50 MB)</label><input id="zip" type="file" accept=".zip,application/zip" required><button id="submit" type="submit" disabled>Upload for review</button></form><p class="status" id="status" role="status"></p></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=supabase.createClient('https://qgbpotjqggeodxqcwkgj.supabase.co','sb_publishable_J1yPM1Hi7INCX2m7rp3PdA_JdQ46FRS');
const status=document.getElementById('status'),submit=document.getElementById('submit'),form=document.getElementById('upload');let user;
(async()=>{const r=await db.auth.getUser();user=r.data.user;if(!user){status.textContent='Sign in to the Academy before uploading.';return}const p=await db.rpc('can_manage_academy');if(p.error||p.data!==true){status.textContent='Academy administrator access required.';return}submit.disabled=false;status.textContent='Ready for a private upload.'})();
form.addEventListener('submit',async e=>{e.preventDefault();if(!user||submit.disabled)return;const f=document.getElementById('zip').files[0],title=document.getElementById('title').value.trim();if(!f||!title)return;if(!/\.zip$/i.test(f.name)||f.size>52428800||f.size<4){status.textContent='Choose a ZIP file smaller than 50 MB.';return}submit.disabled=true;status.textContent='Checking package…';try{const header=new Uint8Array(await f.slice(0,4).arrayBuffer());if(header[0]!==80||header[1]!==75||![3,5,7].includes(header[2])||![4,6,8].includes(header[3]))throw Error('File does not appear to be a ZIP archive.');const path=user.id+'/'+crypto.randomUUID()+'.zip';status.textContent='Uploading privately…';const result=await db.storage.from('scorm-packages').upload(path,f,{contentType:'application/zip',upsert:false});if(result.error)throw result.error;status.textContent='Uploaded for Academy review: '+title+'\nPrivate storage path: '+path+'\nNot published. SCORM manifest, contents and launch safety must be validated before activation.';form.reset()}catch(err){status.textContent='Upload failed: '+(err.message||String(err))}finally{submit.disabled=false}});
</script></body></html>
