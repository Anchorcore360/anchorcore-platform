<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RRTA SCORM Player</title><style>html,body{height:100%;margin:0;font-family:Inter,Arial,sans-serif;background:#111820;color:#fff}.bar{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:#171e27;border-bottom:1px solid #2b3541}.bar strong{font-size:14px}.bar span{font-size:10px;color:#aeb8c4}.btn{border:1px solid #394553;background:#222c37;color:#fff;border-radius:8px;padding:9px 12px;font-weight:800;cursor:pointer}.frame{height:calc(100% - 65px)}iframe{width:100%;height:100%;border:0;background:#fff}.error{padding:30px;color:#fff}.saving{color:#ffd77a!important}</style></head><body><div class="bar"><div><strong id="courseTitle">RRTA Online Learning</strong><br><span id="state">Initialising SCORM 1.2 runtime…</span></div><button class="btn" id="exitBtn">Save & Exit</button></div><div class="frame"><iframe id="courseFrame" title="SCORM course"></iframe></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
(async function(){
const sb=supabase.createClient('https://qgbpotjqggeodxqcwkgj.supabase.co','sb_publishable_J1yPM1Hi7INCX2m7rp3PdA_JdQ46FRS');const params=new URLSearchParams(location.search);const assignmentId=params.get('assignment');const state=document.getElementById('state');let assignment,course,user,profile,data={},saveTimer=null,pending=false,sessionStarted=Date.now();
function fail(msg){document.querySelector('.frame').innerHTML='<div class="error"><h2>Unable to launch course</h2><p>'+String(msg)+'</p><button class="btn" onclick="location.href=\'online-learning.html\'">Back to Online Learning</button></div>';state.textContent='Course launch failed'}
const auth=await sb.auth.getUser();user=auth.data.user;if(!user){location.href='login.html';return}if(!assignmentId){fail('No course assignment was supplied.');return}
let res=await sb.from('online_course_assignments').select('*,online_courses(*)').eq('id',assignmentId).maybeSingle();if(res.error||!res.data){fail(res.error?.message||'Assignment not found.');return}assignment=res.data;course=assignment.online_courses;if(assignment.learner_id!==user.id){fail('This course is not assigned to your learner account.');return}
profile=(await sb.from('profiles').select('full_name,email').eq('id',user.id).maybeSingle()).data||{};document.getElementById('courseTitle').textContent=course.title||'RRTA Online Learning';
const runtime=(await sb.from('online_course_runtime_data').select('element,value').eq('assignment_id',assignmentId)).data||[];runtime.forEach(r=>data[r.element]=r.value);data={ 'cmi.core.student_id':user.id,'cmi.core.student_name':profile.full_name||profile.email||user.email,'cmi.core.lesson_status':assignment.lesson_status||data['cmi.core.lesson_status']||'not attempted','cmi.core.lesson_location':assignment.lesson_location||data['cmi.core.lesson_location']||'0','cmi.core.score.raw':assignment.score??data['cmi.core.score.raw']??'','cmi.core.session_time':'0000:00:00','cmi.core.total_time':secondsToScorm(assignment.total_time_seconds||0),'cmi.suspend_data':assignment.suspend_data||data['cmi.suspend_data']||'','cmi.core.exit':'',...data};
await sb.from('online_course_assignments').update({last_launched_at:new Date().toISOString(),started_at:assignment.started_at||new Date().toISOString(),status:assignment.status==='not_started'?'in_progress':assignment.status,updated_at:new Date().toISOString()}).eq('id',assignmentId);
function secondsToScorm(sec){sec=Math.max(0,Math.floor(Number(sec)||0));const h=String(Math.floor(sec/3600)).padStart(4,'0'),m=String(Math.floor((sec%3600)/60)).padStart(2,'0'),s=String(sec%60).padStart(2,'0');return `${h}:${m}:${s}`}
function progress(){const n=Number(data['cmi.core.lesson_location']);return Number.isFinite(n)?Math.max(0,Math.min(100,Math.round(n))):0}
function mappedStatus(){const s=String(data['cmi.core.lesson_status']||'').toLowerCase();if(s==='passed')return'passed';if(s==='completed')return'completed';if(s==='failed')return'failed';if(s==='incomplete'||progress()>0)return'in_progress';return'not_started'}
async function flush(){if(pending)return;pending=true;clearTimeout(saveTimer);state.classList.add('saving');state.textContent='Saving progress…';const elapsed=Math.floor((Date.now()-sessionStarted)/1000);const total=(assignment.total_time_seconds||0)+elapsed;data['cmi.core.session_time']=secondsToScorm(elapsed);data['cmi.core.total_time']=secondsToScorm(total);const rows=Object.entries(data).filter(([k])=>k.startsWith('cmi.')).map(([element,value])=>({assignment_id:assignmentId,element,value:String(value??''),updated_at:new Date().toISOString()}));const rt=await sb.from('online_course_runtime_data').upsert(rows,{onConflict:'assignment_id,element'});const status=mappedStatus();const score=data['cmi.core.score.raw']===''?null:Number(data['cmi.core.score.raw']);const completed=['passed','completed'].includes(status);const upd=await sb.from('online_course_assignments').update({status,progress:progress(),score:Number.isFinite(score)?score:null,lesson_status:data['cmi.core.lesson_status']||null,lesson_location:data['cmi.core.lesson_location']||null,suspend_data:data['cmi.suspend_data']||null,total_time_seconds:total,completed_at:completed?(assignment.completed_at||new Date().toISOString()):null,updated_at:new Date().toISOString()}).eq('id',assignmentId);if(!rt.error&&!upd.error){assignment.total_time_seconds=total;sessionStarted=Date.now();state.textContent='Progress saved · '+new Date().toLocaleTimeString();state.classList.remove('saving')}else{state.textContent='Save issue — progress remains open';console.error(rt.error||upd.error)}pending=false}
function queue(){clearTimeout(saveTimer);saveTimer=setTimeout(flush,350)}
window.API={LMSInitialize(){state.textContent='SCORM 1.2 connected';data._initialised='true';return'true'},LMSFinish(){flush();return'true'},LMSGetValue(k){return String(data[k]??'')},LMSSetValue(k,v){data[k]=String(v);queue();return'true'},LMSCommit(){flush();return'true'},LMSGetLastError(){return'0'},LMSGetErrorString(){return'No error'},LMSGetDiagnostic(){return'No diagnostic information'}};
document.getElementById('exitBtn').onclick=async()=>{await flush();location.href='online-learning.html'};document.addEventListener('visibilitychange',()=>{if(document.hidden)flush()});window.addEventListener('pagehide',()=>flush());document.getElementById('courseFrame').src=course.launch_url;state.textContent='SCORM 1.2 connected · loading course…';
})();
</script></body></html>
