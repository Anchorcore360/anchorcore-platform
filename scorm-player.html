<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RRTA SCORM Player</title><style>html,body{height:100%;margin:0;font-family:Inter,Arial,sans-serif;background:#111820;color:#fff}.bar{height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:#171e27;border-bottom:1px solid #2b3541}.bar strong{font-size:14px}.bar span{font-size:10px;color:#aeb8c4}.btn{border:1px solid #394553;background:#222c37;color:#fff;border-radius:8px;padding:9px 12px;font-weight:800;cursor:pointer}.frame{height:calc(100% - 63px)}iframe{width:100%;height:100%;border:0;background:#fff}</style></head><body><div class="bar"><div><strong>RRTA Online Learning</strong><br><span id="state">Initialising SCORM 1.2 runtime…</span></div><button class="btn" onclick="location.href='online-learning.html'">Save & Exit</button></div><div class="frame"><iframe id="courseFrame" title="SCORM course"></iframe></div><script>(function(){const params=new URLSearchParams(location.search);const course=params.get('course')||'rrta-scorm-test';const KEY='rrta_scorm_12_'+course;let data={};try{data=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}const defaults={'cmi.core.lesson_status':'not attempted','cmi.core.lesson_location':'0','cmi.core.score.raw':'','cmi.core.session_time':'0000:00:00','cmi.core.total_time':'0000:00:00','cmi.suspend_data':'','cmi.core.exit':''};data={...defaults,...data};function save(){data._savedAt=new Date().toISOString();localStorage.setItem(KEY,JSON.stringify(data));document.getElementById('state').textContent='Progress saved · '+new Date().toLocaleTimeString()}window.API={LMSInitialize:function(){data._initialized=true;save();return 'true'},LMSFinish:function(){data._finished=true;save();return 'true'},LMSGetValue:function(k){return data[k]??''},LMSSetValue:function(k,v){data[k]=String(v);if(k==='cmi.core.lesson_location'){const n=Number(v);if(Number.isFinite(n))data._progress=Math.max(Number(data._progress||0),Math.min(100,n))}save();return 'true'},LMSCommit:function(){save();return 'true'},LMSGetLastError:function(){return '0'},LMSGetErrorString:function(){return 'No error'},LMSGetDiagnostic:function(){return 'No diagnostic information'}};window.addEventListener('beforeunload',save);document.getElementById('courseFrame').src='scorm-test-course/index.html';})();</script></body></html>
