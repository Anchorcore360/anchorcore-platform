<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quotes | RRTA</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="portal-navigation.css"><style>body{margin:0;background:#f4f6f8}.top{height:66px;background:#fff;border-bottom:1px solid #d9dee5;display:flex;align-items:center;justify-content:space-between;padding:0 28px}.content{max-width:1450px;margin:auto;padding:28px}.panel{background:#fff;border:1px solid #dce1e7;border-radius:14px;padding:18px;margin:16px 0}.quoteform{background:#fff9e9;border-color:#eedda8}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.grid label{font-size:12px;font-weight:800}.grid input,.grid textarea,.grid select{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ccd3dc;border-radius:8px;background:#fff}.full{grid-column:1/-1}.item{display:grid;grid-template-columns:1.6fr 100px 130px auto;gap:8px;margin:8px 0}.row{display:grid;grid-template-columns:1.5fr 1fr 120px 120px auto;gap:12px;align-items:center;padding:12px;border-top:1px solid #edf0f3}.pill{display:inline-flex;padding:5px 9px;border-radius:999px;background:#fff0bf;color:#765500;font-size:11px;font-weight:800}.muted{color:#667085}@media(max-width:800px){.grid,.item,.row{grid-template-columns:1fr}}</style></head><body data-portal-nav="academy"><header class="top"><strong>RRTA Training Academy Administration</strong><span class="muted">Finance · Quotes</span></header><main class="content"><div class="eyebrow">Finance</div><h1>Enquiries & Quotes</h1><p class="muted">Create a proposed quote before a customer commits to a booking. Accepted quotes can later be converted into the booking workflow.</p><button class="btn dark" id="newQuote">+ Build Quote</button><section id="builder" class="panel quoteform" hidden><h2>Build Customer Quote</h2><form id="quoteForm"><div class="grid"><label>Company<input id="company" required></label><label>Contact name<input id="contactName"></label><label>Contact email<input id="contactEmail" type="email"></label><label>Contact phone<input id="contactPhone"></label><label>Proposed dates<input id="proposedDates" placeholder="Optional / to be agreed"></label><label>Valid until<input id="validUntil" type="date"></label><label class="full">Billing address<textarea id="billingAddress"></textarea></label></div><h3>Courses / Services</h3><div id="items"></div><button type="button" class="btn secondary" id="addItem">+ Add course</button><div class="grid" style="margin-top:14px"><label>Discount (£)<input id="discount" type="number" min="0" step="0.01" value="0"></label><label>VAT %<input id="vatRate" type="number" min="0" step="0.01" value="20"></label><label class="full">Notes<textarea id="notes"></textarea></label></div><div style="display:flex;gap:8px;margin-top:14px"><button class="btn dark" type="submit">Save Draft Quote</button><button class="btn secondary" type="button" id="cancel">Cancel</button></div></form></section><section class="panel"><h2>Quote Register</h2><div id="root" class="muted">Loading quotes…</div></section></main><script src="portal-navigation.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=window.supabase.createClient('https://qgbpotjqggeodxqcwkgj.supabase.co','sb_publishable_J1yPM1Hi7INCX2m7rp3PdA_JdQ46FRS');let courses=[];const esc=(v='')=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c])),gbp=n=>'£'+Number(n||0).toFixed(2);function addItem(){const d=document.createElement('div');d.className='item';d.innerHTML=`<select class="course"><option value="">Select course / custom item</option>${courses.map(c=>`<option value="${c.id}" data-price="${c.standard_external_price||0}">${esc((c.course_code||'')+' '+c.title)}</option>`).join('')}</select><input class="qty" type="number" min="1" value="1" aria-label="Delegates"><input class="price" type="number" min="0" step="0.01" placeholder="Unit price" aria-label="Unit price"><button type="button" class="btn secondary remove">Remove</button>`;d.querySelector('.course').onchange=e=>{const o=e.target.selectedOptions[0];d.querySelector('.price').value=o?.dataset.price||''};d.querySelector('.remove').onclick=()=>d.remove();items.appendChild(d)}async function load(){const [c,q]=await Promise.all([db.from('courses').select('id,course_code,title,standard_external_price').eq('active',true).order('title'),db.from('finance_quotes').select('*').order('created_at',{ascending:false})]);courses=c.data||[];const rows=q.data||[];root.innerHTML=rows.length?rows.map(x=>`<div class="row"><div><strong>${esc(x.quote_number||'Draft quote')}</strong><div class="muted">${esc(x.company_name)} · ${esc(x.contact_name||x.contact_email||'No contact')}</div></div><span>${esc(x.proposed_dates||'Dates TBC')}</span><span class="pill">${esc(x.status)}</span><strong>${gbp(Number(x.subtotal||0)-Number(x.discount||0))}</strong><span>${x.booking_id?'Booking created':'Enquiry'}</span></div>`).join(''):'<div class="muted">No enquiry quotes yet.</div>'}newQuote.onclick=()=>{builder.hidden=false;if(!items.children.length)addItem();builder.scrollIntoView({behavior:'smooth',block:'start'})};addItem.onclick=()=>addItem();cancel.onclick=()=>builder.hidden=true;quoteForm.onsubmit=async e=>{e.preventDefault();const itemRows=[...items.querySelectorAll('.item')].map((r,i)=>{const s=r.querySelector('.course'),o=s.selectedOptions[0];return{course_id:s.value?Number(s.value):null,description:o&&s.value?o.textContent.trim():'Custom training/service',delegate_count:Number(r.querySelector('.qty').value||1),unit_price:Number(r.querySelector('.price').value||0),sort_order:i}});if(!itemRows.length)return alert('Add at least one course or service.');const subtotal=itemRows.reduce((s,x)=>s+x.delegate_count*x.unit_price,0);const ref='RRTA-Q-'+new Date().getFullYear()+'-'+String(Date.now()).slice(-6);const{data:q,error}=await db.from('finance_quotes').insert({quote_number:ref,company_name:company.value.trim(),contact_name:contactName.value.trim()||null,contact_email:contactEmail.value.trim()||null,contact_phone:contactPhone.value.trim()||null,billing_address:billingAddress.value.trim()||null,proposed_dates:proposedDates.value.trim()||null,valid_until:validUntil.value||null,subtotal,discount:Number(discount.value||0),vat_rate:Number(vatRate.value||20),notes:notes.value.trim()||null}).select('id').single();if(error)return alert(error.message);const{error:ie}=await db.from('finance_quote_items').insert(itemRows.map(x=>({...x,quote_id:q.id})));if(ie)return alert(ie.message);quoteForm.reset();items.innerHTML='';builder.hidden=true;await load()};load();</script></body></html>
