<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RRTA | Staged courses</title><style>body{margin:0;background:#f4f6f8;color:#18202a;font:15px Arial,sans-serif}header{background:#18202a;color:white;padding:20px 5vw}main{max-width:1000px;margin:28px auto;padding:0 18px}a{color:#a40f24}.card{background:white;border:1px solid #dde2e8;border-radius:12px;padding:20px;margin:16px 0}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}button{background:#b20f22;color:white;border:0;border-radius:8px;padding:10px 14px;cursor:pointer}button:disabled{opacity:.5;cursor:default}.muted{color:#657180;font-size:13px}.badge{background:#fff1d6;color:#805900;border-radius:20px;padding:5px 9px;font-size:11px}#status{white-space:pre-wrap}</style></head><body><header>RRTA Academy · Private SCORM review</header><main><a href="academy-online-learning.html?view=library">← Course Library</a><h1>Staged SCORM packages</h1><p class="muted">Academy-only review. Extracted packages are not published, and no learning results or certificates are issued here.</p><p id="status" role="status">Checking access…</p><div id="list"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=supabase.createClient('https://qgbpotjqggeodxqcwkgj.supabase.co','sb_publishable_J1yPM1Hi7INCX2m7rp3PdA_JdQ46FRS');
const statusEl=document.getElementById('status'),list=document.getElementById('list');const uuid=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
function node(tag,txt,cls){const e=document.createElement(tag);e.textContent=txt;if(cls)e.className=cls;return e}
async function start(){const {data:{user},error}=await db.auth.getUser();if(error||!user)throw Error('Sign in to the Academy first.');const p=await db.rpc('can_manage_academy');if(p.error||p.data!==true)throw Error('Academy access required.');const bucket=db.storage.from('scorm-extracted-staging');const folders=await bucket.list(user.id,{limit:100});if(folders.error)throw folders.error;statusEl.textContent='';for(const folder of folders.data.filter(x=>uuid.test(x.name)&&!x.id)){const base=user.id+'/'+folder.name;const manifest=await bucket.download(base+'/imsmanifest.xml');if(manifest.error||!manifest.data)continue;const xml=await manifest.data.text();if(/<!DOCTYPE|<!ENTITY/i.test(xml))continue;const doc=new DOMParser().parseFromString(xml,'application/xml');if(doc.querySelector('parsererror'))continue;const tags=[...doc.getElementsByTagName('*')];const title=tags.find(t=>t.localName==='organization')?.children;const name=[...(title||[])].find(t=>t.localName==='title')?.textContent||'SCORM package';const resource=tags.find(t=>t.localName==='resource'&&[...t.attributes].some(a=>a.localName.toLowerCase()==='scormtype'&&a.value.toLowerCase()==='sco'));const launch=resource?.getAttribute('href')||'Not found';const card=node('section','','card'),row=node('div','','row');row.append(node('span','PRIVATE STAGING','badge'));card.append(row,node('h2',name),node('p','Launch resource: '+launch,'muted'),node('p','Package reference: '+folder.name,'muted'));const btn=node('button','Download original ZIP');btn.onclick=async()=>{btn.disabled=true;try{const r=await db.storage.from('scorm-packages').download(base+'.zip');if(r.error)throw r.error;const url=URL.createObjectURL(r.data),a=document.createElement('a');a.href=url;a.download='RRTA-SCORM-'+folder.name+'.zip';a.click();setTimeout(()=>URL.revokeObjectURL(url),30000)}catch(e){statusEl.textContent=e.message||String(e)}finally{btn.disabled=false}};const preview=node('button','Preview course');preview.style.marginLeft='10px';preview.onclick=()=>{location.href='scorm-preview.html?package='+encodeURIComponent(folder.name)};card.append(btn,preview,node('p','Private multimedia preview only. Publishing and official certification remain disabled.','muted'));list.append(card)}if(!list.children.length)statusEl.textContent='No staged packages found for your account.'}
start().catch(e=>{statusEl.textContent=e.message||String(e)});
</script></body></html>
