<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Learning | RRTA</title><link rel="stylesheet" href="styles.css"><style>body{background:#f3f5f6}.shell{max-width:1180px;margin:0 auto;padding:28px 24px 60px}.head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:20px}.panel{background:#fff;border:1px solid #d9dee5;border-radius:14px;padding:24px}.learning-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-top:18px}.learning-card{border:1px solid #d9dee5;border-radius:12px;padding:20px;background:#fafbfc}.meta{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.meta span{font-size:12px;background:#eef1f3;padding:6px 9px;border-radius:999px}.empty{padding:38px;text-align:center;border:1px dashed #cfd5dd;border-radius:12px;color:#667085}.hidden{display:none!important}</style></head><body><header class="site-header"><div class="header-inner"><img src="rrta-logo.png" class="brand-logo" alt="Rapid Response Training Academy"><div id="userName" class="header-user"></div></div></header><main class="shell"><div class="head"><div><div class="eyebrow">Learner Portal</div><h1>My Learning</h1><p class="muted">View your assigned RRTA learning and complete assessments.</p></div><button id="logoutBtn" class="btn secondary">Sign Out</button></div><section class="panel"><div id="content"><p class="muted">Loading your learning…</p></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=window.supabase.createClient('https://qgbpotjqggeodxqcwkgj.supabase.co','sb_publishable_J1yPM1Hi7INCX2m7rp3PdA_JdQ46FRS');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const fmt=d=>d?new Date(d).toLocaleDateString('en-GB'):'—';async function load(){const{data:u}=await db.auth.getUser();if(!u?.user){location.href='learner.html';return}const{data:p,error:pe}=await db.from('profiles').select('id,full_name,role,email').eq('id',u.user.id).single();if(pe||!p||String(p.role).toLowerCase()!=='learner'){await db.auth.signOut();location.href='learner.html';return}document.getElementById('userName').textContent=`${p.full_name||'Learner'} · Learner`;const{data:a,error}=await db.from('assignments').select('id,course_id,assigned_at,due_date,status,completed_at,courses(id,course_code,title,description,pass_mark,question_count,category)').eq('learner_id',p.id).order('assigned_at',{ascending:false});if(error)throw error;const{data:r}=await db.from('assessment_attempts').select('course_id,score,passed,completed_at').eq('learner_id',p.id).order('completed_at',{ascending:false});const attempts=r||[];const rows=a||[];if(!rows.length){document.getElementById('content').innerHTML='<div class="empty"><strong>No Learning Assigned</strong><br>Your assigned courses will appear here.</div>';return}document.getElementById('content').innerHTML=`<div class="learning-grid">${rows.map(x=>{const c=x.courses||{};const latest=attempts.find(t=>t.course_id===x.course_id);const label=latest?(latest.passed?`Passed · ${latest.score}/${c.question_count||20}`:`Refer · ${latest.score}/${c.question_count||20}`):String(x.status||'assigned').replace('_',' ');const canLaunch=c.course_code==='RRTA-CS001';return `<article class="learning-card"><div class="eyebrow">${esc(c.course_code||'RRTA Course')}</div><h2>${esc(c.title||'Assigned Course')}</h2><p class="muted">${esc(c.description||'')}</p><div class="meta"><span>Assigned ${fmt(x.assigned_at)}</span>${x.due_date?`<span>Due ${fmt(x.due_date)}</span>`:''}<span>${esc(label)}</span></div>${latest?`<p><strong>Latest Result:</strong> ${latest.score}/${c.question_count||20} · ${latest.passed?'PASS':'REFER'}</p>`:''}${canLaunch?`<a class="btn primary" style="display:inline-block;text-decoration:none" href="customer-service-assessment.html">${latest?.passed?'View / Retake Assessment':'Start Assessment'}</a>`:'<span class="status live">Assigned</span>'}</article>`}).join('')}</div>`}document.getElementById('logoutBtn').onclick=async()=>{await db.auth.signOut();location.href='learner.html'};load().catch(e=>{document.getElementById('content').innerHTML=`<div class="error">${esc(e.message||'Unable to load your learning.')}</div>`});</script></body></html>
