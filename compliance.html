<style>
.side-link{display:flex;align-items:center;gap:11px;text-decoration:none}.side-icon{width:19px;height:19px;flex:0 0 19px;display:inline-flex;align-items:center;justify-content:center}.side-icon svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.sidebar-section-label{padding:18px 18px 7px;color:#9ca3aa;font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.compliance-tools{display:grid;grid-template-columns:1fr 1fr auto auto;gap:10px;align-items:end}.compliance-tools label{display:grid;gap:6px;font-size:12px;font-weight:750;color:#475467}.compliance-tools select,.compliance-tools input{padding:11px 12px;border:1px solid #cfd6db;border-radius:8px;background:#fff}.matrix-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0}.mini-stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px}.mini-stat span{display:block;color:var(--muted);font-size:12px}.mini-stat strong{display:block;font-size:24px;margin-top:4px}.category-block{margin-top:16px}.category-title{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;background:#f5f6f7;border:1px solid var(--line);border-radius:8px 8px 0 0}.req-row{display:grid;grid-template-columns:minmax(0,1.8fr) 130px 120px minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 12px;border:1px solid var(--line);border-top:0;background:#fff}.req-name{min-width:0}.req-name strong{display:block;overflow-wrap:anywhere}.req-name small{display:block;color:var(--muted);margin-top:3px}.badge{display:inline-flex;border-radius:999px;padding:5px 8px;font-size:11px;font-weight:800}.badge.required{background:#e8f6ed;color:#176b37}.badge.conditional{background:#fff6d8;color:#8a6100}.inline-form{margin-top:16px;padding:16px;border:1px dashed #cbd3da;border-radius:10px;background:#fafbfc}.inline-grid{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:10px}.inline-grid label{display:grid;gap:6px;font-size:12px;font-weight:750}.inline-grid input,.inline-grid select{padding:10px 11px;border:1px solid #cfd6db;border-radius:8px;background:#fff}.notice{padding:11px 13px;border-radius:8px;background:#f5f7f9;color:#475467;margin:12px 0}.empty-state{padding:36px;text-align:center;color:#667085;border:1px dashed #cfd6db;border-radius:10px;background:#fafbfc}@media(max-width:950px){.compliance-tools{grid-template-columns:1fr 1fr}.req-row{grid-template-columns:1fr 100px}.req-row>*:nth-child(3),.req-row>*:nth-child(4){grid-column:1/-1}.inline-grid{grid-template-columns:1fr}.matrix-summary{grid-template-columns:1fr 1fr 1fr}}@media(max-width:650px){.compliance-tools,.matrix-summary{grid-template-columns:1fr}.req-row{grid-template-columns:1fr}}
.role-grid{overflow:auto;max-height:70vh;border:1px solid #d5dbe1}.role-grid table{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;font-size:12px}.role-grid th,.role-grid td{border-bottom:1px solid #d5dbe1;border-right:1px solid #d5dbe1;padding:0;text-align:center}.role-grid thead th{position:sticky;top:0;background:#e8edf2;z-index:3;width:130px;min-width:130px;padding:8px;white-space:normal}.role-grid tr>:first-child{position:sticky;left:0;background:#f6f8fa;z-index:2;text-align:left;min-width:210px;padding:10px}.role-grid thead tr>:first-child{z-index:4}.role-grid button{width:100%;min-height:38px;border:0;background:white;cursor:pointer}.role-grid button.required{background:#d8f1df;color:#176b37;font-weight:800}.role-grid button.review{background:#fff0bf;color:#795500}.role-grid button.pending{outline:2px solid #417ab5;outline-offset:-2px}#roleMatrixPanel:fullscreen{background:white;padding:20px;overflow:auto}#roleMatrixPanel:fullscreen .role-grid{max-height:82vh}</style>

<body data-portal-nav="academy" data-rrta-ui="standard" data-compliance-ui="grey">
<header class="site-header"><div class="header-inner"><img src="rrta-logo.png" class="brand-logo" alt="Rapid Response Training Academy"><div id="headerUser" class="header-user"></div></div></header>
<main><div class="portal-shell"><aside class="sidebar" data-portal-nav></aside><section class="portal-content">
<div class="page-head"><div><div class="eyebrow">Compliance</div><h1>Job Role Matrix</h1><p>Manage mandatory training requirements across all job roles.</p></div></div>
<div class="matrix-summary"><div class="mini-stat"><span>Job roles</span><strong id="statRoles">—</strong></div><div class="mini-stat"><span>Compliance items</span><strong id="statItems">—</strong></div><div class="mini-stat"><span>Role requirements</span><strong id="statReqs">—</strong></div></div>
<article class="panel" id="roleMatrixPanel"><div class="compliance-tools"><label>Division<select id="divisionSelect"></select></label><label>Search roles or qualifications<input id="roleSearch" placeholder="Search"></label><button class="btn secondary" id="newRoleBtn">+ Job role</button><button class="btn secondary" id="newItemBtn">+ Qualification</button></div><div style="display:flex;gap:10px;align-items:center;margin:12px 0;flex-wrap:wrap"><button class="btn dark" id="saveMatrix">Save changes</button><button class="btn secondary" id="discardMatrix">Discard changes</button><button class="btn secondary" id="fullMatrix">Full screen</button><button class="btn secondary" id="exportMatrix">Export CSV (Excel)</button><span id="pendingCount"></span></div><p class="muted">Green = required; blank = not required. Amber = existing requirement needing review. Click a cell to change it, then save.</p><div id="requirements" class="role-grid"></div></article><div id="message" class="notice hidden"></div>
</section></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const db=window.supabase.createClient('https://qgbpotjqggeodxqcwkgj.supabase.co','sb_publishable_J1yPM1Hi7INCX2m7rp3PdA_JdQ46FRS');
const esc=(v='')=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
let roles=[],items=[],requirements=[];
function tell(msg,bad=false){const el=document.getElementById('message');el.textContent=msg;el.style.color=bad?'#b20d1c':'#176b37';el.classList.remove('hidden');setTimeout(()=>el.classList.add('hidden'),3500)}
async function requireAcademyAccess(){const {data:{session}}=await db.auth.getSession();if(!session){location.href='portal.html';return false}const {data,error}=await db.rpc('get_current_profile');if(error)throw error;const p=Array.isArray(data)?data[0]:data;const access=String(p?.organisational_access_role||p?.portal_access_role||'').toLowerCase();if(!p||(!['academy_staff','academy','health_safety','operations_manager','administrator'].includes(access)&&p.permission_level!=='super_user')){throw new Error('Academy access required.')}document.getElementById('headerUser').textContent=`${p.full_name||'Trainer'} · Trainer`;return true}
async function loadAll(){const [r,i,q]=await Promise.all([db.from('job_roles').select('*').eq('active',true).order('division').order('name'),db.from('compliance_items').select('*').eq('active',true).order('category').order('name'),db.from('job_role_requirements').select('*')]);if(r.error)throw r.error;if(i.error)throw i.error;if(q.error)throw q.error;roles=r.data||[];items=i.data||[];requirements=q.data||[];document.getElementById('statRoles').textContent=roles.length;document.getElementById('statItems').textContent=items.length;document.getElementById('statReqs').textContent=requirements.length;renderDivision()}
const pending=new Map();const key=(r,i)=>r+':'+i;function existing(r,i){return requirements.find(x=>String(x.job_role_id)===String(r)&&String(x.compliance_item_id)===String(i))}function state(r,i){const k=key(r,i);return pending.has(k)?pending.get(k):(existing(r,i)?.status||'none')}function renderDivision(){const d=document.getElementById('divisionSelect'),current=d.value;d.innerHTML='<option value="all">All divisions</option>'+[...new Set(roles.map(x=>x.division))].map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');if([...d.options].some(x=>x.value===current))d.value=current;renderRoles()}function renderRoles(){const d=document.getElementById('divisionSelect').value,q=document.getElementById('roleSearch').value.toLowerCase().trim();let rr=roles.filter(r=>d==='all'||r.division===d);let ii=items; if(q){const matched=rr.filter(r=>(r.name+' '+r.division).toLowerCase().includes(q));if(matched.length)rr=matched;else ii=ii.filter(i=>(i.name+' '+i.category).toLowerCase().includes(q))}document.getElementById('requirements').innerHTML='<table><thead><tr><th>Job role</th>'+ii.map(i=>`<th title="${esc(i.category)}">${esc(i.name)}</th>`).join('')+'</tr></thead><tbody>'+rr.map(r=>`<tr><th>${esc(r.name)}<br><small>${esc(r.division)}</small></th>`+ii.map(i=>{const st=state(r.id,i.id);return `<td><button data-r="${r.id}" data-i="${i.id}" class="${st==='required'?'required':st==='none'?'':'review'} ${pending.has(key(r.id,i.id))?'pending':''}" aria-label="${esc(r.name+' '+i.name+' '+st)}">${st==='required'?'✓':st==='none'?'':'Review'}</button></td>`}).join('')+'</tr>').join('')+'</tbody></table>';document.getElementById('pendingCount').textContent=pending.size+' unsaved changes';document.getElementById('saveMatrix').disabled=!pending.size;document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{const r=b.dataset.r,i=b.dataset.i,k=key(r,i),next=state(r,i)==='required'?'none':'required';if(next===(existing(r,i)?.status||'none'))pending.delete(k);else pending.set(k,next);renderRoles()})}document.getElementById('divisionSelect').onchange=renderRoles;document.getElementById('roleSearch').oninput=renderRoles;document.getElementById('discardMatrix').onclick=()=>{pending.clear();renderRoles()};document.getElementById('fullMatrix').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.getElementById('roleMatrixPanel').requestFullscreen();document.getElementById('saveMatrix').onclick=async()=>{if(!confirm('Save changes to job role requirements?'))return;const btn=document.getElementById('saveMatrix');btn.disabled=true;try{for(const [k,st] of [...pending]){const [r,i]=k.split(':').map(Number);const old=existing(r,i);const result=st==='none'?await db.from('job_role_requirements').delete().eq('job_role_id',r).eq('compliance_item_id',i):await db.from('job_role_requirements').upsert({job_role_id:r,compliance_item_id:i,status:'required',notes:old?.notes||null},{onConflict:'job_role_id,compliance_item_id'});if(result.error)throw result.error;pending.delete(k)}await loadAll();tell('Requirements saved.')}catch(e){await loadAll();tell('Some changes may have saved. '+e.message,true)}};document.getElementById('exportMatrix').onclick=()=>{const quote=x=>'"'+String(x??'').replaceAll('"','""')+'"';const csv=[['Division','Job role',...items.map(i=>i.name)],...roles.map(r=>[r.division,r.name,...items.map(i=>state(r.id,i.id)==='required'?'Required':state(r.id,i.id)==='none'?'':'Review')])].map(row=>row.map(quote).join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'}));a.download='job-role-matrix.csv';a.click();URL.revokeObjectURL(a.href)};window.addEventListener('beforeunload',e=>{if(pending.size){e.preventDefault();e.returnValue=''}});document.getElementById('newRoleBtn').onclick=async()=>{const division=prompt('Division (for example Civils or Telecoms):',document.getElementById('divisionSelect').value==='all'?'Telecoms':document.getElementById('divisionSelect').value);if(!division)return;const name=prompt('Job role name:');if(!name)return;const {error}=await db.from('job_roles').insert({division:division.trim(),name:name.trim(),active:true});if(error)return tell(error.message,true);await loadAll();document.getElementById('divisionSelect').value=division.trim();renderRoles();tell('Job role added.')};
document.getElementById('newItemBtn').onclick=async()=>{const name=prompt('Compliance item / course name:');if(!name)return;const category=prompt('Category:', 'Courses');if(!category)return;const years=prompt('Default validity in years (leave blank if none):','3');const n=years?Number(years):null;const {error}=await db.from('compliance_items').insert({name:name.trim(),category:category.trim(),default_validity_years:Number.isFinite(n)?n:null,active:true});if(error)return tell(error.message,true);await loadAll();tell('Compliance item added.')};
(async()=>{try{if(await requireAcademyAccess())await loadAll()}catch(e){document.querySelector('.portal-content').innerHTML=`<div class="error">${esc(e.message||'Unable to load compliance area.')}</div>`}})();
</script>
