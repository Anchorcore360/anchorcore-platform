<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Confirmed Bookings | RRTA</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="portal-navigation.css"><link rel="stylesheet" href="rrta-uniform-ui.css?v=20260918-1"><style>:root{--red:#b20f22;--ink:#18202a;--muted:#667085;--line:#d9dee5}*{box-sizing:border-box}body{margin:0;background:#f3f5f6;color:var(--ink);font-family:Inter,Arial,sans-serif}.shell{display:grid;grid-template-columns:258px minmax(0,1fr);min-height:100vh}.side{background:#171d25;min-height:100vh}.main{padding:30px 34px 60px;min-width:0}.head,.toolbar,.calhead{display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap}.head-actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.panel,.stat{background:#fff;border:1px solid var(--line);border-radius:12px}.panel{padding:18px;margin-bottom:18px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:18px 0}.stat{padding:16px}.stat span{display:block;color:var(--muted);font-size:12px}.stat strong{font-size:24px}.muted{color:var(--muted)}.viewtabs{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#fff}.viewtabs button{border:0;background:#fff;padding:10px 14px;font-weight:800;cursor:pointer}.viewtabs button.active{background:#252b31;color:#fff}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:12px 10px;border-bottom:1px solid #e6e9ed;text-align:left;font-size:13px;vertical-align:top}.table th{font-size:11px;color:var(--muted);text-transform:uppercase}.badge{display:inline-flex;padding:5px 8px;border-radius:999px;font-size:11px;font-weight:800;background:#eef1f4}.badge.confirmed,.badge.completed{background:#e7f6ec;color:#176b37}.badge.provisional,.badge.open{background:#fff4cc;color:#7a5700}.badge.induction{background:#fdecef;color:#9f1020}.actions{display:flex;gap:6px;flex-wrap:wrap}.small{border:1px solid #cfd5dd;background:#fff;border-radius:7px;padding:7px 9px;font-weight:750;cursor:pointer;text-decoration:none;color:var(--ink)}.dark{background:#252b31;color:#fff;border-color:#252b31}.drawer{display:none;margin-top:12px;padding:14px;border:1px solid var(--line);border-radius:10px;background:#fafbfc}.drawer.open{display:block}.delegate-grid{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px;align-items:end}.delegate-grid input,.delegate-grid select{width:100%;padding:9px 10px;border:1px solid #cfd5dd;border-radius:8px;background:#fff}.delegate-list{margin-top:12px;display:grid;gap:7px}.delegate{display:flex;justify-content:space-between;gap:10px;padding:9px 10px;background:#fff;border:1px solid #e1e5e9;border-radius:8px}.notice{padding:12px;border:1px dashed #cfd5dd;border-radius:9px;background:#fafbfc;color:var(--muted)}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;margin-top:14px}.dow{padding:9px;background:#f5f6f7;font-size:10px;font-weight:900;text-align:center;color:#667085}.day{min-height:125px;padding:8px;border-top:1px solid var(--line);border-right:1px solid var(--line);min-width:0}.day:nth-child(7n){border-right:0}.day.other{background:#fafafa;color:#98a2b3}.daynum{font-size:11px;font-weight:850;margin-bottom:6px}.event{display:block;width:100%;text-align:left;border:0;border-radius:6px;padding:6px 7px;margin:4px 0;font-size:9px;line-height:1.25;cursor:pointer;background:#eef1f4;color:#344054}.event.induction{background:#fdecef;color:#8f1422}.event.confirmed{box-shadow:inset 3px 0 #176b37}.event.provisional,.event.open{box-shadow:inset 3px 0 #c58b00}.calnav{display:flex;gap:7px;align-items:center}.hidden{display:none!important}@media(max-width:1000px){.shell{grid-template-columns:1fr}.main{padding:22px}.stats{grid-template-columns:repeat(2,1fr)}.delegate-grid{grid-template-columns:1fr 1fr}.calendar{overflow:auto;grid-template-columns:repeat(7,minmax(120px,1fr))}}@media(max-width:650px){.stats,.delegate-grid{grid-template-columns:1fr}} .rrta-modern-bookings{min-height:70px}.rrta-modern-bookings:not(.rrta-modern-ready){visibility:hidden}</style></head><body data-portal-nav="academy"><div class="shell"><aside class="side"><div class="brand"></div><div class="spacer"></div></aside><main class="main"><div class="head"><div><div class="eyebrow">Bookings management</div><h1>Confirmed Bookings</h1><p class="muted">Confirmed course bookings and learner records.</p></div><div class="head-actions"><a class="small" href="training-schedule.html">Training Schedule</a></div></div><div id="stats" class="stats"></div><section class="panel"><div class="toolbar"><div><h2 style="margin:0 0 4px">Booking Diary</h2><p class="muted" style="margin:0">Switch between the detailed booking list and calendar.</p></div><div class="viewtabs"><button id="listTab" class="active">List View</button><button id="calendarTab">Calendar View</button></div></div><div id="listView"><div id="root" class="rrta-modern-bookings" style="margin-top:14px"></div></div><div id="calendarView" class="hidden"><div class="calhead" style="margin-top:16px"><div class="calnav"><button class="small" id="prevMonth">←</button><button class="small" id="todayMonth">Today</button><button class="small" id="nextMonth">→</button></div><h2 id="monthTitle" style="margin:0"></h2><div><span class="badge induction">Induction</span> <span class="badge confirmed">Confirmed</span> <span class="badge provisional">Provisional</span></div></div><div id="calendar" class="calendar"></div></div></section></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="portal-navigation.js"></script><script>const db=window.supabase.createClient('https://qgbpotjqggeodxqcwkgj.supabase.co','sb_publishable_J1yPM1Hi7INCX2m7rp3PdA_JdQ46FRS');const stats=document.getElementById('stats'),root=document.getElementById('root'),esc=(v='')=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c])),fmt=d=>d?new Date(d+'T00:00:00').toLocaleDateString('en-GB'):'—';let bookings=[],attendees=[],learners=[],inductions=[],resources=[],calDate=new Date();async function requireTrainer(){const{data:u}=await db.auth.getUser();if(!u?.user)throw new Error('Please sign in through the Trainer Portal.');const{data:p}=await db.from('profiles').select('role,permission_level,portal_access_role,organisational_access_role').eq('id',u.user.id).maybeSingle();const access=String(p?.organisational_access_role||p?.portal_access_role||'').toLowerCase();if(!p||(!['academy_staff','academy','health_safety','operations_manager','administrator'].includes(access)&&p.permission_level!=='super_user'))throw new Error('Academy access is required.')}async function load(){await requireTrainer();const[b,a,l,i,r]=await Promise.all([db.from('bookings').select('*').order('start_date',{ascending:true}),db.from('booking_attendees').select('*').order('created_at'),db.from('profiles').select('id,full_name,email,employee_number').order('full_name'),db.from('induction_sessions').select('*').neq('status','cancelled').order('session_date'),db.from('academy_resources').select('id,site,resource_name').eq('active',true)]);if(b.error)throw b.error;if(a.error)throw a.error;bookings=(b.data||[]).filter(x=>x.status!=='cancelled');attendees=a.data||[];learners=l.error?[]:l.data||[];inductions=i.error?[]:i.data||[];resources=r.error?[]:r.data||[];render();renderCalendar()}function listFor(id){return attendees.filter(a=>a.booking_id===id)}function rname(id){const r=resources.find(x=>x.id===id);return r?r.site+' · '+r.resource_name:'Room TBC'}function render(){stats.innerHTML=`<div class="stat"><span>Course bookings</span><strong>${bookings.filter(b=>b.booking_type!=='induction').length}</strong></div><div class="stat"><span>Induction dates</span><strong>${inductions.length}</strong></div><div class="stat"><span>Confirmed bookings</span><strong>${bookings.filter(b=>b.status==='confirmed').length}</strong></div><div class="stat"><span>Delegates / learners</span><strong>${attendees.length}</strong></div>`;if(!bookings.length){root.innerHTML='<div class="notice">No confirmed/provisional bookings yet. Open induction dates are visible in Calendar View.</div>';return}if(!window.__rrtaModernBookingsRenderer){root.innerHTML=`<div style="overflow:auto"><table class="table"><thead><tr><th>Reference</th><th>Type</th><th>Course / Activity</th><th>Date</th><th>Location</th><th>Delegates</th><th>Status</th><th></th></tr></thead><tbody>${bookings.map(b=>`<tr><td><strong>${esc(b.booking_reference||'—')}</strong></td><td><span class="badge ${b.booking_type==='induction'?'induction':''}">${b.booking_type==='induction'?'Induction':'Course'}</span></td><td>${esc(b.course_title||'—')}</td><td>${fmt(b.start_date)}</td><td>${esc(b.location||'—')}</td><td>${listFor(b.id).length} / ${b.delegate_count||'—'}</td><td><span class="badge ${esc(b.status)}">${esc(b.status||'provisional')}</span></td><td><div class="actions"><button class="small dark" data-manage="${b.id}">Manage</button>${b.status==='provisional'?`<button class="small" data-confirm="${b.id}">Confirm</button>`:''}</div></td></tr><tr><td colspan="8"><div class="drawer" id="drawer-${b.id}">${delegateEditor(b)}</div></td></tr>`).join('')}</tbody></table></div>`;bind()}}function learnerOptions(){return '<option value="">Select internal learner</option>'+learners.map(l=>`<option value="${l.id}">${esc(l.full_name||'Learner')}${l.employee_number?` · ${esc(l.employee_number)}`:''}</option>`).join('')}function delegateEditor(b){const list=listFor(b.id);return `<strong>Delegates / learners</strong><div class="delegate-grid" style="margin-top:10px"><label>Internal learner<select id="learner-${b.id}">${learnerOptions()}</select></label><label>External delegate name<input id="name-${b.id}" placeholder="Name"></label><label>Email<input id="email-${b.id}" type="email" placeholder="Email"></label><button class="small dark" data-add="${b.id}">Add</button></div><div class="delegate-list">${list.length?list.map(a=>`<div class="delegate"><span><strong>${esc(a.attendee_name||'Delegate')}</strong><span class="muted">${a.profile_id?' · Internal':' · External'}</span></span><button class="small" data-remove="${a.id}">Remove</button></div>`).join(''):'<div class="muted">No delegates added yet.</div>'}</div>`}function bind(){document.querySelectorAll('[data-manage]').forEach(x=>x.onclick=()=>document.getElementById('drawer-'+x.dataset.manage).classList.toggle('open'));document.querySelectorAll('[data-confirm]').forEach(x=>x.onclick=()=>confirmBooking(x.dataset.confirm));document.querySelectorAll('[data-add]').forEach(x=>x.onclick=()=>addDelegate(x.dataset.add));document.querySelectorAll('[data-remove]').forEach(x=>x.onclick=()=>removeDelegate(x.dataset.remove))}async function confirmBooking(id){const{error}=await db.from('bookings').update({status:'confirmed',updated_at:new Date().toISOString()}).eq('id',id);if(error)return alert(error.message);await load()}async function addDelegate(id){const sel=document.getElementById('learner-'+id),name=document.getElementById('name-'+id),email=document.getElementById('email-'+id);let payload={booking_id:id};if(sel.value){const l=learners.find(x=>x.id===sel.value);Object.assign(payload,{profile_id:l.id,attendee_name:l.full_name||'Learner',attendee_email:l.email||null,employee_number:l.employee_number||null})}else{if(!name.value.trim())return alert('Choose an internal learner or enter an external delegate name.');payload.attendee_name=name.value.trim();payload.attendee_email=email.value.trim()||null}const{error}=await db.from('booking_attendees').insert(payload);if(error)return alert(error.message);await load();setTimeout(()=>document.getElementById('drawer-'+id)?.classList.add('open'),0)}async function removeDelegate(id){if(!confirm('Remove this delegate from the booking?'))return;const bid=attendees.find(a=>a.id===id)?.booking_id;const{error}=await db.from('booking_attendees').delete().eq('id',id);if(error)return alert(error.message);await load();setTimeout(()=>document.getElementById('drawer-'+bid)?.classList.add('open'),0)}function renderCalendar(){const y=calDate.getFullYear(),m=calDate.getMonth();document.getElementById('monthTitle').textContent=new Date(y,m,1).toLocaleDateString('en-GB',{month:'long',year:'numeric'});const first=(new Date(y,m,1).getDay()+6)%7,days=new Date(y,m+1,0).getDate(),prevDays=new Date(y,m,0).getDate();let cells=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<div class="dow">${d}</div>`);for(let n=0;n<42;n++){let day=n-first+1,cm=m,cy=y,other=false;if(day<1){day=prevDays+day;cm=m-1;other=true;if(cm<0){cm=11;cy--}}else if(day>days){day-=days;cm=m+1;other=true;if(cm>11){cm=0;cy++}}const iso=`${cy}-${String(cm+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`,ev=[];bookings.filter(b=>b.start_date<=iso&&(b.end_date||b.start_date)>=iso).forEach(b=>ev.push(`<button class="event ${b.booking_type==='induction'?'induction ':''}${esc(b.status||'provisional')}" title="${esc(b.location||'')}" onclick="showList()">${esc(b.course_title||'Course')} · ${esc(b.status||'provisional')}</button>`));inductions.filter(i=>i.session_date===iso&&!i.booking_id).forEach(i=>ev.push(`<button class="event induction open" onclick="location.href='induction-bookings.html'">Induction ${String(i.start_time||'08:00').slice(0,5)}–${String(i.end_time||'16:00').slice(0,5)} · ${esc(rname(i.resource_id))} · provisional</button>`));cells.push(`<div class="day ${other?'other':''}"><div class="daynum">${day}</div>${ev.join('')}</div>`)}document.getElementById('calendar').innerHTML=cells.join('')}function showList(){document.getElementById('listView').classList.remove('hidden');document.getElementById('calendarView').classList.add('hidden');document.getElementById('listTab').classList.add('active');document.getElementById('calendarTab').classList.remove('active')}function showCalendar(){document.getElementById('calendarView').classList.remove('hidden');document.getElementById('listView').classList.add('hidden');document.getElementById('calendarTab').classList.add('active');document.getElementById('listTab').classList.remove('active');renderCalendar()}document.getElementById('listTab').onclick=showList;document.getElementById('calendarTab').onclick=showCalendar;document.getElementById('prevMonth').onclick=()=>{calDate=new Date(calDate.getFullYear(),calDate.getMonth()-1,1);renderCalendar()};document.getElementById('nextMonth').onclick=()=>{calDate=new Date(calDate.getFullYear(),calDate.getMonth()+1,1);renderCalendar()};document.getElementById('todayMonth').onclick=()=>{calDate=new Date();renderCalendar()};load().catch(e=>{root.innerHTML=`<div class="notice"><strong>Unable to load bookings.</strong><br>${esc(e.message||'Unknown error')}</div>`});</script><script src="booked-courses-candidates.js"></script><script src="booked-courses-joining.js"></script><script src="confirmed-bookings-card-ui.js?v=20260922-1"></script><script src="external-learner-booking-profile.js?v=20260918-1058"></script><script src="unified-learner-picker.js?v=20260918-1058"></script><script src="external-booking-finance.js?v=20260920-1"></script></body></html>
