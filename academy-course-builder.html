<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Course Builder | RRTA</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f5f7;color:#202832;font:15px Inter,Arial,sans-serif}header{background:#151a22;color:white;padding:18px 5vw}main{max-width:1000px;margin:24px auto;padding:0 16px}a{color:inherit}section,article{background:white;border:1px solid #dce1e7;border-radius:10px;padding:20px;margin:14px 0}label{display:block;font-weight:650;margin:12px 0 6px}input,textarea,select{font:inherit;width:100%;padding:10px;border:1px solid #bbc5d0;border-radius:6px}textarea{min-height:100px}button{font:inherit;border:0;border-radius:6px;padding:10px 14px;background:#b20f22;color:white;cursor:pointer;margin:5px 5px 5px 0}button.secondary{background:#e7ebef;color:#202832}button:disabled{opacity:.5}#preview p{white-space:pre-wrap;overflow-wrap:anywhere}[hidden]{display:none!important}.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}</style></head><body><header><strong>RRTA · Academy Online Development</strong></header><main><a href="academy-online-development.html">← Development workspace</a><h1>Course Builder</h1><p id="status" role="status">Checking access…</p><div id="editor" hidden><section><label for="drafts">My saved drafts</label><select id="drafts"></select><button id="open" class="secondary">Open selected draft</button><button id="new" class="secondary">New course</button></section><section><label for="title">Course title</label><input id="title" maxlength="160"><label for="description">Description and learning objectives</label><textarea id="description" maxlength="10000"></textarea></section><div id="modules"></div><button id="add" class="secondary">+ Add module</button><button id="save">Save draft</button><button id="showPreview" class="secondary">Learner preview</button><section id="preview" hidden></section><p>Drafts only. Publishing, media uploads and assessments are not enabled yet.</p></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const $=id=>document.getElementById(id);let db,id=null,modules=[],dirty=false,busy=false,rows=[];const mark=()=>{dirty=true;$('status').textContent='Unsaved changes';$('preview').hidden=true};function el(tag,text){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;return e}function button(text,fn){const b=el('button',text);b.className='secondary';b.onclick=fn;return b}function render(){const root=$('modules');root.replaceChildren();modules.forEach((m,i)=>{const a=el('article');a.append(el('h2','Module '+(i+1)));const l=el('label','Module title');const t=el('input');t.maxLength=160;t.value=m.title;t.oninput=()=>{m.title=t.value;mark()};l.append(t);a.append(l);const k=el('label','Learning content');const v=el('textarea');v.maxLength=20000;v.value=m.content;v.oninput=()=>{m.content=v.value;mark()};k.append(v);a.append(k);const row=el('div');row.className='row';if(i>0)row.append(button('Move up',()=>{[modules[i-1],modules[i]]=[modules[i],modules[i-1]];mark();render()}));if(i<modules.length-1)row.append(button('Move down',()=>{[modules[i+1],modules[i]]=[modules[i],modules[i+1]];mark();render()}));row.append(button('Remove module',()=>{if(confirm('Remove this module from the draft?')){modules.splice(i,1);mark();render()}}));a.append(row);root.append(a)})}async function list(){const r=await db.from('academy_course_drafts').select('id,title').order('updated_at',{ascending:false});if(r.error)throw r.error;rows=r.data;$('drafts').replaceChildren(new Option('Select a draft',''));rows.forEach(x=>$('drafts').append(new Option(x.title,x.id)));$('drafts').value=id||''}function load(d){id=d?.id||null;$('title').value=d?.title||'';$('description').value=d?.description||'';modules=Array.isArray(d?.modules)?d.modules.map(m=>({title:String(m.title||''),content:String(m.content||'')})):[];dirty=false;$('preview').hidden=true;render();$('status').textContent=id?'Draft loaded':'New draft';$('drafts').value=id||''}function lock(v){busy=v;$('editor').inert=v}function canLeave(){return !busy&&(!dirty||confirm('Discard unsaved changes?'))}async function action(fn){if(busy)return;lock(true);try{await fn()}catch(e){$('status').textContent=e.message||'Operation failed'}finally{lock(false)}}$('title').oninput=mark;$('description').oninput=mark;$('new').onclick=()=>{if(canLeave())load(null)};$('open').onclick=()=>{const selected=$('drafts').value;if(!selected||!canLeave())return;action(async()=>{const r=await db.from('academy_course_drafts').select('*').eq('id',selected).single();if(r.error)throw r.error;load(r.data)})};$('add').onclick=()=>{if(modules.length>=50)return alert('Maximum 50 modules per draft.');modules.push({title:'',content:''});mark();render()};$('save').onclick=()=>action(async()=>{const title=$('title').value.trim();if(!title)throw Error('Enter a course title.');const payload={title,description:$('description').value,modules,updated_at:new Date().toISOString()};const q=db.from('academy_course_drafts');const r=await (id?q.update(payload).eq('id',id):q.insert(payload)).select('id').single();if(r.error)throw r.error;id=r.data.id;dirty=false;$('status').textContent='Draft saved';await list()});$('showPreview').onclick=()=>{const p=$('preview');p.replaceChildren(el('h2',$('title').value||'Untitled course'),el('p',$('description').value));modules.forEach(m=>p.append(el('h3',m.title||'Untitled module'),el('p',m.content)));p.hidden=false;p.scrollIntoView({behavior:'smooth'})};window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});(async()=>{try{db=window.supabase.createClient('https://qgbpotjqggeodxqcwkgj.supabase.co','sb_publishable_J1yPM1Hi7INCX2m7rp3PdA_JdQ46FRS');const a=await db.auth.getUser();if(a.error||!a.data.user){location.replace('portal.html');return}const [p,g]=await Promise.all([db.from('profiles').select('account_status,login_enabled,must_change_password').eq('id',a.data.user.id).single(),db.rpc('can_manage_academy')]);if(p.error||g.error||g.data!==true||p.data.account_status!=='active'||p.data.login_enabled===false)throw Error('Academy administrator access required.');if(p.data.must_change_password){location.replace('change-password.html');return}await list();load(null);$('editor').hidden=false}catch(e){$('status').textContent=e.message||'Unable to verify access'}})();
</script></body></html>
