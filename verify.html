<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Accreditation Verification | RRTA</title><link rel="stylesheet" href="styles.css"><style>body{background:#f3f5f6}.verify-shell{max-width:1180px;margin:0 auto;padding:28px 22px 56px}.verify-hero,.verify-panel{background:#fff;border:1px solid #d9dee5;border-radius:14px;padding:22px}.verify-hero{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}.verify-meta{display:flex;gap:16px;flex-wrap:wrap;color:#667085}.verify-meta strong{color:#17202a}.verify-panel{margin-top:16px}.verify-head{display:flex;justify-content:space-between;gap:12px;align-items:center}.verify-table{width:100%;border-collapse:collapse;margin-top:14px}.verify-table th,.verify-table td{padding:12px 10px;border-bottom:1px solid #e3e7eb;text-align:left;font-size:13px}.verify-table th{font-size:11px;text-transform:uppercase;color:#667085}.badge{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:800}.badge.valid{background:#e8f6ed;color:#176b37}.badge.expiring{background:#fff6d8;color:#8a6100}.badge.expired{background:#fdebec;color:#b42318}.mini-btn{display:inline-flex;align-items:center;text-decoration:none;border:1px solid #cfd6db;border-radius:7px;padding:7px 10px;background:#fff;color:#17202a;font-weight:700}.error-box{padding:14px;border-radius:9px;background:#fdebec;color:#9b1c28}.note{font-size:12px;color:#667085}@media(max-width:760px){.verify-hero,.verify-head{display:block}.verify-table{display:block;overflow:auto}.verify-head label{display:flex;margin-top:12px}}</style></head><body><header class="site-header"><div class="header-inner"><img src="rrta-logo.png" class="brand-logo" alt="Rapid Response Training Academy"><div class="header-user">Accreditation Verification</div></div></header><main class="verify-shell"><section id="verifyApp"><div class="verify-hero"><div><div class="eyebrow">Live verification</div><h1 id="personName">Loading…</h1><div class="verify-meta"><span><strong>Employee:</strong> <span id="employeeNo">—</span></span><span><strong>Organisation:</strong> <span id="organisation">—</span></span><span><strong>Job title:</strong> <span id="jobTitle">—</span></span></div></div><div><span class="status live">LIVE RECORD</span><p class="note">Generated directly from the current RRTA record.</p></div></div><section class="verify-panel"><div class="verify-head"><div><h2>Accreditations</h2><p class="muted">Expired records are hidden by default. Expiring records remain visible.</p></div><label style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700"><input id="showExpired" type="checkbox"> Show expired</label></div><div id="records"></div></section></section><div id="verifyError" class="error-box hidden"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=window.supabase.createClient('https://qgbpotjqggeodxqcwkgj.supabase.co','sb_publishable_J1yPM1Hi7INCX2m7rp3PdA_JdQ46FRS');const token=new URLSearchParams(location.search).get('t');const esc=(v='')=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const fmt=d=>d?new Date(d+'T00:00:00').toLocaleDateString('en-GB'):'—';async function openEvidence(id){const {data,error}=await db.functions.invoke('verification-evidence',{body:{token,accreditation_id:id}});if(error||data?.error)return alert(data?.error||error?.message||'Unable to open certificate.');window.open(data.url,'_blank','noopener')}async function load(){if(!token)throw new Error('This verification link is incomplete.');const include=document.getElementById('showExpired').checked;const {data,error}=await db.rpc('get_public_learner_verification',{p_token:token,p_include_expired:include});if(error)throw error;if(!data?.learner)throw new Error('This verification record could not be found.');const p=data.learner;document.getElementById('personName').textContent=p.full_name||[p.forename,p.surname].filter(Boolean).join(' ')||'Operative';document.getElementById('employeeNo').textContent=p.employee_number||'—';document.getElementById('organisation').textContent=p.organisation||'—';document.getElementById('jobTitle').textContent=p.job_title||'—';const rows=data.accreditations||[];document.getElementById('records').innerHTML=rows.length?`<table class="verify-table"><thead><tr><th>Accreditation</th><th>Issued</th><th>Expires</th><th>Status</th><th>Certificate</th></tr></thead><tbody>${rows.map(a=>`<tr><td><strong>${esc(a.accreditation_name||'Accreditation')}</strong><div class="note">${esc(a.awarding_body||'')}</div></td><td>${fmt(a.issue_date)}</td><td>${fmt(a.expiry_date)}</td><td><span class="badge ${esc(a.status)}">${a.status==='valid'?'Valid':a.status==='expiring'?'Expiring':'Expired'}</span></td><td><button class="mini-btn" onclick="openEvidence(${Number(a.id)})">View</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">No accreditations are currently recorded.</div>'}document.getElementById('verifyError').classList.add('hidden')}document.getElementById('showExpired').onchange=()=>load().catch(showErr);function showErr(e){document.getElementById('verifyApp').classList.add('hidden');const box=document.getElementById('verifyError');box.textContent=e.message||'Unable to load verification record.';box.classList.remove('hidden')}load().catch(showErr);</script></body></html>
