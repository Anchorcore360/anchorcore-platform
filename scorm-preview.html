<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RRTA | Private course preview</title><style>body{margin:0;font:14px Arial,sans-serif;background:#eef0f2;color:#18202a}header{display:flex;justify-content:space-between;align-items:center;gap:16px;background:#18202a;color:white;padding:12px 24px}header a{color:white}#status{padding:12px 24px;white-space:pre-wrap}iframe{display:block;width:100%;height:calc(100dvh - 55px);border:0} [hidden]{display:none!important}</style></head><body><header><a href="scorm-review.html">← Staged courses</a><strong>Private preview · No learning records saved</strong><button id="full" type="button" style="background:#fff;color:#18202a;border:0;border-radius:6px;padding:8px 14px;cursor:pointer">⛶ Full screen</button></header><div id="status" role="status">Checking Academy access…</div><iframe id="player" title="RAPID course preview" allowfullscreen sandbox="allow-scripts allow-modals" referrerpolicy="no-referrer" hidden></iframe><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script><script>
const db=supabase.createClient('https://qgbpotjqggeodxqcwkgj.supabase.co','sb_publishable_J1yPM1Hi7INCX2m7rp3PdA_JdQ46FRS');
const statusEl=document.getElementById('status'),player=document.getElementById('player');
document.getElementById('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if(!player.hidden)await player.requestFullscreen()}catch(e){statusEl.hidden=false;statusEl.textContent='Full screen unavailable: '+e.message}};
const mime={png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',svg:'image/svg+xml',mp3:'audio/mpeg',mp4:'video/mp4',vtt:'text/vtt'};
const safePath=p=>/^[A-Za-z0-9_./-]+$/.test(p)&&!p.startsWith('/')&&!p.split('/').some(x=>x==='..'||x==='.');
function inlineScript(code){const s=document.createElement('script');s.textContent=code.replace(/<\/script/gi,'<\\/script');return s}
async function start(){
 const au=await db.auth.getUser();const user=au.data?.user;if(au.error||!user)throw Error('Sign in to the Academy first.');
 const permission=await db.rpc('can_manage_academy');if(permission.error||permission.data!==true)throw Error('Academy access required.');
 const id=new URLSearchParams(location.search).get('package');if(!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(id||''))throw Error('Invalid package reference.');
 const base=user.id+'/'+id;const staged=db.storage.from('scorm-extracted-staging');const manifest=await staged.download(base+'/imsmanifest.xml');if(manifest.error||!manifest.data)throw Error('No staged manifest found.');
 const raw=await db.storage.from('scorm-packages').download(base+'.zip');if(raw.error||!raw.data)throw Error('Original package unavailable.');
 if(raw.data.size>20*1024*1024)throw Error('Preview package exceeds current limit.');
 statusEl.textContent='Preparing private multimedia preview…';
 const zip=await JSZip.loadAsync(raw.data);const files=Object.values(zip.files).filter(x=>!x.dir);let total=0;
 if(files.length>400)throw Error('Too many files.');for(const f of files){if(!safePath(f.name)||f.unsafeOriginalName&&f.unsafeOriginalName!==f.name)throw Error('Unsafe package path.');const n=f._data?.uncompressedSize;if(!Number.isFinite(n)||n>5*1024*1024)throw Error('Individual asset exceeds preview limit.');total+=n;if(total>40*1024*1024)throw Error('Expanded package exceeds preview limit.')}
 const read=async name=>{const f=zip.file(name);if(!f)throw Error('Missing '+name);return f.async('string')};
 const html=await read('index.html');let course=await read('course.js');const data=await read('data.js'),lessons=await read('lessons.js');
 if(!html.includes('Company-wide edition 8.0')||!course.includes('const lessons=LESSONS;'))throw Error('This preview adapter currently supports RAPID V8 only.');
 const assets={};for(const f of files){const ext=f.name.split('.').pop().toLowerCase();if(mime[ext])assets[f.name]='data:'+mime[ext]+';base64,'+await f.async('base64')}
 const replacements=[['esc(m.poster)','esc(rrAsset(m.poster))'],['media/${esc(m.key)}.mp4','${esc(rrAsset("media/"+m.key+".mp4"))}'],['media/${esc(m.key)}.vtt','${esc(rrAsset("media/"+m.key+".vtt"))}'],['esc(n.images[0])','esc(rrAsset(n.images[0]))'],['esc(n.src)','esc(rrAsset(n.src))'],['esc(l.hotspots.image)','esc(rrAsset(l.hotspots.image))'],['esc(l.photo)','esc(rrAsset(l.photo))'],['im.src=l.narration.images[j]','im.src=rrAsset(l.narration.images[j])']];
 for(const [a,b] of replacements){if(!course.includes(a))throw Error('Preview adapter mismatch: '+a);course=course.split(a).join(b)}
 course=course.replace("window.open('certificate-preview.html?score='+Math.round(r.score/30*100),'_blank')","alert('Specimen certificate is available in the original ZIP. No official certificate is issued in preview.')");
 const doc=new DOMParser().parseFromString(html,'text/html');doc.querySelectorAll('script,base,meta[http-equiv],iframe,object,embed,link').forEach(x=>x.remove());
 const layoutStyle=doc.createElement('style');layoutStyle.textContent='@media(min-width:1000px){body main,body .shell,body .wrap,body .container,body .course-shell,body .course-wrap,body .app,body #app{max-width:min(96vw,1800px)!important;width:96vw!important;margin-left:auto!important;margin-right:auto!important;box-sizing:border-box}body video{max-width:100%!important;max-height:55dvh!important;object-fit:contain}}';doc.head.appendChild(layoutStyle);
 const csp=doc.createElement('meta');csp.httpEquiv='Content-Security-Policy';csp.content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; media-src data:; connect-src 'none'; object-src 'none'; frame-src 'none'; form-action 'none'; base-uri 'none'";doc.head.prepend(csp);
 for(const el of doc.querySelectorAll('[src],[poster]'))for(const attr of ['src','poster'])if(el.hasAttribute(attr)){const path=el.getAttribute(attr);if(assets[path])el.setAttribute(attr,assets[path]);else el.removeAttribute(attr)}
 const assetCode='const RR_ASSETS='+JSON.stringify(assets)+';const rrAsset=p=>RR_ASSETS[p]||"";';
 const orderingPatch="(function(){\n const correct=['Arrive','Check','Agree','Protect','Communicate','Complete'];\n let active=null,passed=false,drag=-1;\n function nextButton(){return [...document.querySelectorAll('button')].find(b=>/^Continue\\s*(→)?$/i.test(b.textContent.trim()))}\n function setup(){\n const h=[...document.querySelectorAll('h1,h2,h3')].find(e=>e.textContent.trim()==='Six steps. One standard.');\n if(!h){active=null;passed=false;return}\n if(active===h&&h.isConnected)return;\n const buttons=correct.map(t=>[...document.querySelectorAll('button')].find(b=>b.textContent.trim()===t));\n if(buttons.some(b=>!b))return;\n const parent=buttons[0].parentElement;if(!buttons.every(b=>b.parentElement===parent))return;\n active=h;passed=false;\n const p=h.nextElementSibling;if(p&&p.tagName==='P')p.textContent='Drag the six steps into the correct order, then check your answer.';\n const order=['Protect','Complete','Check','Communicate','Arrive','Agree'];\n const panel=document.createElement('section');panel.setAttribute('aria-label','Order the six steps');panel.style.cssText='display:grid;gap:7px;width:100%;max-width:950px;margin:12px auto';\n const feedback=document.createElement('p');feedback.setAttribute('role','status');feedback.textContent='Arrange the steps from first to last. You can also use the arrow buttons.';\n const check=document.createElement('button');check.type='button';check.textContent='Check order';check.style.cssText='background:#ad1226;color:white;padding:10px 18px;border:0;border-radius:8px;justify-self:start';\n function move(from,to){if(from<0||to<0||to>=order.length||from===to)return;order.splice(to,0,order.splice(from,1)[0]);passed=false;feedback.textContent='Check your order when ready.';render();const n=nextButton();if(n)n.disabled=true}\n function render(){panel.replaceChildren();order.forEach((t,i)=>{const row=document.createElement('div');row.draggable=true;row.style.cssText='display:flex;align-items:center;gap:12px;padding:8px 12px;background:#eef1f3;border:1px solid #cdd4db;border-radius:8px;cursor:grab';const label=document.createElement('span');label.textContent=(i+1)+'.  ☰  '+t;label.style.flex='1';row.append(label);for(const [d,txt] of [[-1,'↑'],[1,'↓']]){const b=document.createElement('button');b.type='button';b.textContent=txt;b.setAttribute('aria-label','Move '+t+(d<0?' up':' down'));b.disabled=i+d<0||i+d>=order.length;b.style.cssText='min-width:44px;min-height:36px;border:1px solid #b8c2cb;border-radius:6px;background:white;color:#18202a';b.onclick=()=>move(i,i+d);row.append(b)}row.addEventListener('dragstart',e=>{drag=i;e.dataTransfer.setData('text/plain',String(i));e.dataTransfer.effectAllowed='move'});row.addEventListener('dragover',e=>e.preventDefault());row.addEventListener('drop',e=>{e.preventDefault();move(drag,i);drag=-1});panel.append(row)});panel.append(check,feedback)}\n check.onclick=()=>{passed=order.every((v,i)=>v===correct[i]);feedback.textContent=passed?'Correct! You can now continue.':'Not quite. Rearrange the steps and try again.';feedback.style.color=passed?'#17603a':'#a31527';const n=nextButton();if(n)n.disabled=!passed};\n buttons.forEach(b=>b.hidden=true);parent.insertAdjacentElement('afterend',panel);render();const n=nextButton();if(n)n.disabled=true;\n }\n document.addEventListener('click',e=>{const b=e.target.closest('button');if(active&&active.isConnected&&!passed&&b&&/^Continue\\s*(→)?$/i.test(b.textContent.trim())){e.preventDefault();e.stopImmediatePropagation()}},true);\n new MutationObserver(setup).observe(document.body,{childList:true,subtree:true});setup();\n})();";
 for(const code of [assetCode,data,lessons,course,orderingPatch]){const s=doc.createElement('script');s.textContent=code.replace(/<\/script/gi,'<\\/script');doc.body.appendChild(s)}
 player.srcdoc='<!doctype html>'+doc.documentElement.outerHTML;player.hidden=false;statusEl.hidden=true;
}
start().catch(e=>{statusEl.textContent='Preview unavailable: '+(e.message||String(e))});
</script></body></html>
