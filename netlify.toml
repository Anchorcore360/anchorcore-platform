[build]
  publish = "."

[[redirects]]
  from = "/"
  to = "/portal.html"
  status = 302

[[redirects]]
  from = "/workforce.html"
  to = "/learner-portal.html"
  status = 302

[[redirects]]
  from = "/learner-profile.html"
  to = "/learner-profile-v2.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"


[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
