<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Leaver Review | RRTA</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="portal-navigation.css"><style>body{margin:0;background:#f4f6f8;font-family:Inter,Arial;color:#18202a}.shell{display:grid;grid-template-columns:258px 1fr;min-height:100vh}.side{background:#171d26;padding:16px 12px;display:flex;flex-direction:column}.spacer{flex:1}.main{padding:28px}.wrap{max-width:1050px;margin:auto}.card{background:#fff;border:1px solid #e1e6eb;border-radius:14px;padding:20px;margin:14px 0}.eyebrow{font-size:10px;font-weight:900;color:#b20f22;text-transform:uppercase}.muted{color:#697586}.checks{display:grid;gap:8px;margin-top:15px}.check{display:flex;gap:12px;align-items:flex-start;padding:13px;border:1px solid #e1e6eb;border-radius:10px}.check input{width:18px;height:18px}.check b{display:block;font-size:12px}.check span{font-size:10px;color:#697586}.notes{width:100%;min-height:90px;padding:10px;border:1px solid #d4dae0;border-radius:8px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.btn{border:1px solid #d7dde3;background:#fff;padding:10px 13px;border-radius:8px;font-weight:800;cursor:pointer}.primary{background:#b20f22;color:#fff;border-color:#b20f22}.primary:disabled{opacity:.45}.status{padding:9px 11px;background:#fff7e6;border:1px solid #f2c66d;border-radius:8px;font-size:11px}@media(max-width:850px){.shell{grid-template-columns:1fr}.side{display:none}.main{padding:16px}}</style></head><body data-portal-nav="academy"><div class="shell"><aside class="side"><div class="spacer"></div></aside><main class="main"><div class="wrap"><div class="eyebrow">People · Leaver Management</div><h1>Leaver Review</h1><p class="muted">Complete and record all checks before the employee is archived. Only a Super User can complete this process.</p><div id="body" class="card">Loading review…</div></div></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="portal-navigation.js"></script><script>const db=supabase.createClient('https://qgbpotjqggeodxqcwkgj.supabase.co','sb_publishable_J1yPM1Hi7INCX2m7rp3PdA_JdQ46FRS'),id=new URLSearchParams(location.search).get('id'),keys=[['training_history','Training history checked','Confirm completed training and historical records are retained.'],['certificates_retained','Certificates retained','Confirm certificates and accreditation evidence remain available.'],['evidence_resolved','Outstanding evidence resolved','Review outstanding evidence, assessments and approval requests.'],['future_bookings_reviewed','Future bookings reviewed','Cancel or reassign future courses, inductions and bookings where required.'],['relationships_closed','Company & manager relationships reviewed','Confirm reporting/company links can be closed when archived.'],['access_ready','System access ready to close','Confirm the account is ready to be removed from the active workforce.']];let rec;async function load(){const{data:{user}}=await db.auth.getUser();if(!user)return location.href='portal.html';const{data:me}=await db.from('profiles').select('permission_level').eq('id',user.id).single();if(me?.permission_level!=='super_user'){document.getElementById('body').innerHTML='<div class="status">Super User permission is required to review or archive a leaver.</div>';return}const{data,error}=await db.from('leaver_notifications').select('*,people(full_name,email,profile_id)').eq('id',id).single();if(error)throw error;rec=data;render()}function render(){const c=rec.checklist||{};document.getElementById('body').innerHTML=`<h2>${rec.people?.full_name||'Employee'}</h2><div class="muted">${rec.people?.email||''}</div><p><b>Expected leaving date:</b> ${rec.expected_leaving_date?new Date(rec.expected_leaving_date+'T00:00:00').toLocaleDateString('en-GB'):'Not supplied'} &nbsp; <b>Manager reason:</b> ${rec.reason||'—'}</p><div class="checks">${keys.map(([k,t,d])=>`<label class="check"><input type="checkbox" data-k="${k}" ${c[k]?'checked':''}><div><b>${t}</b><span>${d}</span></div></label>`).join('')}</div><label style="display:block;margin-top:15px;font-size:11px;font-weight:800">Review notes</label><textarea id="notes" class="notes" placeholder="Record anything relevant to the offboarding review…">${rec.review_notes||''}</textarea><div class="actions"><button class="btn" onclick="location.href='manage-people.html'">Back</button><button class="btn" id="save">Save Review</button><button class="btn primary" id="complete">Approve & Archive</button></div>`;document.querySelectorAll('[data-k]').forEach(x=>x.onchange=save);document.getElementById('save').onclick=save;document.getElementById('complete').onclick=complete}async function save(){const checklist={};document.querySelectorAll('[data-k]').forEach(x=>checklist[x.dataset.k]=x.checked);const{error}=await db.from('leaver_notifications').update({checklist,review_notes:document.getElementById('notes').value,status:'reviewing',updated_at:new Date().toISOString()}).eq('id',id);if(error)alert(error.message);else rec.checklist=checklist}async function complete(){await save();if(!keys.every(([k])=>rec.checklist[k]))return alert('Complete all six checks before archiving.');if(!confirm('Approve this leaver review and archive the employee? Their historical training and compliance records will be retained.'))return;const{error}=await db.rpc('complete_leaver_review',{p_notification_id:id,p_review_notes:document.getElementById('notes').value});if(error)return alert(error.message);alert('Leaver review completed and employee archived.');location.href='manage-people.html'}load().catch(e=>document.getElementById('body').textContent=e.message);</script></body></html>
