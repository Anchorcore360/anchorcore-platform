<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Add Staff Member | RRTA</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="portal-navigation.css"><style>:root{--red:#b20f22;--ink:#18202a;--muted:#6f7a88;--line:#e2e6ea;--bg:#f4f6f8}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,Arial,sans-serif;color:var(--ink)}.shell{display:grid;grid-template-columns:258px minmax(0,1fr);min-height:100vh}.side{position:sticky;top:0;height:100vh;background:linear-gradient(180deg,#151a22,#1e2530);padding:16px 12px;display:flex;flex-direction:column}.brand{padding:5px 10px 16px;border-bottom:1px solid rgba(255,255,255,.08)}.brand img{width:188px}.spacer{flex:1}.main{min-width:0}.top{height:66px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 28px;justify-content:space-between}.content{max-width:1100px;margin:auto;padding:28px 32px 60px}.head{margin-bottom:18px}.eyebrow{font-size:10px;color:var(--red);font-weight:900;text-transform:uppercase;letter-spacing:.11em}.head h1{margin:5px 0 6px;font-size:30px}.muted{color:var(--muted)}.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:0 10px 24px rgba(18,24,33,.05)}.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.form label{font-size:11px;font-weight:800;color:#475467}.form input,.form select{width:100%;height:42px;border:1px solid #d3d9df;border-radius:8px;padding:0 11px;margin-top:5px;font:inherit}.wide{grid-column:1/-1}.actions{display:flex;gap:9px;margin-top:18px}.btn{border:0;border-radius:8px;padding:10px 13px;font-weight:850;font-size:11px;cursor:pointer;text-decoration:none}.primary{background:var(--red);color:#fff}.light{background:#fff;border:1px solid var(--line);color:var(--ink)}.message{margin-top:12px;font-size:11px}.ok{color:#176b37}.bad{color:#b42318}.hidden{display:none}@media(max-width:1000px){.shell{grid-template-columns:1fr}.side{position:relative;height:auto}}@media(max-width:650px){.form{grid-template-columns:1fr}.wide{grid-column:auto}.content{padding:20px 14px}}</style></head><body data-portal-nav="academy"><div class="shell"><aside class="side"><div class="brand"><img src="rrta-logo.png" alt="RRTA"></div><div class="spacer"></div></aside><main class="main"><header class="top"><strong>RRTA Training Academy Administration</strong><span class="muted">Add Staff Member</span></header><div class="content"><div class="head"><div class="eyebrow">Workforce Administration</div><h1>Add Staff Member</h1><p class="muted">Create an RRT direct staff or subcontractor record. Subcontractors can be linked to a company and an RRT manager from day one.</p></div><section class="panel"><form id="form" class="form"><label>Forename<input id="forename" required></label><label>Surname<input id="surname" required></label><label>Email Address<input id="email" type="email" required></label><label>Temporary Password<input id="password" type="password" minlength="8" required></label><label>Employee / Operative Number<input id="employee"></label><label>Job Title<input id="job"></label><label>Department<input id="department"></label><label>Work Location<input id="location"></label><label>Workforce Type<select id="type"><option value="direct_staff">RRT Direct Staff</option><option value="subcontractor">Subcontractor</option></select></label><label id="companyWrap" class="hidden">Subcontractor Company<select id="company"><option value="">Select Company</option></select></label><label>Primary RRT Manager<select id="manager"><option value="">Not Assigned</option></select></label><div class="wide actions"><button class="btn primary" type="submit" id="save">Create Staff Member</button><a class="btn light" href="workforce-directory.html">Cancel</a><a class="btn light" href="external-customers.html">Manage Companies</a></div><div id="message" class="message wide"></div></form></section></div></main></div><script src="portal-navigation.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=window.supabase.createClient('https://qgbpotjqggeodxqcwkgj.supabase.co','sb_publishable_J1yPM1Hi7INCX2m7rp3PdA_JdQ46FRS');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));let companies=[];function syncType(){companyWrap.classList.toggle('hidden',type.value!=='subcontractor');company.required=type.value==='subcontractor'}type.onchange=syncType;async function init(){const{data:u}=await db.auth.getUser();if(!u?.user){location.href='portal.html';return}const{data:p}=await db.from('profiles').select('role,permission_level').eq('id',u.user.id).single();if(!p||(String(p.role).toLowerCase()!=='trainer'&&p.permission_level!=='super_user')){location.href='portal.html';return}const[m,c]=await Promise.all([db.from('profiles').select('id,full_name,job_title').eq('account_status','active').order('full_name'),db.from('external_customers').select('id,company_name,is_rrt_subcontractor,active').eq('active',true).order('company_name')]);(m.data||[]).forEach(x=>manager.insertAdjacentHTML('beforeend',`<option value="${x.id}">${esc(x.full_name||x.job_title||'User')}</option>`));companies=c.data||[];companies.forEach(x=>company.insertAdjacentHTML('beforeend',`<option value="${x.id}">${esc(x.company_name)}</option>`));syncType()}form.onsubmit=async e=>{e.preventDefault();save.disabled=true;save.textContent='Creating…';message.className='message wide';message.textContent='';const fn=forename.value.trim(),sn=surname.value.trim(),isSub=type.value==='subcontractor',co=companies.find(x=>x.id===company.value);const payload={forename:fn,surname:sn,full_name:`${fn} ${sn}`.trim(),email:email.value.trim().toLowerCase(),employee_number:employee.value.trim(),job_title:job.value.trim(),organisation:isSub?(co?.company_name||'Subcontractor'):'Rapid Response Telecoms',password:password.value};try{const r=await db.functions.invoke('create-learner',{body:payload});if(r.error)throw r.error;if(r.data?.error)throw new Error(r.data.error);const id=r.data?.user?.id||r.data?.id||r.data?.learner_id;if(id){const patch={worker_type:type.value,department:department.value.trim()||null,work_location:location.value.trim()||null,manager_1_id:manager.value||null,company_id:isSub?(company.value||null):null,organisation:isSub?(co?.company_name||null):'Rapid Response Telecoms'};const up=await db.from('profiles').update(patch).eq('id',id);if(up.error)throw up.error;if(isSub&&company.value){await db.from('external_customers').update({is_rrt_subcontractor:true,rrt_contract_status:'active'}).eq('id',company.value)}}message.textContent='Staff member created successfully.';message.className='message wide ok';setTimeout(()=>location.href=`workforce-directory.html?type=${type.value}`,700)}catch(err){message.textContent=err.message||'Unable to create staff member.';message.className='message wide bad';save.disabled=false;save.textContent='Create Staff Member'}};init();</script></body></html>
