<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Joining Instructions | RRTA</title><style>:root{--red:#b20f22;--ink:#18202a;--muted:#6f7a88;--line:#e2e6ea;--bg:#f4f6f8}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,Arial,sans-serif;color:var(--ink)}.wrap{max-width:900px;margin:36px auto;padding:0 18px}.brand{display:flex;align-items:center;gap:12px;margin-bottom:20px}.mark{width:44px;height:44px;border-radius:10px;background:linear-gradient(135deg,#d41a32,#8d0b1a);display:grid;place-items:center;color:#fff;font-weight:950;font-size:24px}.brand strong{display:block}.brand span{font-size:10px;color:var(--muted)}.card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 28px rgba(18,24,33,.07);overflow:hidden}.head{padding:24px;background:linear-gradient(135deg,#fff,#fff7f8);border-bottom:1px solid var(--line)}.eyebrow{font-size:10px;color:var(--red);font-weight:900;text-transform:uppercase;letter-spacing:.1em}.head h1{margin:6px 0;font-size:27px}.meta{color:var(--muted);font-size:10px}.body{padding:22px}.instruction{white-space:pre-wrap;line-height:1.65;font-size:12px;color:#344054}.notice{padding:18px;text-align:center;color:var(--muted)}.read{margin-top:16px;padding:10px 12px;border-radius:9px;background:#f8fafb;color:#667085;font-size:9px;border:1px solid #e4e7eb}@media(max-width:650px){.wrap{margin:18px auto}}</style></head><body><main class="wrap"><div class="brand"><div class="mark">R</div><div><strong>Rapid Response Training Academy</strong><span>Joining Instructions</span></div></div><section class="card"><div class="head"><div class="eyebrow">Confirmed Training</div><h1 id="subject">Joining Instructions</h1><div class="meta" id="meta">Loading…</div></div><div class="body" id="body"><div class="notice">Loading your joining instructions…</div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=window.supabase.createClient('https://qgbpotjqggeodxqcwkgj.supabase.co','sb_publishable_J1yPM1Hi7INCX2m7rp3PdA_JdQ46FRS');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const fmt=d=>d?new Date(d+'T00:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}):'—';async function load(){const bookingId=new URLSearchParams(location.search).get('booking');const u=await db.auth.getUser();if(!u.data?.user){location.href='trainer.html';return}if(!bookingId){body.innerHTML='<div class="notice">Booking reference is missing.</div>';return}const bk=await db.from('bookings').select('id,booking_reference,course_title,start_date,location').eq('id',bookingId).single();if(bk.error){body.innerHTML='<div class="notice">These joining instructions are not available to this account.</div>';return}const dr=await db.from('booking_joining_instruction_drafts').select('rendered_subject,rendered_body,approved_at').eq('booking_id',bookingId).eq('status','approved').order('approved_at',{ascending:false}).limit(1).maybeSingle();subject.textContent=dr.data?.rendered_subject||`${bk.data.course_title||'Training'} – Joining Instructions`;meta.textContent=`${bk.data.booking_reference||''}${bk.data.start_date?' · '+fmt(bk.data.start_date):''}${bk.data.location?' · '+bk.data.location:''}`;if(!dr.data?.rendered_body){body.innerHTML='<div class="notice">The Training Academy has confirmed the booking, but the final joining-instruction document has not yet been approved. Please check again or contact the Training Academy.</div>';return}body.innerHTML=`<div class="instruction">${esc(dr.data.rendered_body)}</div><div class="read">This view is linked to the training request audit trail. The Training Academy can see when the joining instructions have been opened.</div>`}load().catch(e=>body.innerHTML=`<div class="notice">${esc(e.message||'Unable to load joining instructions.')}</div>`);</script></body></html>
