<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Joining Instructions | RRTA</title><style>:root{--red:#b20f22;--ink:#18202a;--muted:#6f7a88;--line:#e2e6ea;--bg:#f4f6f8}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,Arial,sans-serif;color:var(--ink)}.wrap{max-width:900px;margin:36px auto;padding:0 18px}.brand{display:flex;align-items:center;gap:12px;margin-bottom:20px}.mark{width:44px;height:44px;border-radius:10px;background:linear-gradient(135deg,#d41a32,#8d0b1a);display:grid;place-items:center;color:#fff;font-weight:950;font-size:24px}.brand strong{display:block}.brand span{font-size:10px;color:var(--muted)}.card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 28px rgba(18,24,33,.07);overflow:hidden}.head{padding:24px;background:linear-gradient(135deg,#fff,#fff7f8);border-bottom:1px solid var(--line)}.eyebrow{font-size:10px;color:var(--red);font-weight:900;text-transform:uppercase;letter-spacing:.1em}.head h1{margin:6px 0;font-size:27px}.meta{color:var(--muted);font-size:10px}.body{padding:22px}.instruction{white-space:pre-wrap;line-height:1.65;font-size:12px;color:#344054}.notice{padding:18px;text-align:center;color:var(--muted)}.read{margin-top:16px;padding:10px 12px;border-radius:9px;background:#f8fafb;color:#667085;font-size:9px;border:1px solid #e4e7eb}.ackbox{margin-top:18px;padding:16px;border:1px solid #e3c6ca;border-radius:12px;background:#fff8f9}.ackbox h3{margin:0 0 5px;font-size:15px}.ackbox p{margin:0 0 12px;color:#667085;font-size:10px;line-height:1.45}.ackbtn{border:0;background:#b20f22;color:#fff;border-radius:9px;padding:10px 14px;font:inherit;font-size:10px;font-weight:900;cursor:pointer}.ackdone{display:inline-flex;padding:7px 10px;border-radius:999px;background:#e7f6ec;color:#176b37;font-size:10px;font-weight:900}@media(max-width:650px){.wrap{margin:18px auto}}</style></head><body><main class="wrap"><div class="brand"><div class="mark">R</div><div><strong>Rapid Response Training Academy</strong><span>Joining Instructions</span></div></div><section class="card"><div class="head"><div class="eyebrow">Training Booking</div><h1 id="subject">Joining Instructions</h1><div class="meta" id="meta">Loading…</div></div><div class="body" id="body"><div class="notice">Loading your joining instructions…</div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=window.supabase.createClient('https://qgbpotjqggeodxqcwkgj.supabase.co','sb_publishable_J1yPM1Hi7INCX2m7rp3PdA_JdQ46FRS');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const fmt=d=>d?new Date(d+'T00:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}):'—';let bookingId,userId,attendee,isOwn=false;async function load(){bookingId=new URLSearchParams(location.search).get('booking');const u=await db.auth.getUser();if(!u.data?.user){location.href='trainer.html';return}userId=u.data.user.id;if(!bookingId){body.innerHTML='<div class="notice">Booking reference is missing.</div>';return}const bk=await db.from('bookings').select('id,booking_reference,course_title,start_date,location,status').eq('id',bookingId).single();if(bk.error){body.innerHTML='<div class="notice">These joining instructions are not available to this account.</div>';return}const at=await db.from('booking_attendees').select('id,profile_id,attendee_name,booking_status,joining_instructions_sent_at,joining_instructions_viewed_at,joining_instructions_acknowledged_at').eq('booking_id',bookingId);if(at.error||!at.data?.length){body.innerHTML='<div class="notice">No delegate record is available for this booking.</div>';return}attendee=at.data.find(x=>x.profile_id===userId)||at.data[0];isOwn=attendee.profile_id===userId;if(isOwn&&attendee.joining_instructions_sent_at&&!attendee.joining_instructions_viewed_at){await db.rpc('mark_joining_instructions_viewed',{p_booking_id:bookingId});attendee.joining_instructions_viewed_at=new Date().toISOString()}const dr=await db.from('booking_joining_instruction_drafts').select('rendered_subject,rendered_body,approved_at').eq('booking_id',bookingId).eq('attendee_id',attendee.id).eq('status','approved').order('approved_at',{ascending:false}).limit(1).maybeSingle();subject.textContent=dr.data?.rendered_subject||`${bk.data.course_title||'Training'} – Joining Instructions`;meta.textContent=`${attendee.attendee_name||''}${bk.data.booking_reference?' · '+bk.data.booking_reference:''}${bk.data.start_date?' · '+fmt(bk.data.start_date):''}${bk.data.location?' · '+bk.data.location:''}`;if(!dr.data?.rendered_body){body.innerHTML='<div class="notice">The Training Academy has reserved your place, but the final joining instructions have not yet been approved. Please check again or contact the Training Academy.</div>';return}const ack=attendee.joining_instructions_acknowledged_at;body.innerHTML=`<div class="instruction">${esc(dr.data.rendered_body)}</div><div class="read">The Training Academy records when joining instructions are opened and acknowledged so that attendance arrangements are clear.</div>${isOwn?`<div class="ackbox"><h3>Confirm you have received these instructions</h3><p>By acknowledging, you confirm that you have read the joining instructions and understand the date, venue and attendance information.</p>${ack?`<span class="ackdone">✓ Acknowledged ${new Date(ack).toLocaleString('en-GB')}</span>`:'<button class="ackbtn" id="ackBtn">Acknowledge Joining Instructions</button>'}</div>`:`<div class="ackbox"><h3>Delegate acknowledgement</h3><p>${ack?'The operative has acknowledged these joining instructions.':'The operative has not yet acknowledged these joining instructions.'}</p>${ack?`<span class="ackdone">✓ Acknowledged ${new Date(ack).toLocaleString('en-GB')}</span>`:''}</div>`}`;document.getElementById('ackBtn')?.addEventListener('click',acknowledge)}async function acknowledge(){const b=document.getElementById('ackBtn');b.disabled=true;b.textContent='Saving…';const r=await db.rpc('acknowledge_joining_instructions',{p_booking_id:bookingId});if(r.error){b.disabled=false;b.textContent='Acknowledge Joining Instructions';alert(r.error.message);return}if(attendee?.source_training_request_id){}location.reload()}load().catch(e=>body.innerHTML=`<div class="notice">${esc(e.message||'Unable to load joining instructions.')}</div>`);</script></body></html>
