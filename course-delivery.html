<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Course Delivery | RRTA</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="portal-navigation.css"><style>body{margin:0;background:#f4f6f8}.shell{display:grid;grid-template-columns:258px 1fr;min-height:100vh}.side{background:linear-gradient(180deg,#151a22,#1e2530);padding:16px 12px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}.brand img{width:158px;filter:brightness(0) invert(1)}.brand{padding:5px 10px 16px;border-bottom:1px solid rgba(255,255,255,.08)}.spacer{flex:1}.main{min-width:0}.top{height:66px;background:#fff;border-bottom:1px solid #e2e6ea;display:flex;align-items:center;padding:0 28px;justify-content:space-between}.content{padding:26px 30px 60px}.head{margin-bottom:18px}.head h1{margin:5px 0}.grid{display:grid;gap:12px}.card{background:#fff;border:1px solid #e2e6ea;border-radius:14px;padding:18px;display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center}.meta{color:#667085;font-size:11px;margin-top:5px}.actions{display:flex;gap:8px}.muted{color:#667085}@media(max-width:1000px){.shell{grid-template-columns:1fr}.side{height:auto;position:relative}}@media(max-width:650px){.card{grid-template-columns:1fr}.content{padding:20px 14px}}</style></head><body data-portal-nav="academy"><div class="shell"><aside class="side"><div class="brand"><img src="rrta-logo.png" alt="RRTA"></div><div class="spacer"></div></aside><main class="main"><header class="top"><strong>RRTA Training Academy Administration</strong><span class="muted">Course Delivery</span></header><div class="content"><div class="head"><div class="eyebrow">Training Operations</div><h1>Course Delivery</h1><p class="muted">Open upcoming courses, manage delegates and move from booking through delivery and achievement.</p></div><div id="list" class="grid"><div class="card">Loading upcoming delivery…</div></div></div></main></div><script src="portal-navigation.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=window.supabase.createClient('https://qgbpotjqggeodxqcwkgj.supabase.co','sb_publishable_J1yPM1Hi7INCX2m7rp3PdA_JdQ46FRS');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const fmt=d=>d?new Date(d+'T00:00:00').toLocaleDateString('en-GB'):'—';async function load(){const{data:u}=await db.auth.getUser();if(!u?.user)return location.href='trainer.html';const today=new Date().toISOString().slice(0,10);const [s,b]=await Promise.all([db.from('training_schedule').select('*').gte('start_date',today).order('start_date').limit(30),db.from('bookings').select('id,schedule_id,booking_reference,delegate_count,status')]);const rows=s.data||[],bookings=b.data||[];list.innerHTML=rows.map(r=>{const linked=bookings.filter(x=>String(x.schedule_id)===String(r.id)&&x.status!=='cancelled'),delegates=linked.reduce((n,x)=>n+Number(x.delegate_count||0),0);return `<article class="card"><div><div class="eyebrow">${fmt(r.start_date)}</div><h2 style="margin:5px 0">${esc(r.course_title||'Scheduled Course')}</h2><div class="meta">${esc(r.venue||'Venue TBC')} · ${esc(r.trainer_name||'Trainer TBC')} · ${delegates}${r.max_places?' / '+r.max_places:''} booked</div></div><div class="actions"><a class="btn secondary" href="training-schedule.html">Schedule</a><a class="btn dark" href="booked-courses.html">Manage Booking</a></div></article>`}).join('')||'<div class="card">No upcoming courses are scheduled.</div>'}load();</script></body></html>
