<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Learner Profile | RRTA</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="portal-navigation.css"><style>body{background:#f3f5f6}.shell{display:grid;grid-template-columns:258px minmax(0,1fr);min-height:100vh}.side{position:sticky;top:0;height:100vh}.main{padding:28px 34px 60px;min-width:0}.panel{background:#fff;border:1px solid #d9dee5;border-radius:12px;padding:18px;margin-bottom:16px}.head{grid-template-columns:150px 1fr 170px!important;padding:6px 0}.photo{width:130px!important;height:150px!important}.head h1{font-size:34px!important}.head:after{width:150px;height:150px;box-sizing:border-box;padding:44px 10px!important}.tabs{margin:20px 0!important}.grid{grid-template-columns:repeat(3,minmax(0,1fr))!important}.kv{background:#fafbfc;padding:14px!important}.main{max-width:none;margin:0}.profile-shell{max-width:1440px;margin:0 auto;padding:28px 24px 56px}.profile-topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.profile-hero{display:grid;grid-template-columns:150px 1fr 170px;gap:24px;align-items:center;background:#fff;border:1px solid #d9dee5;border-radius:14px;padding:24px}.photo-wrap{position:relative;width:130px;height:150px}.photo-slot{width:130px;height:150px;border:2px dashed #c7cdd6;border-radius:12px;background:#f7f8fa;display:flex;align-items:center;justify-content:center;overflow:hidden}.photo-slot img{width:100%;height:100%;object-fit:cover}.photo-upload-btn{position:absolute;right:7px;bottom:7px;width:32px;height:32px;border:1px solid #d8dde4;border-radius:8px;background:#fff;cursor:pointer}.profile-name h1{margin:4px 0 6px;font-size:34px}.profile-meta{display:flex;flex-wrap:wrap;gap:8px 16px;color:#667085}.profile-meta strong{color:#1e293b}.status-pill{display:inline-flex;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:800;background:#e9f7ee;color:#176b37}.qr-slot{width:150px;height:150px;border:2px dashed #c7cdd6;border-radius:12px;background:#f7f8fa;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#687180;padding:12px}.qr-shape{width:64px;height:64px;background:repeating-linear-gradient(45deg,#252b31 0 5px,#fff 5px 10px);border:8px solid #fff;box-shadow:0 0 0 1px #c7cdd6;margin-bottom:8px}.profile-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.metric{background:#fff;border:1px solid #d9dee5;border-radius:12px;padding:18px}.metric span{display:block;color:#667085;font-size:13px;margin-bottom:7px}.metric strong{font-size:26px}.two-col{display:grid;grid-template-columns:1.2fr .8fr;gap:16px;margin-top:16px}.panel-card{background:#fff;border:1px solid #d9dee5;border-radius:12px;padding:20px}.panel-head-row{display:flex;justify-content:space-between;align-items:center}.detail-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.detail{background:#fafbfc;border:1px solid #e2e6ea;border-radius:9px;padding:14px}.detail span{display:block;color:#667085;font-size:12px;margin-bottom:4px}.empty{padding:28px;text-align:center;color:#667085;border:1px dashed #d5d9df;border-radius:10px;background:#fafbfc}.hidden{display:none!important}.head{display:grid;grid-template-columns:130px 1fr 150px;gap:22px;align-items:center}.head:after{content:'QR Code\A Learner ID / verification';white-space:pre;text-align:center;padding:42px 10px;border:2px dashed #c7cdd6;border-radius:12px;background:#f7f8fa;color:#687180;font-weight:700}.photo{width:126px;height:150px;border:1px dashed #bdc5cf;border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#f8fafb}.photo img{width:100%;height:100%;object-fit:cover}.muted{color:#667085}.badges{display:flex;gap:8px;flex-wrap:wrap}.badge{display:inline-flex;padding:5px 8px;border-radius:999px;font-size:11px;font-weight:800;background:#eef1f4}.badge.live{background:#e7f6ec;color:#176b37}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.tab{border:1px solid #cfd5dd;background:#fff;border-radius:8px;padding:9px 13px;font-weight:800;cursor:pointer}.tab.active{background:#252b31;color:#fff}.tabpane{display:none}.tabpane.active{display:block}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.kv{border:1px solid #e2e6ea;border-radius:9px;padding:12px}.kv span{display:block;color:#667085;font-size:11px;text-transform:uppercase;margin-bottom:4px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px 9px;border-bottom:1px solid #e6e9ed;text-align:left;font-size:13px}.table th{font-size:11px;color:#667085;text-transform:uppercase}.upload{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.upload label{font-size:12px;font-weight:800}.upload input,.upload select,.upload textarea{width:100%;margin-top:5px;padding:9px;border:1px solid #cfd5dd;border-radius:8px;font:inherit}.full{grid-column:1/-1}.doc{display:flex;justify-content:space-between;gap:12px;padding:11px;border:1px solid #e2e6ea;border-radius:9px;margin-top:8px;background:#fafbfc}.actions{display:flex;gap:7px;flex-wrap:wrap}.small{border:1px solid #cfd5dd;background:#fff;border-radius:7px;padding:7px 9px;font-weight:750;cursor:pointer}.dark{background:#252b31;color:#fff;border-color:#252b31}.notice{padding:12px;border:1px dashed #cfd5dd;border-radius:9px;background:#fafbfc;color:#667085;font-size:13px}@media(max-width:900px){.shell{grid-template-columns:1fr}.side{position:relative;height:auto}.main{padding:22px}.head{grid-template-columns:1fr}.grid,.upload{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body data-portal-nav="academy"><div class="shell"><aside class="side portal-side"></aside><main class="main"><div class="profile-shell"><div id="app"><section class="panel"><p class="muted">Loading learner…</p></section></div></div></main></div><script src="portal-navigation.js?v=20260917-7"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><script>const db=window.supabase.createClient('https://qgbpotjqggeodxqcwkgj.supabase.co','sb_publishable_J1yPM1Hi7INCX2m7rp3PdA_JdQ46FRS');const id=new URLSearchParams(location.search).get('id');let learner=null,docs=[],history=[],user=null;const ref=document.referrer||'';const backHref=ref.includes('booked-courses.html')?'booked-courses.html':ref.includes('training-schedule.html')?'training-schedule.html':'training-schedule.html';const backLabel=backHref.includes('booked-courses')?'Back to Confirmed Bookings':'Back to Training Schedule';const esc=(v='')=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const fmt=d=>d?new Date(d+'T00:00:00').toLocaleDateString('en-GB'):'—';async function requireTrainer(){const{data:u,error}=await db.auth.getUser();if(error||!u?.user)throw Error('Please sign in through the Trainer Portal.');user=u.user;const{data:p}=await db.rpc('get_current_profile');const x=Array.isArray(p)?p[0]:p;if(!x||String(x.role).toLowerCase()!=='trainer')throw Error('Trainer access is required.')}async function signed(path){const{data,error}=await db.storage.from('external-delegate-files').createSignedUrl(path,300);if(error)throw error;return data.signedUrl}async function load(){if(!id)throw Error('No learner selected.');await requireTrainer();const[l,d,h]=await Promise.all([db.from('external_delegates').select('*').eq('id',id).single(),db.from('external_delegate_documents').select('*').eq('external_delegate_id',id).order('created_at',{ascending:false}),db.from('booking_attendees').select('id,attendance_status,outcome,booking_id,bookings(booking_reference,course_title,start_date,end_date,location,status)').eq('external_delegate_id',id).order('created_at',{ascending:false})]);if(l.error)throw l.error;if(d.error)throw d.error;if(h.error)throw h.error;learner=l.data;docs=d.data||[];history=h.data||[];render()}function statusFor(h){const o=String(h.outcome||'').toLowerCase(),a=String(h.attendance_status||'').toLowerCase();if(['achieved','passed','completed','competent'].includes(o))return 'Achieved';if(o==='failed')return 'Failed';if(['in_progress','attending'].includes(a))return 'In progress';if(a==='no_show')return 'No show';if(a==='cancelled')return 'Cancelled';const bs=String(h.bookings?.status||'').toLowerCase();if(bs==='completed')return 'Completed / outcome not recorded';return 'Booked'}async function photoHtml(){if(!learner.photo_path)return '<span class="muted">No photo</span>';try{return `<img src="${await signed(learner.photo_path)}" alt="Profile photo">`}catch{return '<span class="muted">Photo unavailable</span>'}}async function render(){const photo=await photoHtml();document.title=`${learner.full_name} | RRTA Learner Profile`;document.getElementById('app').innerHTML=`
<div class="profile-topbar"><div><div class="eyebrow">Learner record</div><a class="text-btn" href="${backHref}">← ${backLabel}</a></div></div>
<section class="profile-hero">
<div class="photo-wrap"><div class="photo-slot" id="photoBox">${photo}</div><button class="photo-upload-btn" id="photoBtn" title="Upload photo" aria-label="Upload photo">↑</button><input id="photoFile" type="file" accept="image/*" class="hidden"></div>
<div class="profile-name"><div><span class="status-pill">${learner.active===false?'Archived':'Active'}</span></div><h1>${esc(learner.full_name)}</h1><div class="profile-meta"><span><strong>Employee:</strong> —</span><span><strong>Organisation:</strong> ${esc(learner.company_name||'—')}</span><span><strong>Job title:</strong> External Learner</span><span><strong>Email:</strong> ${esc(learner.email||'—')}</span></div></div>
<div class="qr-slot" id="learnerQr"><div class="qr-shape" aria-hidden="true"></div><strong>QR Code</strong></div>
</section>
<nav class="tabs" aria-label="Learner profile sections"><button class="tab active" data-tab="overview">Overview</button><button class="tab" data-tab="booked">Booked Courses</button><button class="tab" data-tab="identification">Compliance</button><button class="tab" data-tab="certificates">Accreditations & Certificates</button><button class="tab" data-tab="smartawards">Smart Awards</button><button class="tab" data-tab="documents">Documents</button><button class="tab" data-tab="notes">Notes</button><button class="tab" data-tab="training">History</button></nav>
<section id="overview" class="tabpane active"><div class="profile-grid"><div class="metric"><span>Upcoming Bookings</span><strong>${history.filter(h=>statusFor(h)==='Booked').length}</strong></div><div class="metric"><span>Assigned Learning</span><strong>0</strong></div><div class="metric"><span>Completed Assessments</span><strong>${history.filter(h=>statusFor(h)==='Achieved').length}</strong></div><div class="metric"><span>Accreditations</span><strong>${docs.filter(d=>d.document_type==='certificate').length}</strong></div></div><div class="two-col"><article class="panel-card"><div class="panel-head-row"><h2>Personal / Employment Details</h2><button class="btn secondary small" id="editDetailsBtn">Edit Profile</button></div><div class="detail-grid"><div class="detail"><span>Forename</span><strong>${esc(learner.forename||'—')}</strong></div><div class="detail"><span>Surname</span><strong>${esc(learner.surname||'—')}</strong></div><div class="detail"><span>System access</span><strong>External Learner</strong></div><div class="detail"><span>Email</span><strong>${esc(learner.email||'—')}</strong></div><div class="detail"><span>Employee number</span><strong>—</strong></div><div class="detail"><span>Date of birth</span><strong>${fmt(learner.date_of_birth)}</strong></div><div class="detail"><span>Job title</span><strong>External Learner</strong></div><div class="detail"><span>Organisation</span><strong>${esc(learner.company_name||'—')}</strong></div><div class="detail"><span>Account status</span><strong>${learner.active===false?'archived':'active'}</strong></div><div class="detail"><span>Learner ID</span><strong>${esc(learner.id)}</strong></div></div></article><article class="panel-card"><h2>Compliance snapshot</h2><div class="record-list"><div class="empty">Compliance information will appear here as accreditations and course outcomes are recorded.</div></div></article></div></section>
<section id="booked" class="panel-card tabpane"><h2>Booked Courses</h2><div class="empty">Current and upcoming course bookings for this learner will appear here.</div></section><section id="smartawards" class="panel-card tabpane"><h2>Smart Awards</h2><div class="empty">Smart Awards functions are available on the standard profile and can remain unused until required.</div></section><section id="notes" class="panel-card tabpane"><h2>Notes</h2><div class="empty">Learner notes and audit information will appear here.</div></section><section id="training" class="panel-card tabpane"><h2>Training record</h2>${history.length?`<table class="table"><thead><tr><th>Course</th><th>Date</th><th>Location</th><th>Booking</th><th>Status</th></tr></thead><tbody>${history.map(h=>{const b=h.bookings||{};return `<tr><td><strong>${esc(b.course_title||'Course')}</strong></td><td>${fmt(b.start_date)}</td><td>${esc(b.location||'—')}</td><td>${esc(b.booking_reference||'—')}</td><td><span class="badge">${statusFor(h)}</span></td></tr>`}).join('')}</tbody></table>`:'<div class="empty">No training history recorded yet.</div>'}</section>
${docSection('certificates','Accreditations & Certificates','certificate','Record accreditation and certificate evidence for this learner.','Accreditation / certificate title')}
${docSection('identification','Compliance','identification','Store identification and compliance evidence where required.','Compliance document title')}
${docSection('documents','Documents','other','Store evidence, cards, competency documents and supporting files.','Document title')}`;bind();renderQr();document.getElementById('editDetailsBtn').onclick=()=>document.getElementById('externalEditDetailsBtn')?.click()}function renderQr(){const el=document.getElementById('learnerQr');if(!el||!window.QRCode)return;el.innerHTML='';new QRCode(el,{text:`${location.origin}/external-learner-profile.html?id=${encodeURIComponent(learner.id)}`,width:118,height:118,correctLevel:QRCode.CorrectLevel.M})}function docSection(id,title,type,help,placeholder){const list=docs.filter(d=>d.document_type===type);return `<section id="${id}" class="panel tabpane"><h2>${title}</h2><p class="muted">${help}</p><div>${list.length?list.map(d=>`<div class="doc"><div><strong>${esc(d.title)}</strong><div class="muted">${d.course_title?esc(d.course_title)+' · ':''}${d.issue_date?'Issued '+fmt(d.issue_date):''}${d.expiry_date?' · Expires '+fmt(d.expiry_date):''}</div></div><div class="actions"><button class="small" data-view-doc="${d.id}">View / download</button><button class="small" data-delete-doc="${d.id}">Delete</button></div></div>`).join(''):'<p class="muted">Nothing uploaded yet.</p>'}</div><div class="upload"><label>Title<input id="title-${type}" placeholder="${placeholder}"></label><label>Course / reference<input id="course-${type}" placeholder="Optional"></label><label>Issue date<input id="issue-${type}" type="date"></label><label>Expiry date<input id="expiry-${type}" type="date"></label><label class="full">File<input id="file-${type}" type="file" accept="application/pdf,image/*,.doc,.docx"></label></div><button class="btn dark" style="margin-top:10px" data-upload-type="${type}">Upload ${type==='certificate'?'certificate':'document'}</button></section>`}function bind(){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.tabpane').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.tab).classList.add('active')});document.querySelectorAll('[data-upload-type]').forEach(b=>b.onclick=()=>uploadDoc(b.dataset.uploadType));document.querySelectorAll('[data-view-doc]').forEach(b=>b.onclick=()=>viewDoc(b.dataset.viewDoc));document.querySelectorAll('[data-delete-doc]').forEach(b=>b.onclick=()=>deleteDoc(b.dataset.deleteDoc));photoBtn.onclick=()=>photoFile.click();photoFile.onchange=uploadPhoto}async function uploadPhoto(){const f=photoFile.files?.[0];if(!f)return;const safe=f.name.replace(/[^a-zA-Z0-9._-]+/g,'_');const path=`${learner.id}/photos/${Date.now()}-${safe}`;const{error}=await db.storage.from('external-delegate-files').upload(path,f);if(error)return alert(error.message);const{error:u}=await db.from('external_delegates').update({photo_path:path,updated_at:new Date().toISOString()}).eq('id',learner.id);if(u)return alert(u.message);learner.photo_path=path;await render()}async function uploadDoc(type){const f=document.getElementById('file-'+type).files?.[0],title=document.getElementById('title-'+type).value.trim();if(!f||!title)return alert('Add a title and choose a file.');const safe=f.name.replace(/[^a-zA-Z0-9._-]+/g,'_');const path=`${learner.id}/${type}/${Date.now()}-${safe}`;const{error}=await db.storage.from('external-delegate-files').upload(path,f);if(error)return alert(error.message);const payload={external_delegate_id:learner.id,document_type:type,title,file_path:path,course_title:document.getElementById('course-'+type).value.trim()||null,issue_date:document.getElementById('issue-'+type).value||null,expiry_date:document.getElementById('expiry-'+type).value||null,created_by:user.id};const{data,error:ie}=await db.from('external_delegate_documents').insert(payload).select('*').single();if(ie)return alert(ie.message);docs.unshift(data);await render();document.querySelector(`[data-tab="${type==='certificate'?'certificates':type==='identification'?'identification':'documents'}"]`)?.click()}async function viewDoc(docId){const d=docs.find(x=>x.id===docId);if(!d)return;try{window.open(await signed(d.file_path),'_blank','noopener')}catch(e){alert(e.message)}}async function deleteDoc(docId){const d=docs.find(x=>x.id===docId);if(!d||!confirm('Delete this document?'))return;await db.storage.from('external-delegate-files').remove([d.file_path]);const{error}=await db.from('external_delegate_documents').delete().eq('id',docId);if(error)return alert(error.message);docs=docs.filter(x=>x.id!==docId);await render()}load().catch(e=>{document.getElementById('app').innerHTML=`<section class="panel"><div class="error">${esc(e.message||'Unable to load external learner.')}</div></section>`});</script><script src="external-learner-edit.js?v=20260917-2"></script></body></html>
