<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>External Learner Profile | RRTA</title><link rel="stylesheet" href="styles.css"><style>body{background:#f3f5f6}.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{background:#252b31;color:#fff;padding:28px 14px}.side img{width:110px;margin:0 8px 24px}.side a{display:block;color:#fff;text-decoration:none;padding:10px 12px;border-radius:8px;margin:2px 0}.side a:hover,.side a.active{background:#3a4148}.subwrap{margin-left:18px;padding-left:10px;border-left:1px solid #4a5158}.subwrap a{font-size:13px;padding:8px 10px}.main{padding:28px 34px 60px}.panel{background:#fff;border:1px solid #d9dee5;border-radius:12px;padding:18px;margin-bottom:16px}.head{display:grid;grid-template-columns:130px 1fr auto;gap:22px;align-items:center}.photo{width:126px;height:150px;border:1px dashed #bdc5cf;border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#f8fafb}.photo img{width:100%;height:100%;object-fit:cover}.muted{color:#667085}.badges{display:flex;gap:8px;flex-wrap:wrap}.badge{display:inline-flex;padding:5px 8px;border-radius:999px;font-size:11px;font-weight:800;background:#eef1f4}.badge.live{background:#e7f6ec;color:#176b37}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.tab{border:1px solid #cfd5dd;background:#fff;border-radius:8px;padding:9px 13px;font-weight:800;cursor:pointer}.tab.active{background:#252b31;color:#fff}.tabpane{display:none}.tabpane.active{display:block}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.kv{border:1px solid #e2e6ea;border-radius:9px;padding:12px}.kv span{display:block;color:#667085;font-size:11px;text-transform:uppercase;margin-bottom:4px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px 9px;border-bottom:1px solid #e6e9ed;text-align:left;font-size:13px}.table th{font-size:11px;color:#667085;text-transform:uppercase}.upload{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.upload label{font-size:12px;font-weight:800}.upload input,.upload select,.upload textarea{width:100%;margin-top:5px;padding:9px;border:1px solid #cfd5dd;border-radius:8px;font:inherit}.full{grid-column:1/-1}.doc{display:flex;justify-content:space-between;gap:12px;padding:11px;border:1px solid #e2e6ea;border-radius:9px;margin-top:8px;background:#fafbfc}.actions{display:flex;gap:7px;flex-wrap:wrap}.small{border:1px solid #cfd5dd;background:#fff;border-radius:7px;padding:7px 9px;font-weight:750;cursor:pointer}.dark{background:#252b31;color:#fff;border-color:#252b31}.notice{padding:12px;border:1px dashed #cfd5dd;border-radius:9px;background:#fafbfc;color:#667085;font-size:13px}@media(max-width:900px){.shell{grid-template-columns:1fr}.side{display:none}.main{padding:22px}.head{grid-template-columns:1fr}.grid,.upload{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><div class="shell"><aside class="side"><img src="rrta-logo.png" alt="RRTA"><a href="trainer.html">Overview</a><a href="trainer.html#learners">Manage learners</a><a href="trainer.html#courses">Courses</a><a href="training-schedule.html">Bookings Management</a><div class="subwrap"><a href="training-schedule.html">Training Schedule</a><a href="booked-courses.html">Booked Courses</a><a class="active" href="external-customers.html">External Customers</a></div><a href="compliance-operatives.html">Compliance</a></aside><main class="main"><a class="text-btn" href="external-customers.html">← Back to External Customers</a><div id="app" style="margin-top:12px"><section class="panel"><p class="muted">Loading external learner…</p></section></div></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=window.supabase.createClient('https://qgbpotjqggeodxqcwkgj.supabase.co','sb_publishable_J1yPM1Hi7INCX2m7rp3PdA_JdQ46FRS');const id=new URLSearchParams(location.search).get('id');let learner=null,docs=[],history=[],user=null;const esc=(v='')=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const fmt=d=>d?new Date(d+'T00:00:00').toLocaleDateString('en-GB'):'—';async function requireTrainer(){const{data:u,error}=await db.auth.getUser();if(error||!u?.user)throw Error('Please sign in through the Trainer Portal.');user=u.user;const{data:p}=await db.rpc('get_current_profile');const x=Array.isArray(p)?p[0]:p;if(!x||String(x.role).toLowerCase()!=='trainer')throw Error('Trainer access is required.')}async function signed(path){const{data,error}=await db.storage.from('external-delegate-files').createSignedUrl(path,300);if(error)throw error;return data.signedUrl}async function load(){if(!id)throw Error('No external learner selected.');await requireTrainer();const[l,d,h]=await Promise.all([db.from('external_delegates').select('*').eq('id',id).single(),db.from('external_delegate_documents').select('*').eq('external_delegate_id',id).order('created_at',{ascending:false}),db.from('booking_attendees').select('id,attendance_status,outcome,booking_id,bookings(booking_reference,course_title,start_date,end_date,location,status)').eq('external_delegate_id',id).order('created_at',{ascending:false})]);if(l.error)throw l.error;if(d.error)throw d.error;if(h.error)throw h.error;learner=l.data;docs=d.data||[];history=h.data||[];render()}function statusFor(h){const o=String(h.outcome||'').toLowerCase(),a=String(h.attendance_status||'').toLowerCase();if(['achieved','passed','completed','competent'].includes(o))return 'Achieved';if(['in_progress','attending'].includes(a))return 'In progress';if(a==='no_show')return 'No show';if(a==='cancelled')return 'Cancelled';return 'Booked'}async function photoHtml(){if(!learner.photo_path)return '<span class="muted">No photo</span>';try{return `<img src="${await signed(learner.photo_path)}" alt="Profile photo">`}catch{return '<span class="muted">Photo unavailable</span>'}}async function render(){const photo=await photoHtml();document.title=`${learner.full_name} | External Learner | RRTA`;document.getElementById('app').innerHTML=`<section class="panel"><div class="head"><div class="photo" id="photoBox">${photo}</div><div><div class="eyebrow">External learner record</div><h1 style="margin:5px 0">${esc(learner.full_name)}</h1><div class="badges"><span class="badge live">ACTIVE</span><span class="badge">External learner</span></div><p class="muted">${esc(learner.company_name||'No company linked')}${learner.email?' · '+esc(learner.email):''}${learner.phone?' · '+esc(learner.phone):''}</p></div><div><input id="photoFile" type="file" accept="image/*" style="display:none"><button class="btn secondary" id="photoBtn">Upload profile / card photo</button></div></div></section><div class="tabs"><button class="tab active" data-tab="overview">Overview</button><button class="tab" data-tab="training">Training history</button><button class="tab" data-tab="certificates">Certificates</button><button class="tab" data-tab="identification">Identification</button><button class="tab" data-tab="documents">Other documents</button></div><section id="overview" class="panel tabpane active"><h2>External learner details</h2><div class="grid"><div class="kv"><span>Forename</span><strong>${esc(learner.forename||'—')}</strong></div><div class="kv"><span>Surname</span><strong>${esc(learner.surname||'—')}</strong></div><div class="kv"><span>Date of birth</span><strong>${fmt(learner.date_of_birth)}</strong></div><div class="kv"><span>Company</span><strong>${esc(learner.company_name||'Not linked')}</strong></div><div class="kv"><span>Email</span><strong>${esc(learner.email||'—')}</strong></div><div class="kv"><span>Phone</span><strong>${esc(learner.phone||'—')}</strong></div></div><div class="notice" style="margin-top:14px">This is an RRTA administrative record for an external learner. Certificate, identity and card-order evidence is kept private and trainer-only.</div></section><section id="training" class="panel tabpane"><h2>RRTA training history</h2>${history.length?`<table class="table"><thead><tr><th>Course</th><th>Date</th><th>Location</th><th>Booking</th><th>Status</th></tr></thead><tbody>${history.map(h=>{const b=h.bookings||{};return `<tr><td><strong>${esc(b.course_title||'Course')}</strong></td><td>${fmt(b.start_date)}${b.end_date&&b.end_date!==b.start_date?' – '+fmt(b.end_date):''}</td><td>${esc(b.location||'—')}</td><td>${esc(b.booking_reference||'—')}</td><td><span class="badge ${statusFor(h)==='Achieved'?'live':''}">${statusFor(h)}</span></td></tr>`}).join('')}</tbody></table>`:'<p class="muted">No course history found.</p>'}</section>${docSection('certificates','Certificates','certificate','Upload completed certificates downloaded from Smart Awards or another awarding body.','Certificate title')}${docSection('identification','Identification documents','identification','Store identification evidence where a course requires proof of identity.','ID document title')}${docSection('documents','Other documents','other','Store any other supporting evidence needed for the learner.','Document title')}`;bind()}function docSection(id,title,type,help,placeholder){const list=docs.filter(d=>d.document_type===type);return `<section id="${id}" class="panel tabpane"><h2>${title}</h2><p class="muted">${help}</p><div>${list.length?list.map(d=>`<div class="doc"><div><strong>${esc(d.title)}</strong><div class="muted">${d.course_title?esc(d.course_title)+' · ':''}${d.issue_date?'Issued '+fmt(d.issue_date):''}${d.expiry_date?' · Expires '+fmt(d.expiry_date):''}</div></div><div class="actions"><button class="small" data-view-doc="${d.id}">View / download</button><button class="small" data-delete-doc="${d.id}">Delete</button></div></div>`).join(''):'<p class="muted">Nothing uploaded yet.</p>'}</div><div class="upload"><label>Title<input id="title-${type}" placeholder="${placeholder}"></label><label>Course / reference<input id="course-${type}" placeholder="Optional"></label><label>Issue date<input id="issue-${type}" type="date"></label><label>Expiry date<input id="expiry-${type}" type="date"></label><label class="full">File<input id="file-${type}" type="file" accept="application/pdf,image/*,.doc,.docx"></label></div><button class="btn dark" style="margin-top:10px" data-upload-type="${type}">Upload ${type==='certificate'?'certificate':'document'}</button></section>`}function bind(){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.tabpane').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.tab).classList.add('active')});document.querySelectorAll('[data-upload-type]').forEach(b=>b.onclick=()=>uploadDoc(b.dataset.uploadType));document.querySelectorAll('[data-view-doc]').forEach(b=>b.onclick=()=>viewDoc(b.dataset.viewDoc));document.querySelectorAll('[data-delete-doc]').forEach(b=>b.onclick=()=>deleteDoc(b.dataset.deleteDoc));photoBtn.onclick=()=>photoFile.click();photoFile.onchange=uploadPhoto}async function uploadPhoto(){const f=photoFile.files?.[0];if(!f)return;const safe=f.name.replace(/[^a-zA-Z0-9._-]+/g,'_');const path=`${learner.id}/photos/${Date.now()}-${safe}`;const{error}=await db.storage.from('external-delegate-files').upload(path,f);if(error)return alert(error.message);const{error:u}=await db.from('external_delegates').update({photo_path:path,updated_at:new Date().toISOString()}).eq('id',learner.id);if(u)return alert(u.message);learner.photo_path=path;await render()}async function uploadDoc(type){const f=document.getElementById('file-'+type).files?.[0],title=document.getElementById('title-'+type).value.trim();if(!f||!title)return alert('Add a title and choose a file.');const safe=f.name.replace(/[^a-zA-Z0-9._-]+/g,'_');const path=`${learner.id}/${type}/${Date.now()}-${safe}`;const{error}=await db.storage.from('external-delegate-files').upload(path,f);if(error)return alert(error.message);const payload={external_delegate_id:learner.id,document_type:type,title,file_path:path,course_title:document.getElementById('course-'+type).value.trim()||null,issue_date:document.getElementById('issue-'+type).value||null,expiry_date:document.getElementById('expiry-'+type).value||null,created_by:user.id};const{data,error:ie}=await db.from('external_delegate_documents').insert(payload).select('*').single();if(ie)return alert(ie.message);docs.unshift(data);await render();document.querySelector(`[data-tab="${type==='certificate'?'certificates':type==='identification'?'identification':'documents'}"]`)?.click()}async function viewDoc(docId){const d=docs.find(x=>x.id===docId);if(!d)return;try{window.open(await signed(d.file_path),'_blank','noopener')}catch(e){alert(e.message)}}async function deleteDoc(docId){const d=docs.find(x=>x.id===docId);if(!d||!confirm('Delete this document?'))return;await db.storage.from('external-delegate-files').remove([d.file_path]);const{error}=await db.from('external_delegate_documents').delete().eq('id',docId);if(error)return alert(error.message);docs=docs.filter(x=>x.id!==docId);await render()}load().catch(e=>{document.getElementById('app').innerHTML=`<section class="panel"><div class="error">${esc(e.message||'Unable to load external learner.')}</div></section>`});</script><script src="external-learner-edit.js"></script></body></html>
