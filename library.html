let pdfjsReady=null;function loadPdfJs(){if(window.pdfjsLib)return Promise.resolve(window.pdfjsLib);if(pdfjsReady)return pdfjsReady;pdfjsReady=new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js';s.onload=()=>{pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';res(pdfjsLib)};s.onerror=()=>rej(new Error('PDF preview unavailable'));document.head.appendChild(s)});return pdfjsReady}const db=supabase.createClient('https://qgbpotjqggeodxqcwkgj.supabase.co','sb_publishable_J1yPM1Hi7INCX2m7rp3PdA_JdQ46FRS');let docs=[],cats=[],discs=[],editing=null;

dfCovers(rows),0)}
async function renderPdfCovers(rows){for(const x of rows.filter(x=>x.cover_image_path)){const el=document.getElementById('cover-'+x.id);if(!el)continue;try{const {data,error}=await db.storage.from('library-documents').createSignedUrl(x.cover_image_path,300);if(error)throw error;el.innerHTML='<img src="'+data.signedUrl+'" alt="" style="width:100%;height:100%;object-fit:cover;display:block">'}catch(e){el.innerHTML='<div class="cover-fallback"><h3>'+esc(x.title)+'</h3><small>Cover unavailable</small></div>'}}const pdfRows=rows.filter(x=>!x.cover_image_path&&/\.pdf$/i.test(x.original_filename||x.file_path||''));if(!pdfRows.length)return;try{await loadPdfJs()}catch(e){return}for(const x of pdfRows){const el=document.getElementById('cover-'+x.id);if(!el)continue;try{const {data,error}=await db.storage.from('library-documents').createSignedUrl(x.file_path,300);if(error)throw error;const pdf=await pdfjsLib.getDocument(data.signedUrl).promise,page=await pdf.getPage(1),base=page.getViewport({scale:1}),scale=Math.min(2,Math.max(1.15,el.clientWidth/base.width)),viewport=page.getViewport({scale}),canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');canvas.width=viewport.width;canvas.height=viewport.height;el.innerHTML='';el.appendChild(canvas);await page.render({canvasContext:ctx,viewport}).promise}catch(e){el.innerHTML='<div class="cover-fallback"><span class="pdf">PDF</span><h3>'+esc(x.title)+'</h3><small>Preview unavailable</small></div>'}}}

window.editDoc=id=>{editing=docs.find(x=>x.id===id);formTitle.textContent='Edit / replace document';['title','source_organisation','category_id','version','document_date','review_date','description'].forEach(k=>form[k].value=editing[k]||'');form.published.checked=editing.published;const selected=new Set((editing.library_document_disciplines||[]).map(x=>x.discipline_id));checks.querySelectorAll('input').forEach(x=>x.checked=selected.has(x.value));file.value='';coverFile.value='';editor.showModal()};
