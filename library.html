t-size:12px;color:var(--muted);margin:7px 0}.tags{display:flex;flex-wrap:wrap;gap:5px}.tag{font-size:10px;background:#eef2f6;padding:5px 7px;border-radius:12px}.actions{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}.actions button{font-size:11px}.empty{background:#fff;border:1px dashed #cbd2d9;padding:50px;text-align:center;border-radius:12px;color:var(--muted)}dialog{border:0;border-radius:14px;padding:0;width:min(820px,94vw);height:min(760px,90vh);max-height:90vh;overflow:hidden;box-shadow:0 25px 80px #0004}dialog::backdrop{background:#1119}.modal{padding:0;height:100%;display:flex;flex-direction:column;overflow:hidden}.modal h2{flex:0 0 auto;background:#fff;padding:22px 24px 12px;margin:0}.formgrid{flex:1 1 auto;overflow-y:auto;padding:10px 24px 20px;align-content:start}.foot{flex:0 0 auto;background:#fff;border-top:1px solid var(--line);padding:14px 24px 18px;margin:0;z-index:3}.modal h2{margin-top:0}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.wide{grid-column:1/-1}.modal label{font-size:12px;font-weight:800;display:grid;gap:6px}.checks{display:flex;gap:8px;flex-wrap:wrap}.check{font-weight:600!important;display:flex!important;align-items:center;gap:5px!important;background:#f2f4f6;padding:7px;border-radius:8px}.check input{width:auto}.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.status{font-size:12px;color:var(--muted)}@media(max-width:800px){.shell{grid-template-columns:1fr}.side{display:none}.toolbar,.formgrid{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head>
<body data-portal-nav="academy" data-rrta-ui="standard"><div class="shell"><aside class="side"></aside><main class="main"><header class="top"><strong>Training Academy</strong><span class="status" id="status">Controlled Document Library</span></header><section class="content"><div class="head"><div><div class="eyebrow">Resources & controlled documents</div><h1>Library</h1><p>Manage HSE, Openreach PIA, RRT Health & Safety and technical resources.</p></div><button class="btn red" id="add">+ Add Document</button></div><div class="toolbar"><input id="search" placeholder="Search documents, source or discipline…"><select id="category"><option value="">All categories</option></select><select id="discipline"><option value="">All disciplines</option></select><select id="state"><option value="published">Published</option><option value="all">All documents</option><option value="draft">Unpublished</option><option value="archived">Archived</option></select></div><div id="grid" class="grid"></div></section></main></div>
<dialog id="editor"><form method="dialog" class="modal" id="form"><h2 id="formTitle">Add document</h2><div class="formgrid"><label class="wide">Document title<input name="title" required></label><label>Organisation / source<input name="source_organisation" placeholder="HSE, Openreach, Rapid Response Telecoms" required></label><label>Category<select name="category_id" required></select></label><label>Version / revision<input name="version" placeholder="e.g. v3 / Feb 2026"></label><label>Document date<input type="date" name="document_date"></label><label>Review date<input type="date" name="review_date"></label><label class="wide">Description<textarea name="description" rows="3"></textarea></label><label class="wide">Disciplines / tags<div id="checks" class="checks"></div></label><label class="wide">Document file (PDF or Word) — required when adding a new document<input id="file" type="file" accept=".pdf,.doc,.docx,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document"></label><label class="check wide"><input type="checkbox" name="published" checked> Publish to learners</label></div><div class="foot"><button class="btn light" value="cancel">Cancel</button><button class="btn red" id="save" value="default">Save Document</button></div></form></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
let pdfjsReady=null;function loadPdfJs(){if(window.pdfjsLib)return Promise.resolve(window.pdfjsLib);if(pdfjsReady)return pdfjsReady;pdfjsReady=new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js';s.onload=()=>{pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';res(pdfjsLib)};s.onerror=()=>rej(new Error('PDF preview unavailable'));document.head.appendChild(s)});return pdfjsReady}const db=supabase.createClient('https://qgbpotjqggeodxqcwkgj.supabase.co','sb_publishable_J1yPM1Hi7INCX2m7rp3PdA_JdQ46FRS');let docs=[],cats=[],discs=[],editing=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const slug=s=>s.toLowerCase().replace(/[^a-z0-9.]+/g,'-');
async function load(){status.textContent='Loading library…';const categoryFilter=document.getElementById('category'),disciplineFilter=document.getElementById('discipline'),formEl=document.getElementById('form'),checksEl=document.getElementById('checks');const [cr,dr,lr]=await Promise.all([db.from('library_categories').select('*').order('name'),db.from('library_disciplines').select('*').order('name'),db.from('library_documents').select('*,library_categories(name),library_document_disciplines(discipline_id,library_disciplines(name))').order('updated_at',{ascending:false})]);if(cr.error){status.textContent='Categories: '+cr.error.message;return}if(dr.error){status.textContent='Disciplines: '+dr.error.message;return}cats=cr.data||[];discs=dr.data||[];categoryFilter.innerHTML='<option value="">All categories</option>'+cats.map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join('');formEl.elements.category_id.innerHTML='<option value="">Select category</option>'+cats.map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join('');disciplineFilter.innerHTML='<option value="">All disciplines</option>'+discs.map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join('');checksEl.innerHTML=discs.map(x=>'<label class="check"><input type="checkbox" value="'+x.id+'">'+esc(x.name)+'</label>').join('');if(lr.error){docs=[];grid.innerHTML='<div class="empty">Could not load documents: '+esc(lr.error.message)+'</div>';status.textContent='Library setup loaded — document list error';return}docs=lr.data||[];render();status.textContent='Controlled Document Library'}
function render(){const q=search.value.toLowerCase(),cat=category.value,di=discipline.value,st=state.value;const rows=docs.filter(x=>{const tags=x.library_document_disciplines||[];const text=[x.title,x.description,x.source_organisation,x.library_categories?.name,...tags.map(t=>t.library_disciplines?.name)].join(' ').toLowerCase();return(!q||text.includes(q))&&(!cat||x.category_id===cat)&&(!di||tags.some(t=>t.discipline_id===di))&&(st==='all'||st==='published'&&x.published&&!x.archived_at||st==='draft'&&!x.published&&!x.archived_at||st==='archived'&&x.archived_at)});grid.innerHTML=rows.length?rows.map(x=>{const tags=(x.library_document_disciplines||[]).map(t=>t.library_disciplines?.name).filter(Boolean);const isPdf=/\.pdf$/i.test(x.original_filename||x.file_path||'');const cover=isPdf?'<div class="cover" id="cover-'+x.id+'"><span class="cover-loading">Loading preview…</span></div>':'<div class="cover"><div class="cover-fallback"><h3>'+esc(x.title)+'</h3><small>'+esc(x.library_categories?.name||'Document')+'</small></div></div>';return '<article class="card">'+cover+'<div class="body"><div class="source">'+esc(x.source_organisation)+'</div><div class="meta">'+esc(x.version||'Current version')+(x.document_date?' · '+new Date(x.document_date).toLocaleDateString('en-GB'):'')+(x.archived_at?' · ARCHIVED':!x.published?' · UNPUBLISHED':'')+'</div><div class="tags">'+tags.map(t=>'<span class="tag">'+esc(t)+'</span>').join('')+'</div><div class="actions"><button class="btn light" onclick="openDoc(\''+x.id+'\')">Open</button><button class="btn light" onclick="editDoc(\''+x.id+'\')">Edit / Replace</button><button class="btn light" onclick="archiveDoc(\''+x.id+'\')">'+(x.archived_at?'Restore':'Archive')+'</button><button class="btn light" onclick="deleteDoc(\''+x.id+'\')">Delete</button></div></div></article>'}).join(''):'<div class="empty">No documents match these filters. Use <b>+ Add Document</b> to start the library.</div>';setTimeout(()=>renderPdfCovers(rows),0)}
async function renderPdfCovers(rows){const pdfRows=rows.filter(x=>/\.pdf$/i.test(x.original_filename||x.file_path||''));if(!pdfRows.length)return;try{await loadPdfJs()}catch(e){return}for(const x of pdfRows){const el=document.getElementById('cover-'+x.id);if(!el)continue;try{const {data,error}=await db.storage.from('library-documents').createSignedUrl(x.file_path,300);if(error)throw error;const pdf=await pdfjsLib.getDocument(data.signedUrl).promise,page=await pdf.getPage(1),base=page.getViewport({scale:1}),scale=Math.min(2,Math.max(1.15,el.clientWidth/base.width)),viewport=page.getViewport({scale}),canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');canvas.width=viewport.width;canvas.height=viewport.height;el.innerHTML='';el.appendChild(canvas);await page.render({canvasContext:ctx,viewport}).promise}catch(e){el.innerHTML='<div class="cover-fallback"><span class="pdf">PDF</span><h3>'+esc(x.title)+'</h3><small>Preview unavailable</small></div>'}}}
[search,category,discipline,state].forEach(x=>x.oninput=render);
add.onclick=()=>{editing=null;form.reset();form.published.checked=true;formTitle.textContent='Add document';checks.querySelectorAll('input').forEach(x=>x.checked=false);editor.showModal()};
window.editDoc=id=>{editing=docs.find(x=>x.id===id);formTitle.textContent='Edit / replace document';['title','source_organisation','category_id','version','document_date','review_date','description'].forEach(k=>form[k].value=editing[k]||'');form.published.checked=editing.published;const selected=new Set((editing.library_document_disciplines||[]).map(x=>x.discipline_id));checks.querySelectorAll('input').forEach(x=>x.checked=selected.has(x.value));file.value='';editor.showModal()};
window.openDoc=async id=>{const x=docs.find(d=>d.id===id);const {data,error}=await db.storage.from('library-documents').createSignedUrl(x.file_path,300);if(error)return alert(error.message);window.open(data.signedUrl,'_blank')};
window.archiveDoc=async id=>{const x=docs.find(d=>d.id===id);const {error}=await db.from('library_documents').update({archived_at:x.archived_at?null:new Date().toISOString(),updated_at:new Date().toISOString()}).eq('id',id);if(error)return alert(error.message);load()};
window.deleteDoc=async id=>{const x=docs.find(d=>d.id===id);if(!confirm('Permanently delete “'+x.title+'”? This removes it from learner desktop and mobile too.'))return;await db.storage.from('library-documents').remove([x.file_path]);const {error}=await db.from('library_documents').delete().eq('id',id);if(error)return alert(error.message);load()};
save.onclick=async e=>{e.preventDefault();if(!form.reportValidity())return;const fd=new FormData(form),f=file.files[0];if(!editing&&!f)return alert('Please choose a PDF or Word document.');save.disabled=true;status.textContent='Saving…';try{let path=editing?.file_path;if(f){path=(editing?editing.id:crypto.randomUUID())+'/'+Date.now()+'-'+slug(f.name);const allowed=['application/pdf','application/msword','application/vnd.openxmlformats-officedocument.wordprocessingml.document'];if(!allowed.includes(f.type)&&!(/\.(pdf|doc|docx)$/i.test(f.name)))throw new Error('Please choose a PDF or Word document.');const up=await db.storage.from('library-documents').upload(path,f,{contentType:f.type||'application/octet-stream'});if(up.error)throw up.error}const payload={title:fd.get('title'),source_organisation:fd.get('source_organisation'),category_id:fd.get('category_id'),version:fd.get('version')||null,document_date:fd.get('document_date')||null,review_date:fd.get('review_date')||null,description:fd.get('description')||null,published:form.published.checked,file_path:path,original_filename:f?.name||editing?.original_filename,updated_at:new Date().toISOString()};let id=editing?.id;if(editing){const r=await db.from('library_documents').update(payload).eq('id',id);if(r.error)throw r.error;if(f&&editing.file_path!==path)await db.storage.from('library-documents').remove([editing.file_path])}else{const u=(await db.auth.getUser()).data.user;payload.created_by=u?.id||null;const r=await db.from('library_documents').insert(payload).select('id').single();if(r.error)throw r.error;id=r.data.id}await db.from('library_document_disciplines').delete().eq('document_id',id);const ds=[...checks.querySelectorAll('input:checked')].map(x=>({document_id:id,discipline_id:x.value}));if(ds.length){const r=await db.from('library_document_disciplines').insert(ds);if(r.error)throw r.error}editor.close();await load();status.textContent='Saved'}catch(err){alert(err.message);status.textContent='Save failed'}finally{save.disabled=false}};
load();</script><script src="portal-navigation.js"></script></body></html>
