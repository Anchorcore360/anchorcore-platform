<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manage Companies | RRTA</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="portal-navigation.css"><style>:root{--red:#b20f22;--ink:#18202a;--muted:#6f7a88;--line:#e2e6ea;--bg:#f4f6f8}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,Arial,sans-serif;color:var(--ink)}.shell{display:grid;grid-template-columns:258px minmax(0,1fr);min-height:100vh}.side{background:linear-gradient(180deg,#151a22,#1e2530);padding:16px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}.brand{padding:6px 10px 16px;border-bottom:1px solid rgba(255,255,255,.08)}.brand img{width:188px}.spacer{flex:1}.main{min-width:0}.top{height:66px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 28px;justify-content:space-between}.content{padding:26px 30px 60px;max-width:1700px;margin:auto}.head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:18px}.eyebrow{font-size:10px;color:var(--red);font-weight:900;text-transform:uppercase;letter-spacing:.11em}.head h1{margin:5px 0 6px;font-size:30px}.muted{color:var(--muted)}.btn{border:0;border-radius:8px;padding:10px 12px;font-weight:800;font-size:11px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}.primary{background:var(--red);color:#fff}.light{background:#fff;border:1px solid var(--line);color:var(--ink)}.grid{display:grid;grid-template-columns:360px minmax(0,1fr);gap:15px}.panel{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 24px rgba(18,24,33,.05);overflow:hidden}.panel-pad{padding:18px}.toolbar{display:grid;grid-template-columns:1fr;gap:8px;padding:14px;border-bottom:1px solid var(--line)}input,select,textarea{width:100%;border:1px solid #d3d9df;border-radius:8px;padding:10px 11px;font:inherit;font-size:11px;background:#fff;color:var(--ink)}input,select{height:40px}textarea{min-height:90px;resize:vertical}.company-list{display:grid;gap:8px;padding:12px;max-height:720px;overflow:auto}.company-card{border:1px solid var(--line);border-radius:10px;padding:13px;background:#fafbfc;cursor:pointer}.company-card:hover{background:#fff}.company-card.active{border-color:var(--red);box-shadow:0 0 0 1px var(--red)}.company-card strong{display:block;font-size:12px}.meta{font-size:10px;color:var(--muted);margin-top:4px}.badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.pill{display:inline-flex;padding:5px 8px;border-radius:999px;font-size:9px;font-weight:850}.customer{background:#e7efff;color:#2451a4}.sub{background:#fff3d8;color:#8a6100}.active-pill{background:#e8f6ed;color:#176b37}.archived{background:#eef1f4;color:#667085}.detail-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}.stat{border:1px solid var(--line);border-radius:10px;padding:12px;background:#fafbfc}.stat span{display:block;color:var(--muted);font-size:9px}.stat strong{display:block;font-size:21px;margin-top:5px}.tabs{display:flex;gap:5px;border-bottom:1px solid var(--line);margin:8px 0 14px;flex-wrap:wrap}.tab{border:0;background:transparent;padding:9px 10px;font-size:10px;font-weight:800;cursor:pointer;border-bottom:2px solid transparent}.tab.active{color:var(--red);border-color:var(--red)}.tabview{display:none}.tabview.active{display:block}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.wide{grid-column:1/-1}.form label{font-size:10px;font-weight:800;color:#475467}.list{display:grid;gap:8px}.item{border:1px solid var(--line);border-radius:9px;padding:11px;background:#fafbfc}.item strong{font-size:11px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}.checkrow{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.checkrow label{display:flex;gap:6px;align-items:center}.checkrow input{width:auto;height:auto}.msg{margin-top:8px;font-size:10px}.ok{color:#176b37}.bad{color:#b42318}.booking-grid{display:grid;grid-template-columns:1.2fr .8fr .8fr .7fr;gap:8px;align-items:center}.finance-note{padding:12px;border-radius:9px;background:#f8f9fb;border:1px solid var(--line);font-size:11px;color:#475467}@media(max-width:1100px){.shell{grid-template-columns:1fr}.side{position:relative;height:auto}.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}}@media(max-width:700px){.content{padding:20px 14px}.head{display:block}.head .btn{margin-top:12px}.form,.stats{grid-template-columns:1fr}.wide{grid-column:auto}.booking-grid{grid-template-columns:1fr}}</style></head><body data-portal-nav="academy"><div class="shell"><aside class="side"><div class="brand"><img src="rrta-logo.png" alt="RRTA"></div><div class="spacer"></div></aside><main class="main"><header class="top"><strong>RRTA Training Academy Administration</strong><span class="muted">Manage Companies</span></header><div class="content"><div class="head"><div><div class="eyebrow">Manage</div><h1>Manage Companies</h1><p class="muted">Manage customer and subcontractor companies, their people, RRT contract owner, bookings and billing details.</p></div><button id="newCompany" class="btn primary">＋ Add Company</button></div><div class="grid"><section class="panel"><div class="toolbar"><input id="search" placeholder="Search companies"><select id="filter"><option value="all">All Companies</option><option value="rrt">RRT Subcontractor Companies</option><option value="rrta">RRTA Customers</option><option value="both">Dual Relationship</option><option value="archived">Archived</option></select></div><div id="companyList" class="company-list"><div class="empty">Loading companies…</div></div></section><section class="panel panel-pad" id="detail"><div class="empty">Select a company to manage its details.</div></section></div></div></main></div><script src="portal-navigation.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=window.supabase.createClient('https://qgbpotjqggeodxqcwkgj.supabase.co','sb_publishable_J1yPM1Hi7INCX2m7rp3PdA_JdQ46FRS');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const fmt=d=>d?new Date(d+'T00:00:00').toLocaleDateString('en-GB'):'—';let companies=[],contacts=[],delegates=[],profiles=[],bookings=[],selected=null,user=null;async function requireAdmin(){const{data:u}=await db.auth.getUser();if(!u?.user)throw Error('Please sign in again.');user=u.user;const{data:p}=await db.from('profiles').select('role,permission_level').eq('id',u.user.id).single();if(!p||(String(p.role).toLowerCase()!=='trainer'&&p.permission_level!=='super_user'))throw Error('Academy administration access required.')}async function load(){await requireAdmin();const[c,k,d,p,b]=await Promise.all([db.from('external_customers').select('*').order('company_name'),db.from('external_customer_contacts').select('*').order('full_name'),db.from('external_delegates').select('*').order('full_name'),db.from('profiles').select('id,full_name,email,job_title,employee_number,company_id,worker_type,account_status,manager_1_id').order('full_name'),db.from('bookings').select('id,booking_reference,course_title,start_date,end_date,status,delegate_count,company_name,external_customer_id,client_name,client_email').order('start_date',{ascending:false})]);for(const x of[c,k,d,p,b])if(x.error)throw x.error;companies=c.data||[];contacts=k.data||[];delegates=d.data||[];profiles=p.data||[];bookings=b.data||[];renderList();if(companies.length&&!selected){selected=companies.find(x=>x.active!==false)||companies[0];renderList();renderDetail()}}function relation(c){if(c.is_rrta_customer&&c.is_rrt_subcontractor)return'both';if(c.is_rrt_subcontractor)return'rrt';if(c.is_rrta_customer)return'rrta';return'none'}function renderList(){const q=search.value.trim().toLowerCase(),f=filter.value;const list=companies.filter(c=>{const rel=relation(c);return(!q||String(c.company_name||'').toLowerCase().includes(q))&&(f==='all'?c.active!==false:f==='archived'?c.active===false:rel===f)});companyList.innerHTML=list.length?list.map(c=>{const staff=profiles.filter(p=>p.company_id===c.id&&p.account_status!=='archived').length,ds=delegates.filter(d=>d.customer_id===c.id&&d.active!==false).length,bs=bookings.filter(b=>b.external_customer_id===c.id).length;return `<div class="company-card ${selected?.id===c.id?'active':''}" data-id="${c.id}"><strong>${esc(c.company_name)}</strong><div class="meta">${staff+ds} linked people · ${bs} booking${bs===1?'':'s'}</div><div class="badges">${c.is_rrta_customer?'<span class="pill customer">RRTA Customer</span>':''}${c.is_rrt_subcontractor?'<span class="pill sub">RRT Subcontractor</span>':''}${c.active!==false?'<span class="pill active-pill">Active</span>':'<span class="pill archived">Archived</span>'}</div></div>`}).join(''):'<div class="empty">No companies match this filter.</div>';document.querySelectorAll('[data-id]').forEach(el=>el.onclick=()=>{selected=companies.find(c=>c.id===el.dataset.id);renderList();renderDetail()})}function managerName(id){return profiles.find(x=>x.id===id)?.full_name||'Not Assigned'}function managerOptions(id){return `<option value="">Not Assigned</option>${profiles.filter(x=>(x.account_status||'active')==='active').map(m=>`<option value="${m.id}" ${m.id===id?'selected':''}>${esc(m.full_name||m.job_title||'User')}</option>`).join('')}`}function renderDetail(){if(!selected)return;const cs=contacts.filter(x=>x.customer_id===selected.id&&x.active!==false),ds=delegates.filter(x=>x.customer_id===selected.id&&x.active!==false),ps=profiles.filter(x=>x.company_id===selected.id&&x.account_status!=='archived'),bs=bookings.filter(x=>x.external_customer_id===selected.id);detail.innerHTML=`<div class="detail-head"><div><div class="eyebrow">Company Record</div><h2 style="margin:4px 0">${esc(selected.company_name)}</h2><div class="badges">${selected.is_rrta_customer?'<span class="pill customer">RRTA Customer</span>':''}${selected.is_rrt_subcontractor?'<span class="pill sub">RRT Subcontractor Company</span>':''}${selected.active!==false?'<span class="pill active-pill">Active</span>':'<span class="pill archived">Archived</span>'}</div></div><button class="btn light" id="archiveCompany">${selected.active!==false?'Archive':'Reactivate'}</button></div><div class="stats"><div class="stat"><span>Linked People</span><strong>${ps.length+ds.length}</strong></div><div class="stat"><span>Bookings</span><strong>${bs.length}</strong></div><div class="stat"><span>Contacts</span><strong>${cs.length}</strong></div><div class="stat"><span>RRT Manager</span><strong style="font-size:12px">${esc(managerName(selected.rrt_contract_owner_id))}</strong></div></div><div class="tabs"><button class="tab active" data-tab="overview">Overview</button><button class="tab" data-tab="people">People</button><button class="tab" data-tab="bookings">Bookings</button><button class="tab" data-tab="contacts">Contacts</button><button class="tab" data-tab="billing">Billing & Invoices</button></div><div id="tab-overview" class="tabview active"><div class="form"><label>Company Name<input id="companyName" value="${esc(selected.company_name||'')}"></label><label>RRT Contract Owner<select id="contractOwner">${managerOptions(selected.rrt_contract_owner_id)}</select></label><label>Address Line 1<input id="address1" value="${esc(selected.address_line_1||'')}"></label><label>Address Line 2<input id="address2" value="${esc(selected.address_line_2||'')}"></label><label>Town / City<input id="town" value="${esc(selected.town_city||'')}"></label><label>Postcode<input id="postcode" value="${esc(selected.postcode||'')}"></label><label>RRT Contract Status<select id="contractStatus"><option value="not_applicable" ${selected.rrt_contract_status==='not_applicable'?'selected':''}>Not Applicable</option><option value="active" ${selected.rrt_contract_status==='active'?'selected':''}>Active</option><option value="inactive" ${selected.rrt_contract_status==='inactive'?'selected':''}>Inactive</option><option value="ended" ${selected.rrt_contract_status==='ended'?'selected':''}>Ended</option></select></label><div></div><div class="wide checkrow"><label><input id="rrtaFlag" type="checkbox" ${selected.is_rrta_customer?'checked':''}> RRTA Customer</label><label><input id="rrtFlag" type="checkbox" ${selected.is_rrt_subcontractor?'checked':''}> RRT Subcontractor Company</label></div><label class="wide">Notes<textarea id="notes">${esc(selected.notes||'')}</textarea></label><div class="wide"><button class="btn primary" id="saveOverview">Save Company</button><div id="saveMsg" class="msg"></div></div></div></div><div id="tab-people" class="tabview">${renderPeople(ps,ds)}</div><div id="tab-bookings" class="tabview">${renderBookings(bs)}</div><div id="tab-contacts" class="tabview">${renderContacts(cs)}</div><div id="tab-billing" class="tabview"><div class="form"><label>Billing Email<input id="billingEmail" value="${esc(selected.billing_email||'')}"></label><label>Billing Phone<input id="billingPhone" value="${esc(selected.billing_phone||'')}"></label><div class="wide finance-note"><strong>Invoice Management</strong><br>This company record is now the home for billing and invoice activity. Existing course bookings are shown on the Bookings tab; invoice numbers, payment status and payment terms can be connected here when the finance module is added.</div><div class="wide"><button class="btn primary" id="saveBilling">Save Billing Details</button><div id="billingMsg" class="msg"></div></div></div></div>`;document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.tabview').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById('tab-'+b.dataset.tab).classList.add('active')});saveOverview.onclick=saveCompany;saveBilling.onclick=saveBillingDetails;archiveCompany.onclick=toggleArchive}function renderPeople(ps,ds){const all=[...ps.map(p=>({name:p.full_name,email:p.email||'',meta:[p.job_title,p.employee_number?`Employee ${p.employee_number}`:'',`RRT Manager: ${managerName(p.manager_1_id)}`].filter(Boolean).join(' · '),href:`learner-profile.html?id=${p.id}`,kind:p.worker_type==='subcontractor'?'RRT Subcontractor':'RRT Staff'})),...ds.map(d=>({name:d.full_name,email:d.email||'',meta:d.phone||'',href:`external-learner-profile.html?id=${d.id}`,kind:'RRTA Delegate'}))];return all.length?`<div class="list">${all.map(x=>`<div class="item"><div class="row"><div><strong>${esc(x.name||'Person')}</strong><div class="meta">${esc(x.kind)}${x.email?' · '+esc(x.email):''}${x.meta?' · '+esc(x.meta):''}</div></div><a class="btn light" href="${x.href}">Open Profile</a></div></div>`).join('')}</div><div style="margin-top:12px"><a class="btn primary" href="add-staff.html">＋ Add Person</a></div>`:'<div class="empty">No people are linked to this company yet.</div><div style="margin-top:12px"><a class="btn primary" href="add-staff.html">＋ Add Person</a></div>'}function renderBookings(bs){return bs.length?`<div class="list">${bs.map(b=>`<div class="item booking-grid"><div><strong>${esc(b.course_title||'Course')}</strong><div class="meta">${esc(b.booking_reference||'No Reference')}</div></div><div>${esc(fmt(b.start_date))}${b.end_date&&b.end_date!==b.start_date?' – '+esc(fmt(b.end_date)):''}</div><div>${esc(b.delegate_count??'—')} delegate${b.delegate_count===1?'':'s'}</div><div><span class="pill active-pill">${esc(b.status||'Booked')}</span></div></div>`).join('')}</div>`:'<div class="empty">No bookings are linked to this company yet.</div>'}function renderContacts(cs){return cs.length?`<div class="list">${cs.map(c=>`<div class="item"><strong>${esc(c.full_name||'Contact')}</strong>${c.is_primary?' <span class="pill customer">Primary</span>':''}<div class="meta">${esc(c.job_title||'')}${c.email?' · '+esc(c.email):''}${c.phone?' · '+esc(c.phone):''}</div></div>`).join('')}</div>`:'<div class="empty">No contacts recorded.</div>'}async function saveCompany(){const patch={company_name:companyName.value.trim(),address_line_1:address1.value.trim()||null,address_line_2:address2.value.trim()||null,town_city:town.value.trim()||null,postcode:postcode.value.trim()||null,rrt_contract_owner_id:contractOwner.value||null,rrt_contract_status:contractStatus.value,is_rrta_customer:rrtaFlag.checked,is_rrt_subcontractor:rrtFlag.checked,notes:notes.value.trim()||null,updated_at:new Date().toISOString()};const{error}=await db.from('external_customers').update(patch).eq('id',selected.id);if(error){saveMsg.textContent=error.message;saveMsg.className='msg bad';return}Object.assign(selected,patch);saveMsg.textContent='Company updated.';saveMsg.className='msg ok';renderList()}async function saveBillingDetails(){const patch={billing_email:billingEmail.value.trim()||null,billing_phone:billingPhone.value.trim()||null,updated_at:new Date().toISOString()};const{error}=await db.from('external_customers').update(patch).eq('id',selected.id);if(error){billingMsg.textContent=error.message;billingMsg.className='msg bad';return}Object.assign(selected,patch);billingMsg.textContent='Billing details updated.';billingMsg.className='msg ok'}async function toggleArchive(){const active=selected.active===false;const patch={active,archived_at:active?null:new Date().toISOString(),updated_at:new Date().toISOString()};const{error}=await db.from('external_customers').update(patch).eq('id',selected.id);if(error){alert(error.message);return}Object.assign(selected,patch);renderList();renderDetail()}newCompany.onclick=async()=>{const name=prompt('Company Name');if(!name?.trim())return;const{data,error}=await db.from('external_customers').insert({company_name:name.trim(),active:true,is_rrta_customer:true,is_rrt_subcontractor:false,created_by:user.id}).select('*').single();if(error){alert(error.message);return}companies.push(data);companies.sort((a,b)=>String(a.company_name).localeCompare(String(b.company_name)));selected=data;renderList();renderDetail()};search.oninput=renderList;filter.onchange=renderList;load().catch(e=>{companyList.innerHTML=`<div class="empty">${esc(e.message)}</div>`;detail.innerHTML=`<div class="empty">${esc(e.message)}</div>`});</script></body></html>
