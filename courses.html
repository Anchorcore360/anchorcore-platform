<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Courses | RRTA</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="portal-navigation.css"><style>:root{--red:#b20f22;--ink:#18202a;--muted:#6f7a88;--line:#e2e6ea;--bg:#f4f6f8}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,Arial,sans-serif;color:var(--ink)}.shell{display:grid;grid-template-columns:258px minmax(0,1fr);min-height:100vh}.side{position:sticky;top:0;height:100vh;background:linear-gradient(180deg,#151a22,#1e2530);color:#d8dee7;padding:16px 12px;display:flex;flex-direction:column}.brand{padding:5px 10px 16px;border-bottom:1px solid rgba(255,255,255,.08)}.brand img{width:158px;filter:brightness(0) invert(1)}.spacer{flex:1}.main{min-width:0}.top{height:66px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 28px;justify-content:space-between;position:sticky;top:0;z-index:5}.content{max-width:1600px;margin:auto;padding:28px 32px 60px}.head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:18px}.eyebrow{font-size:10px;color:var(--red);font-weight:900;text-transform:uppercase;letter-spacing:.11em}.head h1{margin:5px 0 6px;font-size:30px}.muted{color:var(--muted)}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.filter{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:8px 11px;font-size:11px;font-weight:800;cursor:pointer}.filter.active{background:var(--red);border-color:var(--red);color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}.card{display:block;text-decoration:none;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 8px 20px rgba(18,24,33,.04);transition:.18s ease}.card:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(18,24,33,.08)}.card h2{font-size:17px;margin:7px 0}.facts{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}.facts span{background:#f1f3f5;border-radius:999px;padding:5px 8px;font-size:9px;font-weight:800;color:#596372}.empty{background:#fff;border:1px dashed var(--line);border-radius:14px;padding:34px;text-align:center;color:var(--muted)}@media(max-width:1000px){.shell{grid-template-columns:1fr}.side{position:relative;height:auto}.content{padding:20px 14px}}</style></head><body data-portal-nav="academy"><div class="shell"><aside class="side"><div class="brand"><img src="rrta-logo.png" alt="RRTA"></div><div class="spacer"></div></aside><main class="main"><header class="top"><strong>RRTA Training Academy Administration</strong><span class="muted">Course Catalogue</span></header><div class="content"><div class="head"><div><div class="eyebrow">Courses</div><h1>Course Catalogue</h1><p class="muted">Manage and open RRTA course files without leaving the Academy workspace.</p></div></div><div class="filters" id="filters"></div><div id="grid" class="grid"><div class="empty">Loading courses…</div></div></div></main></div><script src="portal-navigation.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=window.supabase.createClient('https://qgbpotjqggeodxqcwkgj.supabase.co','sb_publishable_J1yPM1Hi7INCX2m7rp3PdA_JdQ46FRS');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));let rows=[],active='all';function bucket(c){const x=String(c.category||'').toLowerCase();if(x.includes('smart'))return'smart';if(x.includes('eusr'))return'eusr';if(x.includes('pro')||x.includes('first aid'))return'protrainings';if(x.includes('rrta')||x.includes('online'))return'online';return'other'}function label(k){return{all:'All Courses',online:'Online Courses',smart:'Smart Awards',eusr:'EUSR',protrainings:'ProTrainings Courses',other:'Other'}[k]||k}function render(){const cats=['all','online','smart','eusr','protrainings'];filters.innerHTML=cats.map(k=>`<button class="filter ${active===k?'active':''}" data-filter="${k}">${label(k)}</button>`).join('');const list=active==='all'?rows:rows.filter(x=>bucket(x)===active);grid.innerHTML=list.length?list.map(c=>`<a class="card" href="course-detail.html?id=${encodeURIComponent(c.id)}"><div class="eyebrow">${esc(c.course_code||label(bucket(c)))}</div><h2>${esc(c.title||'Course')}</h2><p class="muted">${esc(c.description||'RRTA course file')}</p><div class="facts">${c.duration_days?`<span>${Number(c.duration_days)} day${Number(c.duration_days)===1?'':'s'}</span>`:''}${c.powerpoint_path?'<span>PowerPoint</span>':''}${c.specification_path?'<span>Specification</span>':''}${c.joining_instructions_path?'<span>Joining Instructions</span>':''}</div></a>`).join(''):'<div class="empty">No courses are currently in this section.</div>';document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{active=b.dataset.filter;history.replaceState(null,'',`courses.html?category=${active}`);render()})}async function load(){const{data:u}=await db.auth.getUser();if(!u?.user){location.href='trainer.html';return}const{data:p}=await db.from('profiles').select('role,permission_level').eq('id',u.user.id).single();if(!p||(String(p.role).toLowerCase()!=='trainer'&&p.permission_level!=='super_user')){location.href='portal.html';return}const q=await db.from('courses').select('id,course_code,title,description,category,duration_days,specification_path,powerpoint_path,joining_instructions_path,active').eq('active',true).order('category').order('title');rows=q.data||[];const requested=new URLSearchParams(location.search).get('category');if(['online','smart','eusr','protrainings'].includes(requested))active=requested;render()}load();</script></body></html>
