<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Joining Instructions Template | RRTA</title><link rel="stylesheet" href="styles.css"><style>body{background:#f3f5f6}.wrap{max-width:1050px;margin:auto;padding:28px}.panel{background:#fff;border:1px solid #d9dee5;border-radius:12px;padding:20px;margin-bottom:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid label{font-size:12px;font-weight:800}.grid input,.grid textarea{width:100%;padding:10px;border:1px solid #cfd5dd;border-radius:8px;margin-top:5px;font:inherit}.muted{color:#667085}.notice{padding:12px;border:1px dashed #cfd5dd;border-radius:8px;background:#fafbfc;color:#667085}@media(max-width:760px){.grid{grid-template-columns:1fr}}</style></head><body><header class="site-header"><div class="header-inner"><img src="rrta-logo.png" class="brand-logo" alt="RRTA"><div class="header-user">Course Template</div></div></header><main class="wrap"><a id="back" class="text-btn" href="trainer.html">← Back to Course File</a><section class="panel"><div class="eyebrow">Master template</div><h1 id="heading">Joining Instructions</h1><p class="muted">This is the course-level master. Booked courses use it to generate attendee-specific drafts.</p><div class="notice"><strong>Automatic email is disabled.</strong> Changing this template will not send anything.</div></section><section class="panel"><div class="grid"><label>Template name<input id="name"></label><label>Version<input id="version" type="number" min="1"></label><label>Arrival time<input id="arrival"></label><label>Start time<input id="start"></label><label>Point of contact<input id="contact"></label><label>Contact number<input id="phone"></label><label class="full" style="grid-column:1/-1">Email subject<input id="subject"></label><label class="full" style="grid-column:1/-1">Template body<textarea id="body" style="min-height:620px"></textarea></label></div><div style="display:flex;gap:8px;margin-top:14px"><button class="btn dark" id="save">Save template</button><span id="state" class="muted"></span></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=window.supabase.createClient('https://qgbpotjqggeodxqcwkgj.supabase.co','sb_publishable_J1yPM1Hi7INCX2m7rp3PdA_JdQ46FRS');const courseId=new URLSearchParams(location.search).get('course_id');let template,course;async function requireTrainer(){const {data:u}=await db.auth.getUser();if(!u?.user)throw Error('Please sign in through the Trainer Portal.');const {data:p}=await db.rpc('get_current_profile');const x=Array.isArray(p)?p[0]:p;if(!x||String(x.role).toLowerCase()!=='trainer')throw Error('Trainer access is required.')}async function load(){if(!courseId)throw Error('No course selected.');await requireTrainer();const [c,t]=await Promise.all([db.from('courses').select('*').eq('id',courseId).single(),db.from('joining_instruction_templates').select('*').eq('course_id',courseId).eq('active',true).order('version',{ascending:false}).limit(1)]);if(c.error)throw c.error;course=c.data;template=t.data?.[0];heading.textContent=`${course.course_code||''} ${course.title||''} – Joining Instructions`;back.href=`course-detail.html?id=${courseId}`;if(!template){state.textContent='No template yet.';version.value=1;return}name.value=template.name||'';version.value=template.version||1;arrival.value=template.default_arrival_time||'';start.value=template.default_start_time||'';contact.value=template.point_of_contact||'';phone.value=template.contact_number||'';subject.value=template.subject_template||'';body.value=template.body_template||''}save.onclick=async()=>{if(!template)return alert('This page currently edits an existing course template.');const payload={name:name.value.trim(),version:Number(version.value||1),default_arrival_time:arrival.value.trim(),default_start_time:start.value.trim(),point_of_contact:contact.value.trim(),contact_number:phone.value.trim(),subject_template:subject.value,body_template:body.value,updated_at:new Date().toISOString()};const {error}=await db.from('joining_instruction_templates').update(payload).eq('id',template.id);if(error)return alert(error.message);state.textContent='Saved';setTimeout(()=>state.textContent='',2000)};load().catch(e=>alert(e.message));</script></body></html>
