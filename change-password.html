<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Change Password | RRTA</title>
<link rel="stylesheet" href="styles.css">
<style>
:root{--red:#b20f22;--ink:#18202a;--muted:#6f7a88;--line:#e2e6ea;--bg:#f4f6f8}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);font-family:Inter,Arial,sans-serif;color:var(--ink);display:grid;place-items:center;padding:24px}
.card{width:min(520px,100%);background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 50px rgba(18,24,33,.12);overflow:hidden}
.header{padding:24px 26px 18px;border-bottom:1px solid var(--line)}.eyebrow{font-size:10px;color:var(--red);font-weight:900;text-transform:uppercase;letter-spacing:.12em}.header h1{margin:7px 0 8px;font-size:28px}.header p{margin:0;color:var(--muted);font-size:12px;line-height:1.55}
.body{padding:22px 26px 26px}.user{background:#f7f8fa;border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin-bottom:16px;font-size:11px;color:#475467}
label{display:block;font-size:11px;font-weight:850;margin:12px 0 5px}input{width:100%;height:44px;border:1px solid #d3d9df;border-radius:8px;padding:0 11px;font:inherit}.hint{font-size:10px;color:var(--muted);margin-top:6px}.btn{width:100%;margin-top:18px;border:0;border-radius:8px;padding:12px 14px;background:var(--red);color:#fff;font-weight:850;cursor:pointer}.btn:disabled{opacity:.6}.msg{margin-top:12px;font-size:11px}.bad{color:#b42318}.ok{color:#176b37}
</style>
</head>
<body>
<section class="card">
  <div class="header">
    <div class="eyebrow">Security</div>
    <h1>Create your own password</h1>
    <p>Your temporary password was issued by an administrator. Before continuing into RRTA, choose a private password that only you know.</p>
  </div>
  <div class="body">
    <div class="user" id="userBox">Checking your account…</div>
    <form id="form">
      <label>New Password</label>
      <input id="newPassword" type="password" minlength="8" autocomplete="new-password" required>
      <div class="hint">Use at least 8 characters. Do not share this password with anyone.</div>
      <label>Confirm New Password</label>
      <input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required>
      <button class="btn" id="saveBtn" type="submit">Set My Password</button>
      <div id="message" class="msg"></div>
    </form>
  </div>
</section>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const db=window.supabase.createClient('https://qgbpotjqggeodxqcwkgj.supabase.co','sb_publishable_J1yPM1Hi7INCX2m7rp3PdA_JdQ46FRS');
async function init(){
  const {data:{user}}=await db.auth.getUser();
  if(!user){location.replace('portal.html');return}
  const {data:p,error}=await db.from('profiles').select('full_name,email,must_change_password').eq('id',user.id).single();
  if(error||!p){location.replace('portal.html');return}
  if(p.must_change_password!==true){location.replace('portal.html');return}
  userBox.textContent=(p.full_name||'RRTA User')+' · '+(p.email||user.email||'');
}
form.addEventListener('submit',async e=>{
  e.preventDefault();message.textContent='';
  const a=newPassword.value,b=confirmPassword.value;
  if(a.length<8){message.textContent='Password must be at least 8 characters.';message.className='msg bad';return}
  if(a!==b){message.textContent='The passwords do not match.';message.className='msg bad';return}
  saveBtn.disabled=true;saveBtn.textContent='Updating…';
  try{
    const {error}=await db.auth.updateUser({password:a});
    if(error)throw error;
    const r=await db.rpc('complete_password_change');
    if(r.error)throw r.error;
    message.textContent='Password updated. Returning you to sign in…';message.className='msg ok';
    await db.auth.signOut();
    setTimeout(()=>location.replace('portal.html?passwordChanged=1'),700);
  }catch(err){
    message.textContent=err?.message||'Unable to update password.';message.className='msg bad';
    saveBtn.disabled=false;saveBtn.textContent='Set My Password';
  }
});
init().catch(()=>location.replace('portal.html'));
</script>
</body>
</html>
