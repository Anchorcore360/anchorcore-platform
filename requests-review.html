    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Reviews & Requests | RRTA</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="portal-navigation.css" />
    <style>
      :root {
        --red: #b20f22;
        --ink: #18202a;
        --muted: #6f7a88;
        --line: #e2e6ea;
        --bg: #f4f6f8;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        font-family: Inter, Arial, sans-serif;
        color: var(--ink);
      }
      .shell {
        display: grid;
        grid-template-columns: 258px minmax(0, 1fr);
        min-height: 100vh;
      }
      .side {
        position: sticky;
        top: 0;
        height: 100vh;
        background: linear-gradient(180deg, #151a22, #1e2530);
        padding: 16px 12px;
        display: flex;
        flex-direction: column;
      }
      .brand {
        padding: 5px 10px 16px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }
      .brand img {
        width: 158px;
        filter: brightness(0) invert(1);
      }
      .spacer {
        flex: 1;
      }
      .main {
        min-width: 0;
      }
      .top {
        height: 66px;
        background: #fff;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        padding: 0 28px;
        justify-content: space-between;
      }
      .content {
        padding: 26px 30px 60px;
        max-width: 1500px;
        margin: auto;
      }
      .head {
        margin-bottom: 18px;
      }
      .eyebrow {
        font-size: 10px;
        color: var(--red);
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 0.11em;
      }
      .head h1 {
        margin: 5px 0 6px;
        font-size: 30px;
      }
      .muted {
        color: var(--muted);
      }
      .summary {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
        margin-bottom: 18px;
      }
      .stat,
      .panel {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 14px;
        box-shadow: 0 10px 24px rgba(18, 24, 33, 0.05);
      }
      .stat {
        padding: 16px;
      }
      .stat span {
        display: block;
        color: var(--muted);
        font-size: 11px;
      }
      .stat strong {
        display: block;
        font-size: 27px;
        margin-top: 5px;
      }
      .panel {
        padding: 20px;
        margin-bottom: 16px;
      }
      .request-list {
        display: grid;
        gap: 10px;
        margin-top: 14px;
      }
      .request {
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 14px;
        background: #fafbfc;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 16px;
        align-items: center;
      }
      .request h3 {
        margin: 5px 0;
        font-size: 15px;
      }
      .request p {
        margin: 3px 0;
        color: var(--muted);
        font-size: 11px;
      }
      .actions {
        display: flex;
        gap: 7px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }
      .btn {
        border: 0;
        border-radius: 8px;
        padding: 8px 10px;
        font-size: 10px;
        font-weight: 850;
        text-decoration: none;
        cursor: pointer;
      }
      .dark {
        background: #20262d;
        color: #fff;
      }
      .light {
        background: #fff;
        border: 1px solid var(--line);
        color: var(--ink);
      }
      .pill {
        display: inline-flex;
        border-radius: 999px;
        padding: 5px 8px;
        font-size: 9px;
        font-weight: 850;
      }
      .phone {
        background: #eef3ff;
        color: #3448a5;
      }
      .evidence {
        background: #fff5db;
        color: #8a6100;
      }
      .empty {
        padding: 26px;
        text-align: center;
        border: 1px dashed var(--line);
        border-radius: 10px;
        color: var(--muted);
      }
      .message {
        margin-bottom: 12px;
        padding: 10px 12px;
        border-radius: 8px;
        font-size: 11px;
      }
      .ok {
        background: #e9f7ee;
        color: #176b37;
      }
      .err {
        background: #fdebec;
        color: #b42318;
      }
      .review-box {
        grid-column: 1/-1;
        border-top: 1px solid var(--line);
        padding-top: 14px;
        display: none;
      }
      .request.open .review-box {
        display: block;
      }
      .review-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 10px;
      }
      .review-grid label {
        font-size: 10px;
        font-weight: 800;
        color: #475467;
      }
      .review-grid input,
      .review-grid textarea {
        width: 100%;
        margin-top: 5px;
        padding: 9px 10px;
        border: 1px solid #cfd5dd;
        border-radius: 8px;
        font: inherit;
      }
      .review-grid textarea {
        min-height: 70px;
      }
      .review-grid .wide {
        grid-column: 1/-1;
      }
      @media (max-width: 1000px) {
        .shell {
          grid-template-columns: 1fr;
        }
        .side {
          position: relative;
          height: auto;
        }
        .summary {
          grid-template-columns: 1fr;
        }
      }
      @media (max-width: 700px) {
        .content {
          padding: 20px 14px;
        }
        .request {
          grid-template-columns: 1fr;
        }
        .actions {
          justify-content: flex-start;
        }
        .review-grid {
          grid-template-columns: 1fr;
        }
        .review-grid .wide {
          grid-column: auto;
        }
      }
    </style>

    <script>
      const db = window.supabase.createClient(
        "https://qgbpotjqggeodxqcwkgj.supabase.co",
        "sb_publishable_J1yPM1Hi7INCX2m7rp3PdA_JdQ46FRS",
      );
      const esc = (v) =>
        String(v ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#039;",
            })[c],
        );
      const fmt = (d) => (d ? new Date(d).toLocaleDateString("en-GB") : "—");
      let reviewer = null,
        evidenceRows = [], profileRows = [], catalogue = [];
      function msg(t, type = "ok") {
        message.innerHTML = `<div class="message ${type}">${esc(t)}</div>`;
        setTimeout(() => (message.innerHTML = ""), 3500);
      }
      function statusFor(expiry) {
        if (!expiry) return "current";
        const end = new Date(expiry + "T23:59:59");
        const days = Math.ceil((end - new Date()) / 86400000);
        return days < 0 ? "expired" : days <= 30 ? "expiring" : "current";
      }
      function codeOf(x) {
        return (
          (String(x || "")
            .toUpperCase()
            .match(
              /\b(?:NPORS\s*N\d+[A-Z]?|SA\d+[A-Z]?|S\d{3}|Q\d{2,3}|O\d+|LA|EFAW|IPAF\s*1B)\b/,
            ) || [])[0]?.replace(/\s/g, "") || ""
        );
      }
      async function auth() {
        const { data: u } = await db.auth.getUser();
        if (!u?.user) {
          location.href = "portal.html";
          return false;
        }
        const { data: p } = await db
          .from("profiles")
          .select("id,role,permission_level,portal_access_role,organisational_access_role")
          .eq("id", u.user.id)
          .single();
        const access = String(p?.organisational_access_role || p?.portal_access_role || "").toLowerCase();
        if (
          !p ||
          (!["academy_staff","academy","health_safety","operations_manager","administrator"].includes(access) &&
            p.permission_level !== "super_user")
        ) {
          location.href = "portal.html";
          return false;
        }
        reviewer = p;
        return true;
      }
      async function load() {
        if (!(await auth())) return;
        const [pr, er, cat] = await Promise.all([
          db
            .from("profile_change_requests")
            .select("*,profiles:learner_id(id,full_name,email,employee_number)")
            .eq("status", "pending")
            .order("requested_at"),
          db
            .from("evidence_review_requests")
            .select("*,profiles:learner_id(id,full_name,email,employee_number)")
            .eq("status", "pending")
            .order("submitted_at"),
          db.from("accreditation_catalog").select("id,module_code,description,source,active").eq("active",true).order("module_code"),
        ]);
        if(pr.error||er.error){msg((pr.error||er.error).message,"err");return;}
        evidenceRows = er.data || []; profileRows=pr.data||[]; catalogue=window.RRTAQualificationMaster.options(cat.data||[]).filter(o=>o.entry.code!=="NOPS"); if(cat.error)msg("Qualification catalogue unavailable: "+cat.error.message,"err");
        render(profileRows, evidenceRows);
      }
      function qualificationOptions(query="",selected=""){
        const q=String(query).toLowerCase().trim().split(/\s+/).filter(Boolean);
        const groups=new Map();
        for(const c of catalogue){
          const hay=[c.label,c.module_code,c.description,c.entry.category,...(c.entry.aliases||[])].join(" ").toLowerCase();
          if(String(c.id)!==String(selected)&&!q.every(t=>hay.includes(t)))continue;
          const key=c.entry.category.replace(/^\d+\s*/,"");
          if(!groups.has(key))groups.set(key,[]);
          groups.get(key).push(c);
        }
        return '<option value="">Select qualification from catalogue</option>'+[...groups].map(([group,rows])=>'<optgroup label="'+esc(group)+'">'+rows.map(c=>'<option value="'+esc(c.id)+'" '+(String(c.id)===String(selected)?'selected':'')+'>'+esc(c.label)+'</option>').join("")+'</optgroup>').join("");
      }
      function render(p, e) {
        const totalP=p.length,totalE=e.length;
        const q=document.getElementById("queueSearch").value.trim().toLowerCase(),type=document.getElementById("queueType").value;
        const matches=r=>[r.profiles?.full_name,r.profiles?.employee_number,r.qualification_name,r.field_name,r.awarding_body,r.certificate_number].some(v=>String(v||"").toLowerCase().includes(q));
        p=p.filter(matches); e=e.filter(matches);
        document.getElementById("profilePanel").hidden=type==="evidence";document.getElementById("evidencePanel").hidden=type==="profile";
        summary.innerHTML = `<div class="stat"><span>Total Pending</span><strong>${totalP + totalE}</strong></div><div class="stat"><span>Profile Changes</span><strong>${totalP}</strong></div><div class="stat"><span>Accreditation / Evidence Reviews</span><strong>${totalE}</strong></div>`;
        profileRequests.innerHTML = p.length
          ? '<div class="queue-header profile-row"><span>Employee</span><span>Field</span><span>Current value</span><span>Requested value</span><span>Requested</span><span>Actions</span></div>'+p
              .map(
                (r) =>
                  `<article class="request profile-row"><div><strong>${esc(r.profiles?.full_name || "Learner")}</strong><p>${esc(r.profiles?.employee_number||"")}</p></div><div>${esc(String(r.field_name || "Field").replace(/_/g, " "))}</div><div>${esc(r.current_value || "—")}</div><div>${esc(r.requested_value)}</div><div>${fmt(r.requested_at)}</div><div class="actions"><a class="btn light" href="learner-profile.html?id=${encodeURIComponent(r.learner_id)}">View Profile</a><button class="btn dark" data-approve="${r.id}" data-field="${esc(r.field_name)}" data-value="${esc(r.requested_value)}" data-learner="${r.learner_id}">Approve</button><button class="btn light" data-reject="${r.id}">Decline</button></div></article>`,
              )
              .join("")
          : '<div class="empty">No pending profile change requests.</div>';
        evidenceRequests.innerHTML = e.length
          ? '<div class="queue-header evidence-row"><span>Employee</span><span>Course / qualification</span><span>Actions</span></div>'+e

                (r) =>
                  `<article class="request evidence-row" data-evidence-card="${r.id}"><div><strong>${esc(r.profiles?.full_name || "Learner")}</strong><p>${esc(r.profiles?.employee_number||"")}</p></div><div>${esc(r.qualification_name || "Qualification")}</div><div class="actions"><button class="btn dark toggle-review" data-open-evidence="${r.id}">Review Evidence</button></div><div class="review-box"><div class="certificate-preview"></div><div class="review-controls"><div class="review-grid"><label class="wide qual-search">Search qualification<input type="search" data-field="qualification_search" placeholder="Search code, description or category" autocomplete="off"></label><label class="wide">Assign to qualification<select data-field="catalogue_id">${qualificationOptions("",r.accreditation_catalog_id||"")}</select><small class="qual-help">Approved RRTA matrix qualifications only. Search to narrow the list.</small></label><label class="metadata-field">Awarding Body<input data-field="awarding_body" value="${esc(r.awarding_body || "")}"></label><label class="metadata-field">Certificate Number<input data-field="certificate_number" value="${esc(r.certificate_number || "")}"></label><label>Issue date<input data-field="issue_date" type="date" value="${r.issue_date || ""}"></label><label>Expiry date<input data-field="expiry_date" type="date" value="${r.expiry_date || ""}"></label></div><details class="review-extra"><summary>Additional certificate details</summary><div class="extra-fields"></div></details><input type="hidden" data-field="reviewer_note" value="${esc(r.reviewer_note || "")}"><div class="actions decision-actions"><button class="btn light" data-download-file="${r.id}">Download</button><button class="btn light" data-view-file="${r.id}">Open</button><button class="btn reject-btn" data-reject-evidence="${r.id}">Reject</button><button class="btn accept-btn" data-approve-evidence="${r.id}">Accept</button></div><div class="review-message" role="status"></div></div></div></article>`,
              )
              .join("")
          : '<div class="empty">No pending evidence reviews.</div>';
        document
          .querySelectorAll("[data-approve]")
          .forEach((b) => (b.onclick = () => approveProfile(b)));
        document
          .querySelectorAll("[data-reject]")
          .forEach((b) => (b.onclick = () => rejectProfile(b.dataset.reject)));
        document.querySelectorAll("[data-open-evidence]").forEach(b=>b.onclick=async()=>{const card=document.querySelector('[data-evidence-card="'+b.dataset.openEvidence+'"]');if(!card)return;document.querySelectorAll(".request.open").forEach(other=>{if(other!==card)other.classList.remove("open")});const on=card.classList.toggle("open");if(!on)return;card.querySelectorAll(".metadata-field").forEach(el=>card.querySelector(".extra-fields").append(el));const r=evidenceRows.find(x=>String(x.id)===b.dataset.openEvidence),preview=card.querySelector(".certificate-preview"),select=card.querySelector('[data-field="catalogue_id"]');if(!select.value){const name=String(r.qualification_name||"").trim();const match=catalogue.filter(c=>window.RRTAQualificationMaster.matches(c.entry,name));if(match.length===1)select.value=match[0].id;}const search=card.querySelector('[data-field="qualification_search"]');search.oninput=()=>{const previous=select.value;select.innerHTML=qualificationOptions(search.value,previous);};preview.textContent="Loading certificate…";if(!r.evidence_path){preview.textContent="No certificate attached.";return;}const {data,error}=await db.storage.from("learner-documents").createSignedUrl(r.evidence_path,300);if(error||!data?.signedUrl){preview.textContent="Unable to load certificate. Use Open Uploaded Evidence to retry.";return;}preview.replaceChildren();const link=document.createElement("a");link.href=data.signedUrl;link.target="_blank";link.rel="noopener noreferrer";link.textContent="Open certificate in new tab";preview.append(link);const ext=r.evidence_path.split(".").pop().toLowerCase();if(["jpg","jpeg","png","webp","gif"].includes(ext)){const img=document.createElement("img");img.src=data.signedUrl;img.alt="Uploaded certificate";preview.append(img);}else if(ext==="pdf"){const frame=document.createElement("iframe");frame.src=data.signedUrl;frame.title="Uploaded PDF certificate";preview.append(frame);}else{preview.append(document.createTextNode(" — use the link to view this file."));}});
        document.querySelectorAll("[data-download-file]").forEach(b=>b.onclick=async()=>{const r=evidenceRows.find(x=>String(x.id)===b.dataset.downloadFile);if(!r?.evidence_path)return msg("No certificate attached.","err");const {data,error}=await db.storage.from("learner-documents").createSignedUrl(r.evidence_path,300,{download:true});if(error||!data?.signedUrl)return msg(error?.message||"Download unavailable.","err");const a=document.createElement("a");a.href=data.signedUrl;a.download="";document.body.append(a);a.click();a.remove()});
        document
          .querySelectorAll("[data-view-file]")
          .forEach((b) => (b.onclick = () => openEvidence(b.dataset.viewFile)));
        document
          .querySelectorAll("[data-approve-evidence]")
          .forEach(
            (b) =>
              (b.onclick = () =>
                reviewEvidence(b.dataset.approveEvidence, "approved")),
          );
        document
          .querySelectorAll("[data-reject-evidence]")
          .forEach(
            (b) =>
              (b.onclick = () =>
                reviewEvidence(b.dataset.rejectEvidence, "rejected")),
          );
      }
      async function approveProfile(b) {
        if (b.dataset.field !== "phone") {
          msg("Open the learner profile to approve this request type.", "err");
          return;
        }
        if (!confirm(`Approve this phone number change to ${b.dataset.value}?`))
          return;
        const up = await db
          .from("profiles")
          .update({ phone: b.dataset.value })
          .eq("id", b.dataset.learner);
        if (up.error) return msg(up.error.message, "err");
        const rq = await db
          .from("profile_change_requests")
          .update({
            status: "approved",
            reviewed_at: new Date().toISOString(),
            reviewed_by: reviewer.id,
            review_note: "Approved from Reviews & Requests queue",
          })
          .eq("id", b.dataset.approve);
        if (rq.error) return msg(rq.error.message, "err");
        msg("Profile change approved.");
        load();
      }
      async function rejectProfile(id) {
        const note = prompt("Optional reason for declining:", "");
        if (note === null) return;
        const q = await db
          .from("profile_change_requests")
          .update({
            status: "rejected",
            reviewed_at: new Date().toISOString(),
            reviewed_by: reviewer.id,
            review_note: note || "Declined",
          })
          .eq("id", id);
        if (q.error) return msg(q.error.message, "err");
        msg("Request declined.");
        load();
      }
      async function openEvidence(id) {
        const r = evidenceRows.find((x) => String(x.id) === String(id));
        if (!r?.evidence_path)
          return msg("No evidence file is attached.", "err");
        const { data, error } = await db.storage
          .from("learner-documents")
          .createSignedUrl(r.evidence_path, 300);
        if (error || !data?.signedUrl)
          return msg(error?.message || "Unable to open evidence.", "err");
        window.open(data.signedUrl, "_blank", "noopener");
      }
      async function reviewEvidence(id, decision) {
        const r = evidenceRows.find((x) => String(x.id) === String(id)),
          card = document.querySelector(`[data-evidence-card="${id}"]`);
        if (!r || !card) return;
        const val = (f) =>
            card.querySelector(`[data-field="${f}"]`)?.value?.trim() || null,
          awarding = val("awarding_body"),
          catalogueId = val("catalogue_id"),
          selected = catalogue.find(c=>String(c.id)===String(catalogueId)),
          qualification = selected ? selected.label : r.qualification_name,
          cert = val("certificate_number"),
          issue = val("issue_date"),
          expiry = val("expiry_date"),
          note = decision==="rejected" ? prompt("Reason for rejection (shown to employee):",val("reviewer_note")||"") : val("reviewer_note");
        if(decision==="rejected"&&note===null)return;
        if(decision==="approved"&&!selected)return msg("Select the relevant qualification from the catalogue.","err");
        if(decision==="approved"&&!r.evidence_path)return msg("No certificate is attached.","err");
        if(decision==="approved"&&issue&&expiry&&expiry<issue)return msg("Expiry date cannot precede issue date.","err");
        if (decision === "rejected" && !note)
          return msg(
            "Add a reviewer note explaining what the learner needs to correct.",
            "err",
          );
        if (
          decision === "rejected" &&
          !confirm(`Are you sure you want to return this evidence to ${r.profiles?.full_name || "the learner"}? The learner will see your reviewer note and will need to submit corrected evidence.`)
        )
          return;
        if (
          decision === "approved" &&
          !confirm(
            "Approve this evidence and add it to the learner accreditation record?",
          )
        )
          return;
        try {
          if (decision === "approved") {
            const payload = {
              learner_id: r.learner_id,
              accreditation_name: qualification,
              accreditation_catalog_id: selected.catalogId,
              awarding_body: awarding,
              certificate_number: cert,
              issue_date: issue,
              expiry_date: expiry,
              certificate_url: r.evidence_path,
              status: statusFor(expiry),
            };
            const {data:existing,error:lookupError}=await db.from("accreditations").select("id").eq("learner_id",r.learner_id).eq("accreditation_name",qualification).eq("certificate_url",r.evidence_path).is("archived_at",null).limit(1);if(lookupError)throw lookupError;
            const q=existing?.length?{error:null}:await db.from("accreditations").insert(payload);
            if (q.error) throw q.error;
          }
          const q = await db
            .from("evidence_review_requests")
            .update({
              status: decision,
              qualification_name: qualification,
              awarding_body: awarding,
              certificate_number: cert,
              issue_date: issue,
              expiry_date: expiry,
              reviewer_note: note,
              reviewed_at: new Date().toISOString(),
              reviewed_by: reviewer.id,
            })
            .eq("id", id);
          if (q.error) throw q.error;
          msg(
            decision === "approved"
              ? "Evidence approved and added to the learner profile."
              : "Evidence returned to the learner.",
          );
          load();
        } catch (e) {
          msg(e.message || "Unable to review evidence.", "err");
        }
      }
      document.getElementById("queueSearch").oninput=()=>render(profileRows,evidenceRows);document.getElementById("queueType").onchange=()=>render(profileRows,evidenceRows);document.getElementById("refreshQueue").onclick=()=>load();document.getElementById("fullQueue").onclick=()=>{const on=document.body.classList.toggle("queue-expanded");document.getElementById("fullQueue").textContent=on?"Exit full page":"Full page";};
load();
    </script>
  </body>
