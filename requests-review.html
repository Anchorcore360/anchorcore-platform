<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reviews & Requests | RRTA</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="portal-navigation.css"><style>:root{--red:#b20f22;--ink:#18202a;--muted:#6f7a88;--line:#e2e6ea;--bg:#f4f6f8}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,Arial,sans-serif;color:var(--ink)}.shell{display:grid;grid-template-columns:258px minmax(0,1fr);min-height:100vh}.side{position:sticky;top:0;height:100vh;background:linear-gradient(180deg,#151a22,#1e2530);padding:16px 12px;display:flex;flex-direction:column}.brand{padding:5px 10px 16px;border-bottom:1px solid rgba(255,255,255,.08)}.brand img{width:158px;filter:brightness(0) invert(1)}.spacer{flex:1}.main{min-width:0}.top{height:66px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 28px;justify-content:space-between}.content{padding:26px 30px 60px;max-width:1500px;margin:auto}.head{margin-bottom:18px}.eyebrow{font-size:10px;color:var(--red);font-weight:900;text-transform:uppercase;letter-spacing:.11em}.head h1{margin:5px 0 6px;font-size:30px}.muted{color:var(--muted)}.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:18px}.stat,.panel{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 24px rgba(18,24,33,.05)}.stat{padding:16px}.stat span{display:block;color:var(--muted);font-size:11px}.stat strong{display:block;font-size:27px;margin-top:5px}.panel{padding:20px;margin-bottom:16px}.request-list{display:grid;gap:10px;margin-top:14px}.request{border:1px solid var(--line);border-radius:10px;padding:14px;background:#fafbfc;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center}.request h3{margin:5px 0;font-size:15px}.request p{margin:3px 0;color:var(--muted);font-size:11px}.actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.btn{border:0;border-radius:8px;padding:8px 10px;font-size:10px;font-weight:850;text-decoration:none;cursor:pointer}.dark{background:#20262d;color:#fff}.light{background:#fff;border:1px solid var(--line);color:var(--ink)}.pill{display:inline-flex;border-radius:999px;padding:5px 8px;font-size:9px;font-weight:850}.phone{background:#eef3ff;color:#3448a5}.evidence{background:#fff5db;color:#8a6100}.empty{padding:26px;text-align:center;border:1px dashed var(--line);border-radius:10px;color:var(--muted)}.message{margin-bottom:12px;padding:10px 12px;border-radius:8px;font-size:11px}.ok{background:#e9f7ee;color:#176b37}.err{background:#fdebec;color:#b42318}@media(max-width:1000px){.shell{grid-template-columns:1fr}.side{position:relative;height:auto}.summary{grid-template-columns:1fr}}@media(max-width:700px){.content{padding:20px 14px}.request{grid-template-columns:1fr}.actions{justify-content:flex-start}}</style></head><body data-portal-nav="academy"><div class="shell"><aside class="side"><div class="brand"><img src="rrta-logo.png" alt="RRTA"></div><div class="spacer"></div></aside><main class="main"><header class="top"><strong>RRTA Training Academy Administration</strong><span class="muted">Reviews & Requests</span></header><div class="content"><div class="head"><div class="eyebrow">Academy Action Queue</div><h1>Reviews & Requests</h1><p class="muted">Profile changes and learner evidence that need Academy review.</p></div><div id="summary" class="summary"></div><div id="message"></div><section class="panel"><div class="eyebrow">Profile Changes</div><h2>Profile Change Requests</h2><div id="profileRequests" class="request-list"><div class="empty">Loading requests…</div></div></section><section class="panel"><div class="eyebrow">Compliance Evidence</div><h2>Evidence Submissions</h2><div id="evidenceRequests" class="request-list"><div class="empty">Loading evidence…</div></div></section></div></main></div><script src="portal-navigation.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=window.supabase.createClient('https://qgbpotjqggeodxqcwkgj.supabase.co','sb_publishable_J1yPM1Hi7INCX2m7rp3PdA_JdQ46FRS');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const fmt=d=>d?new Date(d).toLocaleDateString('en-GB'):'—';let reviewer=null;function msg(t,type='ok'){message.innerHTML=`<div class="message ${type}">${esc(t)}</div>`;setTimeout(()=>message.innerHTML='',3500)}async function auth(){const{data:u}=await db.auth.getUser();if(!u?.user){location.href='trainer.html';return false}const{data:p}=await db.from('profiles').select('id,role,permission_level').eq('id',u.user.id).single();if(!p||(String(p.role).toLowerCase()!=='trainer'&&p.permission_level!=='super_user')){location.href='portal.html';return false}reviewer=p;return true}async function load(){if(!await auth())return;const [pr,er]=await Promise.all([db.from('profile_change_requests').select('*,profiles:learner_id(id,full_name,email,employee_number)').eq('status','pending').order('requested_at'),db.from('evidence_review_requests').select('*,profiles:learner_id(id,full_name,email,employee_number)').eq('status','pending').order('submitted_at')]);render(pr.data||[],er.data||[])}function render(p,e){summary.innerHTML=`<div class="stat"><span>Total Pending</span><strong>${p.length+e.length}</strong></div><div class="stat"><span>Profile Changes</span><strong>${p.length}</strong></div><div class="stat"><span>Evidence Reviews</span><strong>${e.length}</strong></div>`;profileRequests.innerHTML=p.length?p.map(r=>`<article class="request"><div><span class="pill phone">Profile Change</span><h3>${esc(r.profiles?.full_name||'Learner')}</h3><p><strong>${esc(String(r.field_name||'Field').replace(/_/g,' '))}:</strong> ${esc(r.current_value||'—')} → <strong>${esc(r.requested_value)}</strong></p><p>Requested ${fmt(r.requested_at)}</p></div><div class="actions"><a class="btn light" href="learner-profile.html?id=${encodeURIComponent(r.learner_id)}">View Profile</a><button class="btn dark" data-approve="${r.id}" data-field="${esc(r.field_name)}" data-value="${esc(r.requested_value)}" data-learner="${r.learner_id}">Approve</button><button class="btn light" data-reject="${r.id}">Decline</button></div></article>`).join(''):'<div class="empty">No pending profile change requests.</div>';evidenceRequests.innerHTML=e.length?e.map(r=>`<article class="request"><div><span class="pill evidence">Evidence Review</span><h3>${esc(r.profiles?.full_name||'Learner')} · ${esc(r.qualification_name||'Qualification')}</h3><p>${esc(r.awarding_body||'')} ${r.certificate_number?'· '+esc(r.certificate_number):''}</p><p>Submitted ${fmt(r.submitted_at)}</p></div><div class="actions"><a class="btn dark" href="evidence-review.html#${encodeURIComponent(r.id)}">Review Evidence</a><a class="btn light" href="learner-profile.html?id=${encodeURIComponent(r.learner_id)}">View Profile</a></div></article>`).join(''):'<div class="empty">No pending evidence reviews.</div>';document.querySelectorAll('[data-approve]').forEach(b=>b.onclick=()=>approve(b));document.querySelectorAll('[data-reject]').forEach(b=>b.onclick=()=>reject(b.dataset.reject))}async function approve(b){if(b.dataset.field!=='phone'){msg('Open the learner profile to approve this request type.','err');return}if(!confirm(`Approve this phone number change to ${b.dataset.value}?`))return;const up=await db.from('profiles').update({phone:b.dataset.value}).eq('id',b.dataset.learner);if(up.error)return msg(up.error.message,'err');const rq=await db.from('profile_change_requests').update({status:'approved',reviewed_at:new Date().toISOString(),reviewed_by:reviewer.id,review_note:'Approved from Reviews & Requests queue'}).eq('id',b.dataset.approve);if(rq.error)return msg(rq.error.message,'err');msg('Profile change approved.');load()}async function reject(id){const note=prompt('Optional reason for declining:','');if(note===null)return;const q=await db.from('profile_change_requests').update({status:'rejected',reviewed_at:new Date().toISOString(),reviewed_by:reviewer.id,review_note:note||'Declined'}).eq('id',id);if(q.error)return msg(q.error.message,'err');msg('Request declined.');load()}load();</script></body></html>
